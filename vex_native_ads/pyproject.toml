
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vex-native-ads"
version = "0.1.0"
description = "Native AdMob extension for VEX AI"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.1.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
namespaces = true

[tool.setuptools.package-data]
"*" = [
    "*.dart",
    "pubspec.yaml",
    "flet-extension.toml"
]
