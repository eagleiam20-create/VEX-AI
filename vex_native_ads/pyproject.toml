[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vex-native-ads"
version = "0.1.0"
description = "Native AdMob extension for VEX AI"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.1.0"
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flutter.vex_native_ads" = [
    "lib/**/*.dart",
    "lib/*.dart",
    "pubspec.yaml",
    "flet-extension.toml"
]
