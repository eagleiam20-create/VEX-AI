
name: Build VEX AI Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build VEX AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build VEX AI
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}
          extra-args: --arch arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: VEX-AI-ARM64-APK
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
