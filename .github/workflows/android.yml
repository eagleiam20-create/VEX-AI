
name: Build VEX AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'vex_ui.py'
      - 'vex_search.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet==1.1.0" flet-cli

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flet-webview

      - name: Verify AdMob dependency removal
        run: |
          if grep -RniE 'google_mobile_ads|vex_native_ads' pyproject.toml requirements.txt; then
            echo "ERROR: AdMob dependency still exists!"
            exit 1
          fi
          echo "No AdMob dependency found in project manifests."

      - name: Build VEX AI APK
        run: |
          flet build apk \
            --yes \
            --verbose \
            --output build_output \
            --build-number 108 \
            --arch arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEX-AI-Android-APK
          path: build_output/**/*.apk
          if-no-files-found: error
          retention-days: 30
