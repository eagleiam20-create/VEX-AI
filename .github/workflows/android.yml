
name: VEX AI - Verify and Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-build-check:
    name: Verify VEX Native Ads Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check project files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              "pyproject.toml",
              "vex_ui.py",
              "vex_native_ads/pyproject.toml",
              "vex_native_ads/src/vex_native_ads/__init__.py",
              "vex_native_ads/src/vex_native_ads/vex_native_ads.py",
              "vex_native_ads/src/flutter/vex_native_ads/pubspec.yaml",
              "vex_native_ads/src/flutter/vex_native_ads/flet-extension.toml",
              "vex_native_ads/src/flutter/vex_native_ads/lib/vex_native_ads.dart",
              "vex_native_ads/src/flutter/vex_native_ads/lib/src/extension.dart",
              "vex_native_ads/src/flutter/vex_native_ads/lib/src/vex_native_ad_control.dart",
          ]

          missing = [f for f in required if not Path(f).is_file()]

          if missing:
              print("MISSING FILES:")
              for f in missing:
                  print(" -", f)
              raise SystemExit(1)

          print("All required files exist.")
          PY

      - name: Validate TOML files
        run: |
          python - <<'PY'
          import tomllib

          for path in [
              "pyproject.toml",
              "vex_native_ads/pyproject.toml",
          ]:
              with open(path, "rb") as f:
                  tomllib.load(f)
              print("Valid TOML:", path)
          PY

      - name: Check Python syntax
        run: |
          python -m compileall -q vex_native_ads/src

      - name: Install app and local extension
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify VEX Native Ads import
        run: |
          python - <<'PY'
          from vex_native_ads import VexNativeAd
          print("VexNativeAd import successful:", VexNativeAd)
          PY

      - name: Verify extension package contents
        run: |
          python - <<'PY'
          from importlib.metadata import distribution

          dist = distribution("vex-native-ads")
          files = [str(f).replace("\\", "/") for f in (dist.files or [])]

          required = [
              "flutter/vex_native_ads/pubspec.yaml",
              "flutter/vex_native_ads/flet-extension.toml",
              "flutter/vex_native_ads/lib/vex_native_ads.dart",
              "flutter/vex_native_ads/lib/src/extension.dart",
              "flutter/vex_native_ads/lib/src/vex_native_ad_control.dart",
          ]

          for item in required:
              if not any(f.endswith(item) for f in files):
                  raise SystemExit("Extension package file missing: " + item)
              print("Included:", item)

          print("Extension packaging check passed.")
          PY

  build-apk:
    name: Build VEX AI APK
    runs-on: ubuntu-latest
    needs: pre-build-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build VEX AI
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}
          extra-args: --arch arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: VEX-AI-ARM64-APK
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
