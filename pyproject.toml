[project]
name = "vex-ai"
version = "1.0.0"
description = "VEX AI - Independent AI Assistant"
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.0",
    "flet-cli==1.1.0",
    "flet-webview",
    "requests",
    "beautifulsoup4",
    "ddgs",
    "vex-native-ads"
]

[tool.flet]
org = "com.aveesharma"
product = "VEX AI"
company = "Avee Sharma"
description = "Independent AI Assistant"
dev_packages = { "vex-native-ads" = "vex_native_ads" }

[tool.flet.app]
module = "vex_ui"
