
[project]
name = "vex-ai"
version = "1.0.0"
description = "VEX AI - Independent AI Assistant"
requires-python = ">=3.10"
dependencies = [
    "flet==1.1.0",
    "flet-webview",
    "flet-ads",
    "requests",
    "beautifulsoup4",
    "ddgs"
]

[dependency-groups]
dev = [
    "flet-cli==1.1.0"
]

[tool.flet]
org = "com.aveesharma"
product = "VEX AI"
company = "Avee Sharma"
description = "Independent AI Assistant"

[tool.flet.app]
module = "vex_ui"

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-9779772194429691~7446823637"
