
<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>VEX AI</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#080808;--line:#252525;--white:#fff;--muted:#999}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{height:100dvh;overflow:hidden}
button,textarea{font:inherit}button{cursor:pointer}
.app{height:100dvh;display:flex;background:#000}
.sidebar{width:270px;flex:0 0 270px;background:#000;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;z-index:5}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:7px 4px 22px}
.brand{font-size:22px;font-weight:900;letter-spacing:3px}
.icon-btn{background:transparent;border:0;color:#fff;font-size:20px;padding:9px;border-radius:10px}
.icon-btn:hover,.history-item:hover{background:#171717}
.new-chat{background:#000;border:1px solid #383838;color:#fff;border-radius:12px;padding:13px;text-align:left}
.new-chat:hover{background:#151515;border-color:#777}
.history-title{font-size:10px;color:#888;margin:25px 8px 10px;letter-spacing:2px}
.history{overflow:auto;flex:1}
.history-item{padding:11px;border-radius:9px;color:#ddd;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}

.main{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh;background:#000}
.topbar{height:60px;min-height:60px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid #171717}
.mobile-brand{display:none;font-weight:900;letter-spacing:2px;margin-right:14px}
.model-label{font-size:14px;font-weight:600}

.viewer-inner iframe{width:min(100%,900px);aspect-ratio:16/9;border:0;background:#111}

textarea{background:transparent;color:#fff;border:0;outline:0;resize:none;flex:1;min-height:30px;max-height:130px;font-size:15px;padding:7px 3px}

.topbar{padding:0 12px}#chat{padding:20px 15px 155px}
.composer-area{padding:22px 12px 12px}.welcome{margin-top:18vh}
.welcome h1{font-size:30px}.user{max-width:90%}.sources{grid-template-columns:1fr}

<script>
'use strict';

const API='https://puri.li';
const chat=document.getElementById('chat');
const input=document.getElementById('question');
const sendButton=document.getElementById('send');
const historyBox=document.getElementById('history');

let conversations=[];
let activeId=null;
let searching=false;

const WELCOME=`
<div class="welcome" id="welcome">
<h1>What can I help with?</h1>
<p>Explore knowledge. Discover ideas. Ask VEX anything.</p>
<div class="suggestions">
<button onclick="quickAsk('Explain artificial intelligence')">Explain AI</button>
<button onclick="quickAsk('Latest space discoveries')">Space</button>
<button onclick="quickAsk('How does the internet work?')">Technology</button>
<button onclick="quickAsk('Explain quantum computing')">Science</button>
</div></div>`;

const STOPWORDS=new Set([
'what','when','where','which','who','whom','whose','with','from','that','this',
'then','than','have','does','doing','about','into','your','you','the','and',
'for','are','was','were','will','would','could','should','can','how','why',
'tell','explain','please','give','show','find','search','information','about',
'its','their','there','they','them','his','her','she','him','is','are','a','an',
'of','in','on','to','by','it','as','at','be','or','not','me','my','we'
]);

function scrollDown(){chat.scrollTop=chat.scrollHeight}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}

function saveHistory(){
 try{localStorage.setItem('vex_chats',JSON.stringify(conversations))}
 catch(e){console.warn('History storage unavailable')}
}
function loadHistory(){
 try{
  const saved=JSON.parse(localStorage.getItem('vex_chats')||'[]');
  conversations=Array.isArray(saved)?saved:[];
 }catch(e){conversations=[]}
 renderHistory();
}
function renderHistory(){
 historyBox.textContent='';
 conversations.forEach(c=>{
  const el=document.createElement('div');
  el.className='history-item';
  el.textContent=c.title||'New chat';
  el.onclick=()=>openChat(c.id);
  historyBox.appendChild(el);
 });
}
function newChat(){
 activeId=null;
 chat.innerHTML=WELCOME;
 input.value='';
 input.style.height='30px';
 document.getElementById('sidebar').classList.remove('open');
 input.focus();
}
function openChat(id){
 const c=conversations.find(x=>x.id===id);
 if(!c)return;
 activeId=id;
 chat.innerHTML='';
 (c.messages||[]).forEach(m=>{
  if(m.type==='user')addUser(m.text,false);
  else if(m.type==='bot')renderBot(m.data,false);
 });
 document.getElementById('sidebar').classList.remove('open');
 scrollDown();
}
function storeMessage(m){
 if(!activeId){
  activeId=String(Date.now());
  conversations.unshift({
   id:activeId,
   title:m.type==='user'?m.text.slice(0,48):'New chat',
   messages:[]
  });
 }
 const c=conversations.find(x=>x.id===activeId);
 if(c)c.messages.push(m);
 saveHistory();
 renderHistory();
}
function addUser(text,save=true){
 document.getElementById('welcome')?.remove();
 const wrap=document.createElement('div');
 wrap.className='message user-wrap';
 const inner=document.createElement('div');
 inner.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:5px';
 const bubble=document.createElement('div');
 bubble.className='user';
 bubble.textContent=text;
 const share=document.createElement('button');
 share.className='icon-btn';
 share.style.cssText='font-size:12px;padding:5px 9px';
 share.textContent='↗ Share question';
 share.onclick=()=>shareText(text);
 inner.append(bubble,share);
 wrap.appendChild(inner);
 chat.appendChild(wrap);
 if(save)storeMessage({type:'user',text});
 scrollDown();
}
async function copyText(text){
 if(navigator.clipboard&&window.isSecureContext){
  await navigator.clipboard.writeText(text);return;
 }
 const area=document.createElement('textarea');
 area.value=text;
 area.style.position='fixed';
 area.style.opacity='0';
 document.body.appendChild(area);
 area.select();
 const ok=document.execCommand('copy');
 area.remove();
 if(!ok)throw new Error('Copy failed');
}
async function shareText(text){
 try{
  if(navigator.share){await navigator.share({title:'VEX AI question',text});return}
 }catch(e){if(e.name==='AbortError')return}
 try{await copyText(text);alert('Question copied. Paste it into another app.')}
 catch(e){alert('Could not share this question.')}
}

function addLabel(parent,text){
 const el=document.createElement('div');
 el.className='label';
 el.textContent=text;
 parent.appendChild(el);
}
function validURL(value){
 try{
  const u=new URL(value);
  return u.protocol==='https:'||u.protocol==='http:';
 }catch(e){return false}
}
function absoluteURL(value){
 try{return new URL(value,API).href}catch(e){return ''}
}

/* ---------- NETWORK ---------- */

function parseResponse(raw,status){
 let data;
 try{data=JSON.parse(raw)}
 catch(e){throw new Error('Search service returned invalid data.')}
 if(status<200||status>=300)throw new Error(data.error||('HTTP '+status));
 return data;
}
function xhrJSON(url,timeout=15000){
 return new Promise((resolve,reject)=>{
  const x=new XMLHttpRequest();
  x.open('GET',url,true);
  x.timeout=timeout;
  x.onload=()=>{
   try{resolve(parseResponse(x.responseText,x.status))}
   catch(e){reject(e)}
  };
  x.onerror=()=>reject(new Error('Network/CORS error'));
  x.ontimeout=()=>reject(new Error('Request timed out'));
  x.send();
 });
}
async function fetchJSON(path,timeout=18000){
 const url=API+path;
 try{
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
   const r=await fetch(url,{
    method:'GET',
    mode:'cors',
    credentials:'omit',
    cache:'no-store',
    signal:controller.signal
   });
   const raw=await r.text();
   return parseResponse(raw,r.status);
  }finally{clearTimeout(timer)}
 }catch(firstError){
  try{return await xhrJSON(url,timeout)}
  catch(secondError){
   throw new Error('Could not connect to search service. '+(secondError.message||firstError.message));
  }
 }
}
async function fetchRetry(path,attempts=2){
 let lastError;
 for(let i=0;i<attempts;i++){
  try{return await fetchJSON(path)}
  catch(e){
   lastError=e;
   if(i+1<attempts)await new Promise(r=>setTimeout(r,800));
  }
 }
 throw lastError||new Error('Request failed');
}

/* ---------- QUERY UNDERSTANDING ---------- */

function words(text){
 return String(text||'').toLowerCase()
  .normalize('NFKD')
  .replace(/[^\p{L}\p{N}\s]/gu,' ')
  .split(/\s+/)
  .filter(w=>w.length>2&&!STOPWORDS.has(w));
}
function unique(arr){
 return [...new Set(arr)];
}
function overlapScore(query,text){
 const q=unique(words(query));
 const t=new Set(words(text));
 if(!q.length)return 0;
 return q.filter(w=>t.has(w)).length/q.length;
}
function cleanText(text){
 return String(text||'')
  .replace(/<script[\s\S]*?<\/script>/gi,' ')
  .replace(/<style[\s\S]*?<\/style>/gi,' ')
  .replace(/<[^>]+>/g,' ')
  .replace(/&nbsp;/g,' ')
  .replace(/&amp;/g,'&')
  .replace(/\s+/g,' ')
  .trim();
}
function splitSentences(text){
 return cleanText(text)
  .split(/(?<=[.!?])\s+|(?<=।)\s+/)
  .map(s=>s.trim())
  .filter(s=>s.length>55&&s.length<650);
}

/* ---------- RELEVANCE FILTER ---------- */

function scoreResult(query,item){
 const title=cleanText(item.title);
 const desc=cleanText(item.description||item.body||item.excerpt);
 const titleScore=overlapScore(query,title);
 const descScore=overlapScore(query,desc);
 const q=unique(words(query));
 const titleWords=new Set(words(title));
 const exact=q.length>0&&q.every(w=>titleWords.has(w));
 return titleScore*5+descScore*2+(exact?4:0);
}
function selectRelevantResults(query,results){
 return results
  .map((item,index)=>({...item,_score:scoreResult(query,item),_index:index}))
  .filter(item=>item._score>=1.1)
  .sort((a,b)=>b._score-a._score||a._index-b._index)
  .slice(0,6);
}

/* ---------- PAGE CONTEXT ---------- */

async function getContext(result){
 try{
  const d=await fetchJSON('/api/context?url='+encodeURIComponent(result.url),14000);
  const passages=Array.isArray(d.passages)?d.passages.join('\n'):'';
  return {
   title:d.title||result.title||'',
   text:[d.summary,d.content,passages].filter(Boolean).join('\n'),
   coverage:d.coverage||'indexed'
  };
 }catch(e){
  return {
   title:result.title||'',
   text:result.description||'',
   coverage:'snippet'
  };
 }
}
async function getInfocard(query){
 try{return await fetchJSON('/api/infocard?q='+encodeURIComponent(query),10000)}
 catch(e){return null}
}

/* ---------- ANSWER COMPOSITION ---------- */

function sentenceScore(query,sentence,title){
 const q=unique(words(query));
 const s=new Set(words(sentence));
 const t=new Set(words(title));
 let score=0;
 for(const w of q){
  if(s.has(w))score+=2;
  if(t.has(w))score+=1;
 }
 if(sentence.length>100&&sentence.length<350)score+=1;
 if(/cookie|privacy policy|subscribe|advertisement|javascript|copyright|all rights reserved/i.test(sentence))score-=8;
 if(/according to|research|study|scientists|because|therefore|consists|contains|formed|caused|known as|is called|refers to/i.test(sentence))score+=1;
 return score;
}
function getBestSentences(query,parts,max=8){
 const pool=[];
 parts.forEach((p,pi)=>{
  splitSentences(p.text).forEach((sentence,si)=>{
   const relevance=overlapScore(query,sentence);
   const score=sentenceScore(query,sentence,p.title);
   if(relevance>=0.20&&score>=2){
    pool.push({sentence,score,relevance,pi,si});
   }
  });
 });
 pool.sort((a,b)=>b.score-a.score||b.relevance-a.relevance||a.pi-b.pi);
 const selected=[];
 const seen=new Set();
 for(const item of pool){
  const key=item.sentence.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,90);
  if(seen.has(key))continue;
  seen.add(key);
  selected.push(item);
  if(selected.length>=max)break;
 }
 return selected;
}
function titleTopic(query,results){
 const best=results.find(x=>x.title)?.title||query;
 let title=cleanText(best);
 title=title.replace(/\s[-|:]\s.*$/,'').trim();
 if(title.length>75)title=title.slice(0,75).trim();
 return title||query;
}
function isHypothesis(sentence){
 return /\bhypothes|theory|may have|might have|could have|possibly|suggests|proposed|believed to|one explanation|not yet confirmed|uncertain\b/i.test(sentence);
}
function formatAnswer(query,parts,card,results){
 const instant=card?.instantAnswer?.answer;
 const facts=Array.isArray(card?.facts)?card.facts.filter(x=>x&&x.label&&x.value).slice(0,4):[];
 const best=getBestSentences(query,parts,8);
 const topic=titleTopic(query,results);
 const lines=[];
 if(instant&&overlapScore(query,instant)>=0.15){
  lines.push('OVERVIEW\n'+cleanText(instant));
 }
 if(facts.length){
  const relevantFacts=facts.filter(f=>overlapScore(query,String(f.label)+' '+String(f.value))>=0.15);
  if(relevantFacts.length){
   lines.push('KEY FACTS\n'+relevantFacts.map(f=>'• '+cleanText(f.label)+': '+cleanText(f.value)).join('\n'));
  }
 }
 if(best.length){
  const normal=best.filter(x=>!isHypothesis(x.sentence));
  const uncertain=best.filter(x=>isHypothesis(x.sentence));
  if(normal.length){
   lines.push('EXPLANATION\n'+normal.slice(0,5).map(x=>'• '+x.sentence).join('\n\n'));
  }
  if(uncertain.length){
   lines.push('THEORIES / UNCERTAIN POINTS\n'+uncertain.slice(0,2).map(x=>'• '+x.sentence).join('\n\n'));
  }
 }
 if(!lines.length){
  const fallback=parts
   .filter(p=>overlapScore(query,p.title+' '+p.text)>=0.12)
   .slice(0,3)
   .map(p=>cleanText(p.text).slice(0,450))
   .filter(Boolean);
  if(fallback.length)lines.push('WHAT THE SOURCES SAY\n'+fallback.join('\n\n'));
 }
 if(!lines.length){
  return 'I found some pages, but their indexed information was not relevant or detailed enough to answer this question confidently. Try asking in a more specific way.';
 }
 lines.push('This is a source-based explanation compiled from relevant indexed pages. Check the sources below for full details.');
 return lines.join('\n\n');
}

/* ---------- FOLLOW-UP QUESTIONS ---------- */

function makeFollowups(query){
 const topic=query
  .replace(/\b(what is|who is|when did|where is|explain|tell me about|how does|how do|why does|why do|please|show me)\b/gi,'')
  .replace(/[?!.]/g,'')
  .trim();
 const clean=topic.length>55?topic.slice(0,55).trim():topic;
 if(!clean)return [];
 const lower=query.toLowerCase();
 let options=[
  `How does ${clean} work?`,
  `Why is ${clean} important?`,
  `What are some interesting facts about ${clean}?`
 ];
 if(/\b(form|formed|formation|origin|created|made|history)\b/i.test(query)){
  options=[
   `What causes ${clean}?`,
   `What evidence explains ${clean}?`,
   `What do scientists still not know about ${clean}?`
  ];
 }else if(/\b(latest|news|today|recent)\b/i.test(query)){
  options=[
   `What happened before this?`,
   `Why is this development important?`,
   `What could happen next?`
  ];
 }
 return options.filter(q=>!lower.includes(q.toLowerCase().replace('?',''))).slice(0,3);
}

/* ---------- IMAGES AND VIDEOS ---------- */

function isImageOnly(q){
 return /\b(images?|pictures?|photos?)\b/i.test(q)&&
 /\b(only|just|show|give|send|find|display)\b/i.test(q)&&
 !/\b(video|videos|explain|describe|what is|who is|how)\b/i.test(q);
}
function isVideo(q){
 return /\b(video|videos|watch|clip|documentary|trailer)\b/i.test(q);
}
function isVideoOnly(q){
 return isVideo(q)&&/\b(only|just|show|give|send|find|play)\b/i.test(q)&&
 !/\b(image|images|picture|pictures|photo|photos|explain)\b/i.test(q);
}
function mediaQuery(q){
 return q.replace(/\b(show|give|send|find|display|me|some|only|just|images?|pictures?|photos?|videos?|clips?|documentary|trailer|of|about)\b/gi,' ')
  .replace(/\s+/g,' ').trim()||q;
}
async function searchImages(query){
 try{
  const d=await fetchJSON('/api/images?q='+encodeURIComponent(query)+'&page=1',14000);
  return (Array.isArray(d.images)?d.images:[]).slice(0,8).map(x=>({
   title:x.title||'Image',
   image:absoluteURL(x.thumbUrl||x.url),
   url:absoluteURL(x.url||x.thumbUrl),
   license:x.license||'',
   source:x.source||'Image source',
   sourceUrl:absoluteURL(x.sourceUrl||x.pageUrl||x.sourcePage||'')
  })).filter(x=>x.image&&x.url);
 }catch(e){
  return [];
 }
}
async function searchVideos(query){
 try{
  const d=await fetchRetry('/api/search?q='+encodeURIComponent('site:youtube.com/watch '+query)+'&page=1&exact=0',2);
  const rows=Array.isArray(d.results)?d.results:[];
  const out=[];
  const seen=new Set();
  for(const x of rows){
   const u=String(x.url||'');
   let id='';
   try{
    const parsed=new URL(u);
    if(parsed.hostname.includes('youtube.com'))id=parsed.searchParams.get('v')||'';
    else if(parsed.hostname==='youtu.be')id=parsed.pathname.slice(1);
   }catch(e){}
   if(!/^[A-Za-z0-9_-]{11}$/.test(id)||seen.has(id))continue;
   seen.add(id);
   out.push({id,title:x.title||'YouTube video',url:u});
   if(out.length>=6)break;
  }
  return out;
 }catch(e){return []}
}

/* ---------- MEDIA VIEWER ---------- */

function openViewer(kind,url,title,source){
 const viewer=document.getElementById('mediaViewer');
 const inner=document.getElementById('viewerInner');
 inner.textContent='';
 if(kind==='video'){
  const frame=document.createElement('iframe');
  frame.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(url)+'?autoplay=1&rel=0';
  frame.title=title||'VEX video';
  frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  frame.allowFullscreen=true;
  inner.appendChild(frame);
 }else{
  const img=document.createElement('img');
  img.src=url;
  img.alt=title||'Image';
  inner.appendChild(img);
 }
 const caption=document.createElement('div');
 caption.className='viewer-caption';
 caption.textContent=title||'';
 inner.appendChild(caption);
 if(source&&validURL(source)){
  const link=document.createElement('a');
  link.className='viewer-source';
  link.href=source;
  link.target='_blank';
  link.rel='noopener noreferrer';
  link.textContent='Open original source';
  inner.appendChild(link);
 }
 viewer.classList.add('open');
 document.body.style.overflow='hidden';
}
function closeViewer(){
 document.getElementById('mediaViewer').classList.remove('open');
 document.getElementById('viewerInner').textContent='';
 document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});

/* ---------- SEARCH FLOW ---------- */

async function runImageSearch(query){
 const topic=mediaQuery(query);
 return {mode:'images',images:await searchImages(topic)};
}
async function runVideoSearch(query,progress){
 progress.textContent='Searching for videos...';
 const videos=await searchVideos(mediaQuery(query));
 return {
  mode:'videos',
  videos,
  note:videos.length?'Select a video to play it inside VEX AI.':'No matching videos were found in the current search index.'
 };
}
async function runSearch(query,progress){
 progress.textContent='Searching the public web index...';
 const [searchData,card]=await Promise.all([
  fetchRetry('/api/search?q='+encodeURIComponent(query)+'&page=1&exact=0',2),
  getInfocard(query)
 ]);
 const all=Array.isArray(searchData.results)?searchData.results:[];
 const results=selectRelevantResults(query,all);
 if(!results.length){
  return {
   answer:card?.instantAnswer?.answer||'I could not find sufficiently relevant pages for this question. Try different or more specific keywords.',
   results:[],
   images:[],
   followups:[]
  };
 }
 progress.textContent='Checking relevant pages...';
 const contexts=await Promise.all(results.slice(0,5).map(getContext));
 const parts=contexts.map((c,i)=>({
  title:c.title||results[i].title||'Web source',
  text:c.text||results[i].description||'',
  coverage:c.coverage
 }));
 progress.textContent='Preparing your explanation...';
 const answer=formatAnswer(query,parts,card,results);
 progress.textContent='Finding related images...';
 const images=await searchImages(query);
 return {
  answer,
  results:results.slice(0,6).map(x=>({
   title:x.title,
   url:x.url,
   description:x.description||x.body||'',
   source:x.source||'WEB SOURCE'
  })),
  images,
  followups:makeFollowups(query)
 };
}

/* ---------- DISPLAY ---------- */

function renderImages(parent,items){
 if(!items?.length)return;
 addLabel(parent,'RELATED IMAGES');
 const gallery=document.createElement('div');
 gallery.className='images';
 items.forEach(item=>{
  if(!validURL(item.image))return;
  const card=document.createElement('div');
  card.className='image-card';
  const button=document.createElement('button');
  button.type='button';
  button.onclick=()=>openViewer('image',item.image,item.title,item.sourceUrl);
  const img=document.createElement('img');
  img.src=item.image;
  img.alt=item.title||'Image';
  img.loading='lazy';
  img.onerror=()=>card.remove();
  const caption=document.createElement('div');
  caption.style.cssText='padding:7px 8px;font-size:11px';
  caption.textContent=item.title||'Image';
  button.append(img,caption);
  card.appendChild(button);
  if(item.license){
   const lic=document.createElement('small');
   lic.textContent='Licence: '+item.license+' · '+item.source;
   card.appendChild(lic);
  }
  gallery.appendChild(card);
 });
 if(gallery.childElementCount)parent.appendChild(gallery);
}
function renderVideos(parent,items){
 if(!items?.length)return;
 addLabel(parent,'RELATED VIDEOS');
 const grid=document.createElement('div');
 grid.className='videos';
 items.forEach(v=>{
  const card=document.createElement('div');
  card.className='video-card';
  const button=document.createElement('button');
  button.type='button';
  button.onclick=()=>openViewer('video',v.id,v.title,v.url);
  const img=document.createElement('img');
  img.src='https://i.ytimg.com/vi/'+encodeURIComponent(v.id)+'/hqdefault.jpg';
  img.alt=v.title;
  img.loading='lazy';
  const title=document.createElement('strong');
  title.textContent=v.title;
  button.append(img,title);
  card.appendChild(button);
  grid.appendChild(card);
 });
 parent.appendChild(grid);
}
function renderSources(parent,items){
 if(!items?.length)return;
 addLabel(parent,'WEB SOURCES');
 const grid=document.createElement('div');
 grid.className='sources';
 items.forEach(item=>{
  if(!validURL(item.url))return;
  const a=document.createElement('a');
  a.className='source';
  a.href=item.url;
  a.target='_blank';
  a.rel='noopener noreferrer';
  const tag=document.createElement('span');
  tag.className='tag';
  tag.textContent=item.source||'WEB SOURCE';
  const title=document.createElement('strong');
  title.textContent=item.title||'Web result';
  const small=document.createElement('small');
  small.textContent=cleanText(item.description||'');
  a.append(tag,title,small);
  grid.appendChild(a);
 });
 if(grid.childElementCount)parent.appendChild(grid);
}
function renderFollowups(parent,items){
 if(!items?.length)return;
 addLabel(parent,'YOU MAY ALSO ASK');
 const box=document.createElement('div');
 box.className='followups';
 items.forEach(q=>{
  const b=document.createElement('button');
  b.type='button';
  b.textContent=q;
  b.onclick=()=>quickAsk(q);
  box.appendChild(b);
 });
 parent.appendChild(box);
}
function renderBot(data,save=true){
 const reply=document.createElement('div');
 reply.className='message bot';

 if(data.mode==='images'){
  if(data.images?.length)renderImages(reply,data.images);
  else reply.textContent='No images were found for this search.';
  chat.appendChild(reply);
  if(save)storeMessage({type:'bot',data});
  scrollDown();return;
 }
 if(data.mode==='videos'){
  if(data.videos?.length)renderVideos(reply,data.videos);
  const note=document.createElement('div');
  note.style.cssText='color:#888;font-size:12px;margin-top:10px';
  note.textContent=data.note||'';
  reply.appendChild(note);
  chat.appendChild(reply);
  if(save)storeMessage({type:'bot',data});
  scrollDown();return;
 }

 addLabel(reply,'VEX AI');
 const answer=document.createElement('div');
 answer.className='answer';
 answer.textContent=data.answer||'No information found.';
 reply.appendChild(answer);

 renderSources(reply,data.results);
 renderImages(reply,data.images);
 renderVideos(reply,data.videos);
 renderFollowups(reply,data.followups);

 const actions=document.createElement('div');
 actions.className='actions';
 const copy=document.createElement('button');
 copy.textContent='Copy answer';
 copy.onclick=()=>copyText(data.answer||'')
  .then(()=>{copy.textContent='Copied';setTimeout(()=>copy.textContent='Copy answer',1300)})
  .catch(()=>{copy.textContent='Copy failed'});
 actions.appendChild(copy);
 reply.appendChild(actions);

 chat.appendChild(reply);
 if(save)storeMessage({type:'bot',data});
 scrollDown();
}

/* ---------- MAIN CHAT ---------- */

async function sendMessage(){
 const query=input.value.trim();
 if(!query||searching)return;

 searching=true;
 sendButton.disabled=true;
 addUser(query);
 input.value='';
 input.style.height='30px';

 const progress=document.createElement('div');
 progress.className='message bot progress';
 progress.textContent='Preparing your search...';
 chat.appendChild(progress);
 scrollDown();

 try{
  let data;
  if(isImageOnly(query)){
   progress.textContent='Searching images...';
   data=await runImageSearch(query);
  }else if(isVideoOnly(query)){
   data=await runVideoSearch(query,progress);
  }else{
   data=await runSearch(query,progress);
   if(isVideo(query)){
    progress.textContent='Finding matching videos...';
    data.videos=await searchVideos(mediaQuery(query));
   }
  }
  progress.remove();
  renderBot(data,true);
 }catch(e){
  progress.classList.remove('progress');
  progress.textContent='VEX could not connect to the search service. Please try again. ('+(e.message||'Network error')+')';
  const retry=document.createElement('button');
  retry.className='icon-btn';
  retry.textContent='↻ Retry';
  retry.onclick=()=>{
   progress.remove();
   input.value=query;
   sendMessage();
  };
  progress.appendChild(retry);
 }finally{
  searching=false;
  sendButton.disabled=false;
  input.focus();
 }
}
function quickAsk(text){
 input.value=text;
 sendMessage();
}

sendButton.addEventListener('click',sendMessage);
input.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});
input.addEventListener('input',function(){
 this.style.height='auto';
 this.style.height=Math.min(this.scrollHeight,130)+'px';
});

loadHistory();
</script>
