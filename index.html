<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>VEX AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,system-ui,sans-serif}body{height:100dvh;overflow:hidden}button,textarea{font:inherit}button{cursor:pointer}
.app{height:100dvh;display:flex;background:#000}.sidebar{width:260px;flex-shrink:0;background:#000;border-right:1px solid #242424;display:flex;flex-direction:column;padding:14px;z-index:5}.side-top{display:flex;justify-content:space-between;align-items:center;padding:7px 4px 22px}.brand{font-size:22px;font-weight:900;letter-spacing:3px}.icon-btn{background:transparent;border:0;color:white;font-size:20px;padding:9px}.new-chat{background:#000;border:1px solid #383838;color:white;border-radius:12px;padding:13px;text-align:left}.history-title{font-size:10px;color:#888;margin:25px 8px 10px;letter-spacing:2px}.history{overflow:auto;flex:1}.history-item{padding:11px;border-radius:9px;color:#ddd;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile{border-top:1px solid #242424;padding:15px 6px 5px}.profile-info{font-size:11px;color:#888;margin-top:6px;line-height:1.8}
.main{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh;background:#000}.topbar{height:60px;min-height:60px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #171717}.mobile-brand{display:none;font-weight:900;letter-spacing:2px;margin-right:12px}.model-label{font-size:14px;font-weight:600}.model-label span{color:#777;font-size:11px;margin-left:8px}
#chat{flex:1;overflow-y:auto;padding:25px 20px 150px;scroll-behavior:smooth}.welcome{max-width:700px;margin:18vh auto 30px;text-align:center}.welcome h1{font-size:38px;margin:0 0 14px}.welcome p{color:#888;font-size:14px}.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:30px}.suggestions button{background:#000;border:1px solid #292929;color:#ddd;border-radius:22px;padding:12px 17px;font-size:12px}
.message{max-width:820px;width:100%;margin:0 auto 25px;line-height:1.75;font-size:15px;overflow-wrap:anywhere}.user-wrap{display:flex;justify-content:flex-end}.user{background:#fff;color:#000;padding:12px 18px;border-radius:21px;max-width:82%;white-space:pre-wrap}.bot{padding:6px 0}.answer{white-space:pre-wrap;line-height:1.85}.label{font-size:10px;letter-spacing:2px;color:#888;margin:20px 0 10px;font-weight:700}
.sources,.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.source,.video-card{display:block;background:#050505;border:1px solid #292929;padding:13px;border-radius:12px;text-decoration:none;color:#fff}.source strong,.video-card strong{font-size:13px;display:block}.source small{font-size:11px;color:#999;display:block;margin-top:6px}.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.image-card{background:#050505;border:1px solid #292929;border-radius:10px;overflow:hidden}.image-card img{width:100%;height:135px;object-fit:cover;display:block}.image-card button{width:100%;border:0;background:transparent;color:white;text-align:left}.image-card small{display:block;padding:8px;color:#aaa}.video-card img{width:100%;aspect-ratio:16/9;object-fit:cover}.video-card a{color:#aaa;font-size:11px}.followups{display:flex;flex-wrap:wrap;gap:8px}.followups button,.actions button{background:#050505;border:1px solid #303030;color:#ddd;border-radius:18px;padding:9px 12px;font-size:11px}.actions{display:flex;gap:8px;margin-top:12px}.progress{color:#aaa;font-size:13px}
.composer-area{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000 22%);padding:30px 20px 17px}.composer{max-width:820px;margin:auto;background:#000;border:1px solid #454545;border-radius:26px;padding:10px 12px;display:flex;gap:10px;align-items:flex-end}.composer:focus-within{border-color:#aaa}textarea{background:transparent;color:#fff;border:0;outline:0;resize:none;flex:1;min-height:30px;max-height:130px;font-size:15px;padding:7px 3px}textarea::placeholder{color:#777}.send{width:39px;height:39px;border:0;border-radius:50%;background:#fff;color:#000;font-size:23px;font-weight:900}.send:disabled{opacity:.4}.bottom-note{text-align:center;color:#666;font-size:10px;margin-top:11px}
.media-viewer{position:fixed;inset:0;z-index:50;background:#000e;display:none;align-items:center;justify-content:center;padding:20px}.media-viewer.open{display:flex}.viewer-inner{width:min(100%,950px);display:flex;flex-direction:column;align-items:center;gap:12px}.viewer-inner img,.viewer-inner iframe,.viewer-inner video{max-width:100%;width:min(100%,900px);max-height:78vh;object-fit:contain;border:0}.viewer-close{position:absolute;top:14px;right:18px;background:#111;color:white;border:1px solid #555;border-radius:50%;width:42px;height:42px;font-size:23px}.viewer-caption{font-size:12px;color:#ddd}
@media(max-width:700px){.sidebar{position:fixed;left:-280px;top:0;bottom:0;transition:left .2s;width:270px}.sidebar.open{left:0}.main{width:100%}.mobile-brand{display:block}.topbar{padding:0 12px}#chat{padding:20px 15px 155px}.composer-area{padding:22px 12px 12px}.welcome{margin-top:18vh}.welcome h1{font-size:30px}.sources{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="side-top"><div class="brand">VEX AI</div><button class="icon-btn" onclick="toggleSidebar()">×</button></div>
 <button class="new-chat" onclick="newChat()">＋ New chat</button>
 <div class="history-title">YOUR CHATS</div><div class="history" id="history"></div>
 <div class="profile"><b>VEX AI</b><div class="profile-info">Owner &amp; Creator: Avee Sharma<br>Experimental model: VEX V6<br>Knowledge: Public web sources</div></div>
</aside>
<main class="main">
 <div class="topbar"><button class="icon-btn" onclick="toggleSidebar()">☰</button><div class="mobile-brand">VEX AI</div><div class="model-label">VEX AI <span>Knowledge Assistant</span></div></div>
 <section id="chat"><div class="welcome" id="welcome"><h1>What can I help with?</h1><p>Explore knowledge. Discover ideas. Ask VEX anything.</p><div class="suggestions"><button onclick="quickAsk('Explain artificial intelligence')">Explain AI</button><button onclick="quickAsk('Latest space discoveries')">Space</button><button onclick="quickAsk('How does the internet work?')">Technology</button><button onclick="quickAsk('Explain quantum computing')">Science</button></div></div></section>
 <div class="composer-area"><div class="composer"><textarea id="question" rows="1" placeholder="Message VEX AI..."></textarea><button class="send" id="send">↑</button></div><div class="bottom-note">VEX AI · Built by Avee Sharma</div></div>
</main>
</div>
<div class="media-viewer" id="mediaViewer" onclick="if(event.target===this)closeViewer()"><button class="viewer-close" onclick="closeViewer()">×</button><div class="viewer-inner" id="viewerInner"></div></div>
<script>
'use strict';
const API='https://puri.li';
const chat=document.getElementById('chat'),input=document.getElementById('question'),sendButton=document.getElementById('send'),historyBox=document.getElementById('history');
let conversations=[],activeId=null,searching=false;
const WELCOME=`<div class="welcome" id="welcome"><h1>What can I help with?</h1><p>Explore knowledge. Discover ideas. Ask VEX anything.</p><div class="suggestions"><button onclick="quickAsk('Explain artificial intelligence')">Explain AI</button><button onclick="quickAsk('Latest space discoveries')">Space</button><button onclick="quickAsk('How does the internet work?')">Technology</button><button onclick="quickAsk('Explain quantum computing')">Science</button></div></div>`;
function scrollDown(){chat.scrollTop=chat.scrollHeight}
function saveHistory(){try{localStorage.setItem('vex_chats',JSON.stringify(conversations))}catch(e){}}
function loadHistory(){try{conversations=JSON.parse(localStorage.getItem('vex_chats')||'[]');if(!Array.isArray(conversations))conversations=[]}catch(e){conversations=[]}renderHistory()}
function renderHistory(){historyBox.textContent='';conversations.forEach(c=>{const el=document.createElement('div');el.className='history-item';el.textContent=c.title||'New chat';el.onclick=()=>openChat(c.id);historyBox.appendChild(el)})}
function newChat(){activeId=null;chat.innerHTML=WELCOME;input.value='';document.getElementById('sidebar').classList.remove('open');input.focus()}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function openChat(id){let c=conversations.find(x=>x.id===id);if(!c)return;activeId=id;chat.innerHTML='';(c.messages||[]).forEach(m=>{if(m.type==='user')addUser(m.text,false);else renderBot(m.data,false)});document.getElementById('sidebar').classList.remove('open')}
function storeMessage(m){let c=conversations.find(x=>x.id===activeId);if(!c){activeId=String(Date.now());c={id:activeId,title:'New chat',messages:[]};conversations.unshift(c)}c.messages.push(m);let first=c.messages.find(x=>x.type==='user');if(first)c.title=first.text.slice(0,35);conversations=conversations.slice(0,30);saveHistory();renderHistory()}
function addUser(text,save=true){const wrap=document.createElement('div');wrap.className='message user-wrap';const b=document.createElement('div');b.className='user';b.textContent=text;wrap.appendChild(b);chat.appendChild(wrap);if(save)storeMessage({type:'user',text});scrollDown()}
function addLabel(parent,text){const x=document.createElement('div');x.className='label';x.textContent=text;parent.appendChild(x)}
function validURL(s){try{return ['http:','https:'].includes(new URL(s).protocol)}catch(e){return false}}
async function fetchJSON(path,timeout=15000){let ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeout);try{let r=await fetch(API+path,{signal:ctrl.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}
async function getContext(x){try{return await fetchJSON('/api/context?url='+encodeURIComponent(x.url),12000)}catch(e){return {content:x.description||'',summary:''}}}
async function searchImages(q){try{let d=await fetchJSON('/api/images?q='+encodeURIComponent(q)+'&page=1');return (d.images||[]).slice(0,8).map(x=>({title:x.title||'Image',image:x.thumbUrl||x.url,url:x.url,source:x.source||'Web image'})).filter(x=>validURL(x.image))}catch(e){return []}}
function isVideo(q){return /\b(video|videos|watch|clip|documentary|trailer)\b/i.test(q)}
function isOnlyMedia(q,word){return new RegExp('\\b(only|just|show|give|send|find|play)\\b','i').test(q)&&new RegExp('\\b'+word+'s?\\b','i').test(q)&&!new RegExp(word==='video'?'\\b(image|photo|picture|explain)\\b':'\\b(video|explain|describe)\\b','i').test(q)}
function mediaQuery(q){return q.replace(/\b(show|give|send|find|display|me|some|only|just|images?|pictures?|photos?|videos?|clips?|documentary|trailer|of|about)\b/gi,' ').replace(/\s+/g,' ').trim()||q}
function openViewer(kind,url,title,source){const box=document.getElementById('viewerInner');box.textContent='';if(kind==='image'){let img=document.createElement('img');img.src=url;img.alt=title;box.appendChild(img)}else{let frame=document.createElement('iframe');frame.src=url;frame.title=title;frame.allow='autoplay; encrypted-media; picture-in-picture';frame.allowFullscreen=true;box.appendChild(frame)}let cap=document.createElement('div');cap.className='viewer-caption';cap.textContent=title||'';box.appendChild(cap);if(source){let a=document.createElement('a');a.href=source;a.target='_blank';a.rel='noopener';a.textContent='Open source';a.style.color='#aaa';box.appendChild(a)}document.getElementById('mediaViewer').classList.add('open')}
function closeViewer(){document.getElementById('mediaViewer').classList.remove('open');document.getElementById('viewerInner').textContent=''}
async function searchVideos(q){let terms=[q+' video',q+' watch',q+' tutorial video'];let batches=await Promise.all(terms.map(async t=>{try{return (await fetchJSON('/api/search?q='+encodeURIComponent(t)+'&page=1&exact=0')).results||[]}catch(e){return []}}));let out=[],seen=new Set();for(let x of batches.flat()){if(!validURL(x.url)||seen.has(x.url))continue;seen.add(x.url);let title=x.title||'Video';if(!/video|watch|youtube|vimeo|trailer|documentary|stream/i.test(title+' '+x.url))continue;let id='';try{let u=new URL(x.url);if(u.hostname.includes('youtu.be'))id=u.pathname.slice(1);else if(u.hostname.includes('youtube.com'))id=u.searchParams.get('v')||''}catch(e){}out.push({title,url:id?'https://www.youtube-nocookie.com/embed/'+id:x.url,source:x.url,thumbnail:id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':''});if(out.length>=8)break}return out}
function answerFromSources(query,parts){let text=parts.map(x=>x.text).filter(Boolean).join('\n\n');if(!text)return 'I could not find enough indexed information. Try a different query.';let lines=text.replace(/\r/g,'').split(/\n+|(?<=[.!?])\s+/).map(x=>x.trim()).filter(x=>x.length>45);let words=query.toLowerCase().split(/\W+/).filter(x=>x.length>3);let ranked=lines.map((s,i)=>({s,i,n:words.filter(w=>s.toLowerCase().includes(w)).length})).sort((a,b)=>b.n-a.n||a.i-b.i);let picked=ranked.slice(0,8).map(x=>x.s);return 'EXPLANATION\n'+picked.join('\n\n')+'\n\nNote: This is compiled from indexed web material, not generated by the VEX V6 language model.'}
async function runSearch(q,progress){progress.textContent='Searching the web...';let d=await fetchJSON('/api/search?q='+encodeURIComponent(q)+'&page=1&exact=0');let results=(d.results||[]).filter(x=>validURL(x.url)).slice(0,8);if(!results.length)return {answer:'No matching web pages were found. Try another query.',results:[],images:[]};progress.textContent='Reading sources...';let selected=results.slice(0,5),contexts=await Promise.all(selected.map(getContext));let parts=contexts.map((c,i)=>({text:[c.summary,c.content,Array.isArray(c.passages)?c.passages.join('\n'):''].filter(Boolean).join('\n')||selected[i].description||''}));progress.textContent='Finding related images...';let images=await searchImages(q);return {answer:answerFromSources(q,parts),results,images}}
function renderBot(data,save=true){let reply=document.createElement('div');reply.className='message bot';if(data.mode==='images'){addLabel(reply,'IMAGES');let grid=document.createElement('div');grid.className='images';(data.images||[]).forEach(x=>{let card=document.createElement('div');card.className='image-card';let b=document.createElement('button');b.onclick=()=>openViewer('image',x.image,x.title,x.url);let im=document.createElement('img');im.src=x.image;im.alt=x.title;im.loading='lazy';let cap=document.createElement('small');cap.textContent=x.title;b.append(im,cap);card.appendChild(b);grid.appendChild(card)});reply.appendChild(grid)}else if(data.mode==='videos'){addLabel(reply,'VIDEOS');let grid=document.createElement('div');grid.className='videos';(data.videos||[]).forEach(v=>{let card=document.createElement('div');card.className='video-card';let b=document.createElement('button');b.onclick=()=>openViewer('video',v.url,v.title,v.source);if(v.thumbnail){let im=document.createElement('img');im.src=v.thumbnail;im.alt=v.title;b.appendChild(im)}let t=document.createElement('strong');t.textContent=v.title;b.appendChild(t);card.appendChild(b);let a=document.createElement('a');a.href=v.source;a.target='_blank';a.rel='noopener';a.textContent='Open source';card.appendChild(a);grid.appendChild(card)});reply.appendChild(grid)}else{addLabel(reply,'VEX AI');let a=document.createElement('div');a.className='answer';a.textContent=data.answer||'No information found';reply.appendChild(a);if(data.results?.length){addLabel(reply,'WEB SOURCES');let grid=document.createElement('div');grid.className='sources';data.results.forEach(x=>{let a=document.createElement('a');a.className='source';a.href=x.url;a.target='_blank';a.rel='noopener';let s=document.createElement('strong');s.textContent=x.title||'Web source';let d=document.createElement('small');d.textContent=x.description||x.url;a.append(s,d);grid.appendChild(a)});reply.appendChild(grid)}if(data.images?.length){addLabel(reply,'RELATED IMAGES');let grid=document.createElement('div');grid.className='images';data.images.forEach(x=>{let card=document.createElement('div');card.className='image-card';let b=document.createElement('button');b.onclick=()=>openViewer('image',x.image,x.title,x.url);let im=document.createElement('img');im.src=x.image;im.alt=x.title;im.loading='lazy';let cap=document.createElement('small');cap.textContent=x.title;b.append(im,cap);card.appendChild(b);grid.appendChild(card)});reply.appendChild(grid)}}chat.appendChild(reply);if(save)storeMessage({type:'bot',data});scrollDown()}
async function sendMessage(){let q=input.value.trim();if(!q||searching)return;searching=true;sendButton.disabled=true;addUser(q);input.value='';input.style.height='30px';let p=document.createElement('div');p.className='message bot progress';p.textContent='Preparing search...';chat.appendChild(p);scrollDown();try{let data;if(isOnlyMedia(q,'image'))data={mode:'images',images:await searchImages(mediaQuery(q))};else if(isOnlyMedia(q,'video'))data={mode:'videos',videos:await searchVideos(mediaQuery(q))};else{data=await runSearch(q,p);if(isVideo(q))data.videos=await searchVideos(mediaQuery(q))}p.remove();renderBot(data,true)}catch(e){p.textContent='VEX search error: '+e.message+'. Try again later.'}finally{searching=false;sendButton.disabled=false;input.focus()}}
function quickAsk(q){input.value=q;sendMessage()}
sendButton.addEventListener('click',sendMessage);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,130)+'px'});loadHistory();
</script>
<script src="vex_builder.js"></script>
</body>
</html>
