<style>

<script>
'use strict';

const API='https://puri.li';
const chat=document.getElementById('chat');
const input=document.getElementById('question');
const sendButton=document.getElementById('send');
const historyBox=document.getElementById('history');

let conversations=[];
let activeId=null;
let searching=false;

const WELCOME=`
<div class="welcome" id="welcome">
<h1>What can I help with?</h1>
<p>Explore knowledge. Discover ideas. Ask VEX anything.</p>
<div class="suggestions">
<button onclick="quickAsk('Explain artificial intelligence')">Explain AI</button>
<button onclick="quickAsk('Latest space discoveries')">Space</button>
<button onclick="quickAsk('How does the internet work?')">Technology</button>
<button onclick="quickAsk('Explain quantum computing')">Science</button>
</div>
</div>`;

function scrollDown(){
 chat.scrollTop=chat.scrollHeight;
}

function saveHistory(){
 try{
  localStorage.setItem('vex_chats',JSON.stringify(conversations));
 }catch(e){}
}

function loadHistory(){
 try{
  const saved=JSON.parse(localStorage.getItem('vex_chats')||'[]');
  conversations=Array.isArray(saved)?saved:[];
 }catch(e){
  conversations=[];
 }
 renderHistory();
}

function renderHistory(){
 historyBox.textContent='';
 conversations.forEach(c=>{
  const el=document.createElement('div');
  el.className='history-item';
  el.textContent=c.title||'New chat';
  el.onclick=()=>openChat(c.id);
  historyBox.appendChild(el);
 });
}

function newChat(){
 activeId=null;
 chat.innerHTML=WELCOME;
 input.value='';
 input.style.height='30px';
 document.getElementById('sidebar').classList.remove('open');
 input.focus();
}

function toggleSidebar(){
 document.getElementById('sidebar').classList.toggle('open');
}

function openChat(id){
 const c=conversations.find(x=>x.id===id);
 if(!c)return;

 activeId=id;
 chat.innerHTML='';

 (c.messages||[]).forEach(m=>{
  if(m.type==='user')addUser(m.text,false);
  if(m.type==='bot')renderBot(m.data,false);
 });

 document.getElementById('sidebar').classList.remove('open');
 scrollDown();
}

function storeMessage(m){
 if(!activeId){
  activeId=String(Date.now());
  conversations.unshift({
   id:activeId,
   title:m.type==='user'?m.text.slice(0,48):'New chat',
   messages:[]
  });
 }

 const c=conversations.find(x=>x.id===activeId);
 if(c)c.messages.push(m);

 saveHistory();
 renderHistory();
}

function addUser(text,save=true){
 document.getElementById('welcome')?.remove();

 const wrap=document.createElement('div');
 wrap.className='message user-wrap';

 const bubble=document.createElement('div');
 bubble.className='user';
 bubble.textContent=text;

 wrap.appendChild(bubble);
 chat.appendChild(wrap);

 if(save)storeMessage({type:'user',text});
 scrollDown();
}

async function copyText(text){
 if(navigator.clipboard&&window.isSecureContext){
  await navigator.clipboard.writeText(text);
  return;
 }

 const area=document.createElement('textarea');
 area.value=text;
 area.style.position='fixed';
 area.style.opacity='0';
 document.body.appendChild(area);
 area.select();

 const ok=document.execCommand('copy');
 area.remove();

 if(!ok)throw new Error('Copy failed');
}

function addLabel(parent,text){
 const el=document.createElement('div');
 el.className='label';
 el.textContent=text;
 parent.appendChild(el);
}

function absoluteURL(value){
 try{
  return new URL(value,API).href;
 }catch(e){
  return '';
 }
}

function validURL(value){
 try{
  const u=new URL(value);
  return u.protocol==='https:'||u.protocol==='http:';
 }catch(e){
  return false;
 }
}

function safeHost(url){
 try{return new URL(url).hostname.replace(/^www\./,'')}
 catch(e){return 'WEB SOURCE'}
}

function addSource(parent,item){
 const url=absoluteURL(item.url);
 if(!validURL(url))return;

 const a=document.createElement('a');
 a.className='source';
 a.href=url;
 a.target='_blank';
 a.rel='noopener noreferrer';

 const tag=document.createElement('span');
 tag.className='tag';
 tag.textContent=item.source||safeHost(url);

 const title=document.createElement('strong');
 title.textContent=item.title||'Web result';

 const small=document.createElement('small');
 small.textContent=item.description||'Open original source';

 a.append(tag,title,small);
 parent.appendChild(a);
}

async function fetchJSON(path,timeoutMs=15000){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),timeoutMs);

 try{
  const response=await fetch(API+path,{
   method:'GET',
   mode:'cors',
   credentials:'omit',
   cache:'no-store',
   signal:controller.signal,
   headers:{'Accept':'application/json'}
  });

  const raw=await response.text();
  let data;

  try{
   data=JSON.parse(raw);
  }catch(e){
   throw new Error('Search service returned invalid JSON.');
  }

  if(!response.ok){
   throw new Error(data.error||('HTTP '+response.status));
  }

  return data;
 }finally{
  clearTimeout(timer);
 }
}

async function fetchWithRetry(path,attempts=2){
 let last;

 for(let i=0;i<attempts;i++){
  try{
   return await fetchJSON(path);
  }catch(e){
   last=e;
   if(i+1<attempts){
    await new Promise(r=>setTimeout(r,700*(i+1)));
   }
  }
 }

 throw last||new Error('Request failed');
}

function getWords(query){
 const ignored=[
 'what','when','where','which','who','whom','whose',
 'with','from','that','this','then','than','have',
 'does','doing','about','into','your','you','the',
 'and','for','are','was','were','will','would',
 'could','should','can','how','why','tell','explain',
 'please','give','show','tell','me','more'
 ];

 return query.toLowerCase()
 .normalize('NFKD')
 .replace(/[^\p{L}\p{N}\s]/gu,' ')
 .split(/\s+/)
 .filter(w=>w.length>2&&!ignored.includes(w));
}

function extractRelevant(text,query,maxChars=4500){
 if(!text)return '';

 const words=getWords(query);

 const chunks=text.replace(/\r/g,'')
 .split(/\n+|(?<=[.!?])\s+/)
 .map(s=>s.trim())
 .filter(s=>s.length>45);

 const scored=chunks.map((s,i)=>{
  const low=s.toLowerCase();
  let score=0;

  words.forEach(w=>{
   if(low.includes(w))score+=2;
  });

  if(words.length>1&&words.every(w=>low.includes(w))){
   score+=3;
  }

  return {s,score,i};
 }).filter(x=>x.score>0)
 .sort((a,b)=>b.score-a.score||a.i-b.i);

 const chosen=[];
 const seen=new Set();
 let size=0;

 for(const x of scored){
  const key=x.s.toLowerCase().slice(0,100);
  if(seen.has(key))continue;
  seen.add(key);

  if(size+x.s.length>maxChars)continue;

  chosen.push(x.s);
  size+=x.s.length;

  if(chosen.length>=9)break;
 }

 return chosen.join('\n\n');
}

async function getContext(result){
 try{
  const d=await fetchJSON(
   '/api/context?url='+encodeURIComponent(result.url),
   12000
  );

  return {
   title:d.title||result.title,
   text:[
    d.summary,
    d.content,
    Array.isArray(d.passages)?d.passages.join('\n'):''
   ].filter(Boolean).join('\n'),
   coverage:d.coverage||'unknown'
  };
 }catch(e){
  return {
   title:result.title,
   text:result.description||'',
   coverage:'search-snippet-fallback'
  };
 }
}

async function getInfocard(query){
 try{
  return await fetchJSON(
   '/api/infocard?q='+encodeURIComponent(query),
   9000
  );
 }catch(e){
  return null;
 }
}

/* IMAGE SEARCH */

async function searchImages(query){
 try{
  const d=await fetchJSON(
   '/api/images?q='+encodeURIComponent(query)+'&page=1',
   12000
  );

  const list=Array.isArray(d.images)?d.images:[];

  return list.slice(0,8).map(x=>({
   title:x.title||'Image',
   image:absoluteURL(x.thumbUrl||x.url),
   full:absoluteURL(x.url||x.thumbUrl),
   license:x.license||'License not provided',
   creator:x.creator||x.author||'',
   source:x.source||'Wikimedia Commons'
  })).filter(x=>validURL(x.image)&&validURL(x.full));

 }catch(e){
  return [];
 }
}

/* IMAGE ONLY DETECTION */

function isImageOnlyRequest(q){
 const s=q.toLowerCase().trim();

 const imageWords=/\b(image|images|picture|pictures|photo|photos|wallpaper|wallpapers)\b/i;
 const videoWords=/\b(video|videos|movie|movies|documentary|tutorial)\b/i;

 if(videoWords.test(s))return false;

 return imageWords.test(s)&&
 (
  /\b(only|just|show|give|send|display|find|get)\b/i.test(s)||
  /^(image|images|picture|pictures|photo|photos)\b/i.test(s)
 );
}

/* VIDEO SEARCH */

function isVideoRequest(q){
 return /\b(video|videos|watch|documentary|tutorial|clip|clips|movie|movies)\b/i.test(q);
}

function cleanVideoQuery(q){
 return q.replace(/\b(show|give|find|search|watch|play|send|me|some|a|the|video|videos|clip|clips|please)\b/gi,' ')
 .replace(/\s+/g,' ').trim();
}

function youtubeId(url){
 try{
  const u=new URL(url);
  if(u.hostname.includes('youtu.be')){
   return u.pathname.split('/').filter(Boolean)[0]||'';
  }
  if(u.hostname.includes('youtube.com')){
   if(u.pathname==='/watch')return u.searchParams.get('v')||'';
   const parts=u.pathname.split('/').filter(Boolean);
   if(['embed','shorts','live'].includes(parts[0]))return parts[1]||'';
  }
 }catch(e){}
 return '';
}

async function searchVideos(query){
 const topic=cleanVideoQuery(query)||query;
 const searches=[
  'site:youtube.com/watch '+topic,
  'site:youtu.be '+topic
 ];

 let all=[];

 for(const q of searches){
  try{
   const d=await fetchJSON(
    '/api/search?q='+encodeURIComponent(q)+'&page=1&exact=0',
    12000
   );

   if(Array.isArray(d.results))all=all.concat(d.results);
  }catch(e){}
 }

 const seen=new Set();
 const videos=[];

 for(const item of all){
  const url=absoluteURL(item.url);
  const id=youtubeId(url);

  if(!id||seen.has(id))continue;
  seen.add(id);

  videos.push({
   id,
   title:item.title||'Video',
   url,
   description:item.description||'',
   source:'YouTube'
  });

  if(videos.length>=6)break;
 }

 return videos;
}

/* RELATED QUESTIONS */

function makeRelatedQuestions(query,results){
 const words=getWords(query);
 const titleWords=[];

 (results||[]).slice(0,4).forEach(r=>{
  getWords(r.title||'').forEach(w=>{
   if(!words.includes(w)&&!titleWords.includes(w)){
    titleWords.push(w);
   }
  });
 });

 const topic=words.slice(0,3).join(' ')||query;
 const extra=titleWords.slice(0,2);

 const candidates=[
  'How does '+topic+' work in real life?',
  'What are the main benefits and limitations of '+topic+'?',
  extra.length
   ?'How is '+extra.join(' ')+' connected to '+topic+'?'
   :'What are some real-world examples of '+topic+'?'
 ];

 return [...new Set(candidates)].slice(0,3);
}

/* BUILD EXPLANATION */

function buildExplanation(query,parts,card){
 const instant=card?.instantAnswer?.answer;
 const facts=Array.isArray(card?.facts)
  ?card.facts.filter(x=>x&&x.label&&x.value).slice(0,5)
  :[];

 const relevant=parts.map(p=>({
  title:p.title,
  text:extractRelevant(p.text,query,1400)
 })).filter(p=>p.text);

 let output='';

 if(instant){
  output+='DIRECT ANSWER\n'+String(instant).trim();
 }

 if(facts.length){
  if(output)output+='\n\n';
  output+='KEY FACTS\n';
  output+=facts.map(f=>'• '+f.label+': '+f.value).join('\n');
 }

 if(relevant.length){
  if(output)output+='\n\n';
  output+='DETAILED EXPLANATION\n';

  output+=relevant.slice(0,4).map((p,i)=>{
   return (i+1)+'. '+p.text;
  }).join('\n\n');
 }

 if(!output){
  output='I found related web pages, but their indexed text did not contain enough information to prepare a reliable explanation. Please open the sources below.';
 }

 return output.trim();
}

/* NORMAL WEB SEARCH */

async function runSearch(query,progress){
 progress.textContent='Searching the web...';

 const [searchData,card]=await Promise.all([
  fetchWithRetry(
   '/api/search?q='+encodeURIComponent(query)+'&page=1&exact=0',
   2
  ),
  getInfocard(query)
 ]);

 const results=Array.isArray(searchData.results)
  ?searchData.results:[ ];

 if(!results.length){
  return {
   answer:card?.instantAnswer?.answer||
    'I could not find matching pages in the available web index. Try a more specific question.',
   results:[],
   images:[],
   related:[],
   note:'No matching indexed pages were returned.'
  };
 }

 progress.textContent='Reading relevant web pages...';

 const selected=results.slice(0,5);
 const contexts=await Promise.all(selected.map(getContext));

 const parts=contexts.map((c,i)=>({
  title:c.title||selected[i].title||'Web source',
  text:c.text||selected[i].description||'',
  url:selected[i].url,
  coverage:c.coverage
 }));

 progress.textContent='Preparing the explanation...';

 const answer=buildExplanation(query,parts,card);

 progress.textContent='Finding related images...';

 const images=await searchImages(query);

 return {
  answer,
  results:results.slice(0,8).map(x=>({
   title:x.title,
   url:x.url,
   description:x.description||x.displayUrl||'',
   source:x.source||'WEB INDEX'
  })),
  images,
  related:makeRelatedQuestions(query,results)
 };
}

/* RENDER IMAGES */

function openViewer(url,title){
 const viewer=document.getElementById('imageViewer');
 document.getElementById('viewerImage').src=url;
 document.getElementById('viewerTitle').textContent=title||'';
 viewer.classList.add('open');
}

function closeViewer(){
 document.getElementById('imageViewer').classList.remove('open');
 document.getElementById('viewerImage').src='';
}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeViewer();
});

function renderImages(parent,images){
 if(!images?.length)return;

 addLabel(parent,'RELATED IMAGES');

 const gallery=document.createElement('div');
 gallery.className='images';

 images.forEach(item=>{
  if(!validURL(item.image)||!validURL(item.full))return;

  const card=document.createElement('div');
  card.className='image-card';

  const button=document.createElement('button');
  button.className='image-open';
  button.onclick=()=>openViewer(item.full,item.title);

  const img=document.createElement('img');
  img.src=item.image;
  img.alt=item.title||'Image';
  img.loading='lazy';
  img.onerror=()=>card.remove();

  button.appendChild(img);

  const title=document.createElement('div');
  title.className='image-caption';
  title.textContent=item.title||'Image';

  const credit=document.createElement('div');
  credit.className='image-credit';
  credit.textContent=
   (item.creator?item.creator+' · ':'')+
   item.license+' · '+item.source;

  card.append(button,title,credit);
  gallery.appendChild(card);
 });

 if(gallery.childElementCount)parent.appendChild(gallery);
}

/* RENDER VIDEOS */

function renderVideos(parent,videos){
 if(!videos?.length){
  const msg=document.createElement('div');
  msg.style.cssText='color:#999;font-size:12px;margin-top:10px';
  msg.textContent='No matching YouTube videos were found in the indexed search results. Try another search phrase.';
  parent.appendChild(msg);
  return;
 }

 addLabel(parent,'RELATED VIDEOS');

 const grid=document.createElement('div');
 grid.className='videos';

 videos.forEach(v=>{
  const card=document.createElement('div');
  card.className='video-card';

  const frame=document.createElement('iframe');
  frame.className='video-frame';
  frame.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.id);
  frame.title=v.title;
  frame.loading='lazy';
  frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  frame.referrerPolicy='strict-origin-when-cross-origin';
  frame.allowFullscreen=true;

  const info=document.createElement('div');
  info.className='video-info';

  const title=document.createElement('strong');
  title.textContent=v.title;

  const description=document.createElement('small');
  description.textContent=v.description||'YouTube video';

  const link=document.createElement('a');
  link.className='video-link';
  link.href=v.url;
  link.target='_blank';
  link.rel='noopener noreferrer';
  link.textContent='Open original video';

  info.append(title,description,link);
  card.append(frame,info);
  grid.appendChild(card);
 });

 parent.appendChild(grid);
}

/* RENDER RELATED QUESTIONS */

function renderRelated(parent,questions){
 if(!questions?.length)return;

 addLabel(parent,'EXPLORE FURTHER');

 const box=document.createElement('div');
 box.className='related';

 questions.forEach(q=>{
  const button=document.createElement('button');
  button.textContent='↗  '+q;
  button.onclick=()=>quickAsk(q);
  box.appendChild(button);
 });

 parent.appendChild(box);
}

/* MAIN BOT RESPONSE */

function renderBot(data,save=true){
 const reply=document.createElement('div');
 reply.className='message bot';

 addLabel(reply,'VEX AI');

 if(data.imageOnly){
  renderImages(reply,data.images);
 }else if(data.videoOnly){
  renderVideos(reply,data.videos);
 }else{
  const answer=document.createElement('div');
  answer.className='answer';
  answer.textContent=data.answer||'No information found.';
  reply.appendChild(answer);

  if(data.results?.length){
   addLabel(reply,'WEB SOURCES');

   const grid=document.createElement('div');
   grid.className='sources';

   data.results.forEach(item=>addSource(grid,item));
   reply.appendChild(grid);
  }

  renderImages(reply,data.images);
  renderVideos(reply,data.videos);
  renderRelated(reply,data.related);
 }

 const actions=document.createElement('div');
 actions.className='actions';

 const copy=document.createElement('button');
 copy.textContent='Copy answer';
 copy.onclick=()=>{
  copyText(data.answer||'').then(()=>{
   copy.textContent='Copied';
   setTimeout(()=>copy.textContent='Copy answer',1400);
  }).catch(()=>copy.textContent='Copy failed');
 };

 actions.appendChild(copy);
 reply.appendChild(actions);

 chat.appendChild(reply);

 if(save)storeMessage({type:'bot',data});
 scrollDown();
}

/* SEND MESSAGE */

async function sendMessage(){
 const query=input.value.trim();

 if(!query||searching)return;

 searching=true;
 sendButton.disabled=true;

 addUser(query);

 input.value='';
 input.style.height='30px';

 const progress=document.createElement('div');
 progress.className='message bot progress';
 progress.textContent='Preparing your search...';

 chat.appendChild(progress);
 scrollDown();

 try{
  let data;

  if(isImageOnlyRequest(query)){
   progress.textContent='Searching for images...';

   data={
    imageOnly:true,
    images:await searchImages(query)
   };

  }else if(isVideoRequest(query)){
   progress.textContent='Searching for relevant videos...';

   data={
    videoOnly:true,
    videos:await searchVideos(query)
   };

  }else{
   data=await runSearch(query,progress);
  }

  progress.remove();
  renderBot(data,true);

 }catch(e){
  progress.classList.remove('progress');

  progress.textContent=
   'VEX could not connect to the search service. '+
   (e.name==='AbortError'?'The request timed out.':e.message||'Network request failed.')+
   ' Check your internet connection and try again.';

  const retry=document.createElement('button');
  retry.className='icon-btn';
  retry.textContent='↻ Retry';

  retry.onclick=()=>{
   progress.remove();
   input.value=query;
   sendMessage();
  };

  progress.appendChild(document.createTextNode(' '));
  progress.appendChild(retry);

 }finally{
  searching=false;
  sendButton.disabled=false;
  input.focus();
 }
}

function quickAsk(text){
 input.value=text;
 sendMessage();
}

sendButton.addEventListener('click',sendMessage);

input.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

input.addEventListener('input',function(){
 this.style.height='auto';
 this.style.height=Math.min(this.scrollHeight,130)+'px';
});

loadHistory();
</script>
</body>
</html>
