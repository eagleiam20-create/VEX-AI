
<!DOCTYPE html>

<style>
:root{color-scheme:dark;--bg:#000;--line:#252525;--white:#fff;--muted:#999}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{height:100dvh;overflow:hidden}
button,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;background:#000}

.brand{font-size:22px;font-weight:900;letter-spacing:3px}

.history-item{padding:11px;border-radius:9px;color:#ddd;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}

<script>
'use strict';

const API='https://puri.li';
const chat=document.getElementById('chat');
const input=document.getElementById('question');
const sendButton=document.getElementById('send');
const historyBox=document.getElementById('history');

let conversations=[];
let activeId=null;
let searching=false;

const WELCOME=`<div class="welcome" id="welcome">
<h1>What can I help with?</h1><p>Explore knowledge. Discover ideas. Ask VEX anything.</p>
<div class="suggestions">
<button onclick="quickAsk('Explain artificial intelligence')">Explain AI</button>
<button onclick="quickAsk('Latest space discoveries')">Space</button>
<button onclick="quickAsk('How does the internet work?')">Technology</button>
<button onclick="quickAsk('Explain quantum computing')">Science</button>
</div></div>`;

function scrollDown(){chat.scrollTop=chat.scrollHeight}
function saveHistory(){try{localStorage.setItem('vex_chats',JSON.stringify(conversations))}catch(e){}}
function loadHistory(){
 try{const x=JSON.parse(localStorage.getItem('vex_chats')||'[]');conversations=Array.isArray(x)?x:[]}catch(e){conversations=[]}
 renderHistory();
}
function renderHistory(){
 historyBox.textContent='';
 conversations.forEach(c=>{
  const el=document.createElement('div');
  el.className='history-item';el.textContent=c.title||'New chat';
  el.onclick=()=>openChat(c.id);historyBox.appendChild(el);
 });
}
function newChat(){
 activeId=null;chat.innerHTML=WELCOME;input.value='';input.style.height='30px';
 document.getElementById('sidebar').classList.remove('open');input.focus();
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function openChat(id){
 const c=conversations.find(x=>x.id===id);if(!c)return;
 activeId=id;chat.innerHTML='';
 (c.messages||[]).forEach(m=>{
  if(m.type==='user')addUser(m.text,false);
  else if(m.type==='bot')renderBot(m.data,false);
 });
 document.getElementById('sidebar').classList.remove('open');scrollDown();
}
function storeMessage(message){
 if(!activeId){
  activeId=String(Date.now());
  conversations.unshift({id:activeId,title:message.type==='user'?message.text.slice(0,48):'New chat',messages:[]});
 }
 const c=conversations.find(x=>x.id===activeId);
 if(c)c.messages.push(message);
 saveHistory();renderHistory();
}
function addUser(text,save=true){
 document.getElementById('welcome')?.remove();
 const wrap=document.createElement('div');wrap.className='message user-wrap';
 const inner=document.createElement('div');inner.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:5px';
 const bubble=document.createElement('div');bubble.className='user';bubble.textContent=text;
 const share=document.createElement('button');share.className='icon-btn';share.style.cssText='font-size:12px;padding:5px 9px';
 share.textContent='↗ Share question';share.onclick=()=>shareText(text);
 inner.append(bubble,share);wrap.appendChild(inner);chat.appendChild(wrap);
 if(save)storeMessage({type:'user',text});scrollDown();
}
async function shareText(text){
 try{if(navigator.share){await navigator.share({title:'VEX AI question',text});return}}catch(e){if(e.name==='AbortError')return}
 try{await copyText(text);alert('Question copied. You can paste it into another app.')}catch(e){alert('Could not share or copy this question.')}
}
async function copyText(text){
 if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return}
 const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';
 document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();
 if(!ok)throw new Error('Copy failed');
}
function addLabel(parent,text){
 const el=document.createElement('div');el.className='label';el.textContent=text;parent.appendChild(el);
}
function validURL(value){
 try{const u=new URL(value,API);return u.protocol==='https:'||u.protocol==='http:'}catch(e){return false}
}
function absoluteURL(value){try{return new URL(value,API).href}catch(e){return ''}}

function addSource(parent,item){
 if(!validURL(item.url))return;
 const a=document.createElement('a');a.className='source';a.href=absoluteURL(item.url);a.target='_blank';a.rel='noopener noreferrer';
 const tag=document.createElement('span');tag.className='tag';tag.textContent=item.source||'WEB SOURCE';
 const title=document.createElement('strong');title.textContent=item.title||'Web result';
 const small=document.createElement('small');small.textContent=item.description||'';
 a.append(tag,title,small);parent.appendChild(a);
}

/* Reliable direct API requests: no unverified CORS proxy in front. */
async function fetchJSON(path,timeoutMs=16000){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),timeoutMs);
 try{
  const response=await fetch(API+path,{method:'GET',mode:'cors',credentials:'omit',cache:'no-store',signal:controller.signal});
  const raw=await response.text();
  let data;
  try{data=JSON.parse(raw)}catch(e){throw new Error('Search service returned invalid data')}
  if(!response.ok)throw new Error(data.error||('HTTP '+response.status));
  return data;
 }finally{clearTimeout(timer)}
}
async function fetchRetry(path,attempts=2){
 let error;
 for(let i=0;i<attempts;i++){
  try{return await fetchJSON(path)}catch(e){error=e;if(i+1<attempts)await new Promise(r=>setTimeout(r,700*(i+1)))}
 }
 throw error||new Error('Request failed');
}

/* QUERY UNDERSTANDING */
const STOP=new Set(('what when where which who whom whose with from that this then than have does doing about into your you the and for are was were will would could should can how why tell explain please give show find search information some me is it its a an of to in on at by or as be do did my we they their them hai hain kya ka ki ke ko se mein aur batao mujhe kaise kab kahan kyun theek').split(' '));

function words(text){
 return String(text||'').toLowerCase().normalize('NFKD')
 .replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/)
 .filter(w=>w.length>2&&!STOP.has(w));
}
function cleanText(text){
 return String(text||'')
 .replace(/<script[\s\S]*?<\/script>/gi,' ')
 .replace(/<style[\s\S]*?<\/style>/gi,' ')
 .replace(/<[^>]*>/g,' ')
 .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&')
 .replace(/&quot;/gi,'"').replace(/&#39;/g,"'")
 .replace(/&#x27;/gi,"'").replace(/&lt;/gi,'<')
 .replace(/&gt;/gi,'>').replace(/\s+/g,' ').trim();
}
function normalizeQuery(q){
 return String(q||'').replace(/\s+/g,' ').trim().replace(/[?!.]+$/,'');
}
function queryType(q){
 const s=q.toLowerCase();
 if(/\b(compare|difference|differentiate|versus|vs)\b/.test(s))return 'compare';
 if(/\b(why|reason|cause)\b/.test(s))return 'why';
 if(/\b(how|process|working|work)\b/.test(s))return 'how';
 if(/\b(who|biography|born|invented|founder)\b/.test(s))return 'who';
 if(/\b(when|date|year|timeline)\b/.test(s))return 'when';
 if(/\b(list|types|examples|benefits|advantages|disadvantages)\b/.test(s))return 'list';
 return 'general';
}
function splitSentences(text){
 return cleanText(text).replace(/([.!?])\s+(?=[A-Z0-9])/g,'$1|')
 .split('|').map(s=>s.trim()).filter(s=>s.length>=45&&s.length<=550);
}
function isBadSentence(s){
 const x=s.toLowerCase();
 const bad=['cookie policy','privacy policy','terms of use','all rights reserved','subscribe to our newsletter',
 'sign up for','log in to','create an account','skip to content','read more','click here',
 'share this article','advertisement','javascript is disabled','accept all cookies',
 'your browser does not support','related articles','table of contents','contact us',
 'follow us on','download our app','copyright ©','this website uses cookies','view all posts'];
 if(bad.some(v=>x.includes(v)))return true;
 if(/^(home|menu|search|login|register|next|previous|read more)\b/i.test(s))return true;
 if(/https?:\/\//i.test(s))return true;
 if(s.split(/\s+/).length<8)return true;
 return false;
}

/* RELEVANCE SCORING */
function scoreSentence(sentence,query,title,description){
 const terms=words(query);if(!terms.length)return 0;
 const s=sentence.toLowerCase(),t=(title||'').toLowerCase(),d=(description||'').toLowerCase();
 let matched=0,score=0;
 terms.forEach(w=>{
  if(s.includes(w)){matched++;score+=3}
  if(t.includes(w))score+=2.4;
  if(d.includes(w))score+=0.7;
 });
 const coverage=matched/terms.length;
 score+=coverage*7;
 if(coverage>=0.75)score+=2;
 if(coverage===1)score+=2;
 if(/\b(is|are|was|were|because|therefore|consists|contains|formed|caused|means|refers|known|called|created|developed|occurs|produces|allows|includes)\b/i.test(sentence))score+=1;
 if(sentence.length<75)score-=0.8;
 if(sentence.length>420)score-=1;
 const letters=(sentence.match(/[a-z]/gi)||[]).length;
 if(letters/Math.max(sentence.length,1)<0.5)score-=3;
 return score;
}
function overlap(a,b){
 const A=new Set(words(a)),B=new Set(words(b));
 if(!A.size||!B.size)return 0;
 let n=0;A.forEach(x=>{if(B.has(x))n++});
 return n/Math.min(A.size,B.size);
}
function extractFacts(query,parts){
 const candidates=[];
 parts.forEach((part,sourceIndex)=>{
  splitSentences(part.text).forEach((sentence,position)=>{
   if(isBadSentence(sentence))return;
   const score=scoreSentence(sentence,query,part.title,part.description);
   if(score<4)return;
   candidates.push({text:sentence,score,sourceIndex,position,title:part.title});
  });
 });
 candidates.sort((a,b)=>b.score-a.score);
 const chosen=[],perSource={};
 for(const item of candidates){
  if(chosen.some(x=>overlap(x.text,item.text)>0.72))continue;
  if((perSource[item.sourceIndex]||0)>=2)continue;
  chosen.push(item);perSource[item.sourceIndex]=(perSource[item.sourceIndex]||0)+1;
  if(chosen.length>=9)break;
 }
 return chosen;
}

/* BUILD A READABLE EVIDENCE-BASED ANSWER */
function makeIntro(query,facts){
 if(!facts.length)return '';
 const first=facts[0].text;
 // Do not invent a definition: use a relevant source statement as the opening.
 return first;
}
function buildAnswer(query,parts,card){
 const facts=extractFacts(query,parts);
 const instant=card?.instantAnswer?.answer?cleanText(card.instantAnswer.answer):'';
 const validInstant=instant.length>35&&instant.length<700&&!isBadSentence(instant);
 const type=queryType(query);
 const lines=[];
 const used=new Set();

 if(validInstant){lines.push(instant);used.add(instant.toLowerCase())}
 else if(facts.length){lines.push(makeIntro(query,facts));used.add(facts[0].text.toLowerCase())}

 const remaining=facts.filter(f=>!used.has(f.text.toLowerCase()));
 if(remaining.length){
  lines.push('');
  if(type==='how')lines.push('How it works');
  else if(type==='why')lines.push('Why it happens');
  else if(type==='compare')lines.push('Important differences and points');
  else if(type==='who')lines.push('Background and details');
  else if(type==='when')lines.push('Timeline and details');
  else if(type==='list')lines.push('Key points');
  else lines.push('More details');

  remaining.slice(0,6).forEach((f,i)=>lines.push('• '+f.text));
 }
 if(!lines.length)return 'I found some related web pages, but their available text did not provide enough reliable information to answer this question. Please try asking in a more specific way.';
 let answer=lines.join('\n');
 if(answer.length>3200)answer=answer.slice(0,3200).replace(/\s+\S*$/,'')+'…';
 return answer.trim();
}

/* CONTEXT + WEB SOURCES */
async function getContext(result){
 try{
  const data=await fetchJSON('/api/context?url='+encodeURIComponent(result.url),14000);
  const passages=Array.isArray(data.passages)?data.passages.join('\n'):'';
  return {
   title:data.title||result.title||'',
   text:[data.summary||'',data.content||'',passages].filter(Boolean).join('\n'),
   coverage:data.coverage||'unknown'
  };
 }catch(e){
  return {title:result.title||'',text:result.description||'',coverage:'snippet'};
 }
}
async function getInfocard(query){
 try{return await fetchJSON('/api/infocard?q='+encodeURIComponent(query),9000)}
 catch(e){return null}
}
async function searchImages(query){
 try{
  const data=await fetchJSON('/api/images?q='+encodeURIComponent(query)+'&page=1',13000);
  return (Array.isArray(data.images)?data.images:[]).slice(0,8).map(x=>({
   title:x.title||'Image',image:absoluteURL(x.thumbUrl||x.url),
   url:absoluteURL(x.url||x.thumbUrl),license:x.license||'',
   source:x.source||'Wikimedia Commons',
   sourceUrl:absoluteURL(x.sourceUrl||x.pageUrl||x.sourcePage||'')
  })).filter(x=>x.image&&x.url);
 }catch(e){console.warn('Image search:',e);return []}
}

/* MEDIA REQUESTS */
function isImageOnlyRequest(q){
 return /\b(images?|pictures?|photos?)\b/i.test(q)&&
 /\b(only|just|show|give|send|find|display)\b/i.test(q)&&
 !/\b(video|videos|explain|describe|what is|who is|how)\b/i.test(q);
}
function isVideoRequest(q){return /\b(video|videos|watch|clip|documentary|trailer)\b/i.test(q)}
function isVideoOnlyRequest(q){
 return isVideoRequest(q)&&/\b(only|just|show|give|send|find|play)\b/i.test(q)&&
 !/\b(image|images|picture|pictures|photo|photos|explain)\b/i.test(q);
}
function mediaQuery(q){
 return q.replace(/\b(show|give|send|find|display|me|some|only|just|images?|pictures?|photos?|videos?|clips?|documentary|trailer|of|about)\b/gi,' ')
 .replace(/\s+/g,' ').trim()||q;
}
async function searchVideos(query){
 try{
  const data=await fetchRetry('/api/search?q='+encodeURIComponent('site:youtube.com/watch '+query)+'&page=1&exact=0',2);
  const output=[],seen=new Set();
  (data.results||[]).forEach(item=>{
   let id='';
   try{
    const u=new URL(item.url);
    if(u.hostname.includes('youtube.com'))id=u.searchParams.get('v')||'';
    else if(u.hostname==='youtu.be')id=u.pathname.slice(1);
   }catch(e){}
   if(!/^[A-Za-z0-9_-]{11}$/.test(id)||seen.has(id))return;
   seen.add(id);output.push({id,title:item.title||'YouTube video',url:item.url,description:item.description||''});
  });
  return output.slice(0,8);
 }catch(e){console.warn('Video search:',e);return []}
}

/* FOLLOW-UP QUESTIONS */
function makeFollowups(query,results){
 const topic=words(query).slice(0,4).join(' ')||query;
 const title=results?.[0]?.title||'';
 const topicText=topic.length>55?topic.slice(0,55):topic;
 const options=[
  'How does '+topicText+' work in practice?',
  'What are the main benefits and limitations of '+topicText+'?',
  title&&title.toLowerCase()!==query.toLowerCase()?'What does '+title+' explain?':'What are some real-world examples of '+topicText+'?'
 ];
 const unique=[...new Set(options)];
 return unique.slice(0,3);
}

/* MAIN SEARCH */
async function runSearch(query,progress){
 progress.textContent='Searching the web...';
 const searchData=await fetchRetry('/api/search?q='+encodeURIComponent(query)+'&page=1&exact=0',2);
 const results=Array.isArray(searchData.results)?searchData.results:[];
 const card=await getInfocard(query);
 if(!results.length){
  const answer=card?.instantAnswer?.answer?cleanText(card.instantAnswer.answer):'I could not find useful matching pages. Try adding a little more detail to your question.';
  return {answer,results:[],images:[],followups:[]};
 }
 progress.textContent='Checking relevant sources...';
 // Start with the most relevant search results; avoid loading dozens of pages.
 const selected=results.slice(0,7);
 const contexts=await Promise.all(selected.map(getContext));
 const parts=contexts.map((c,i)=>({
  title:c.title||selected[i].title||'Web source',
  text:c.text||selected[i].description||'',
  description:selected[i].description||''
 }));
 progress.textContent='Building your explanation...';
 const answer=buildAnswer(query,parts,card);
 progress.textContent='Finding related images...';
 const images=await searchImages(query);
 const sourceResults=results.slice(0,7).map(x=>({
  title:x.title||'Web result',url:x.url,
  description:x.description||x.displayUrl||'',source:x.source||'WEB SOURCE'
 }));
 return {answer,results:sourceResults,images,followups:makeFollowups(query,sourceResults)};
}
async function runImageSearch(query){
 return {mode:'images',answer:'',results:[],images:await searchImages(mediaQuery(query))};
}
async function runVideoSearch(query,progress){
 progress.textContent='Searching for videos...';
 const videos=await searchVideos(mediaQuery(query));
 return {mode:'videos',answer:'',results:[],images:[],videos,
 note:videos.length?'Videos are found from indexed YouTube pages. Playback depends on the video owner’s embed settings.':'No matching YouTube videos were found in the current search results.'};
}

/* VIEWER */
function openViewer(kind,url,title,source){
 const viewer=document.getElementById('mediaViewer'),inner=document.getElementById('viewerInner');
 inner.textContent='';
 if(kind==='video'){
  const frame=document.createElement('iframe');
  frame.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(url)+'?autoplay=1&rel=0';
  frame.title=title||'VEX video';
  frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  frame.allowFullscreen=true;inner.appendChild(frame);
 }else{
  const img=document.createElement('img');img.src=url;img.alt=title||'Image';inner.appendChild(img);
 }
 const caption=document.createElement('div');caption.className='viewer-caption';caption.textContent=title||'';inner.appendChild(caption);
 if(source&&validURL(source)){
  const link=document.createElement('a');link.className='viewer-source';link.href=source;
  link.target='_blank';link.rel='noopener noreferrer';link.textContent='Open original source';inner.appendChild(link);
 }
 viewer.classList.add('open');document.body.style.overflow='hidden';
}
function closeViewer(){
 document.getElementById('mediaViewer').classList.remove('open');
 document.getElementById('viewerInner').textContent='';document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});

/* RENDER IMAGES */
function renderImages(reply,images){
 if(!images||!images.length){
  const empty=document.createElement('div');empty.textContent='No images were found for this search.';reply.appendChild(empty);return;
 }
 addLabel(reply,'IMAGES');
 const gallery=document.createElement('div');gallery.className='images';
 images.forEach(item=>{
  if(!validURL(item.image))return;
  const card=document.createElement('div');card.className='image-card';
  const button=document.createElement('button');button.type='button';
  button.onclick=()=>openViewer('image',item.image,item.title,item.sourceUrl);
  const img=document.createElement('img');img.src=item.image;img.alt=item.title||'Image';img.loading='lazy';img.onerror=()=>card.remove();
  const caption=document.createElement('div');caption.style.cssText='padding:7px 8px;font-size:11px';caption.textContent=item.title||'Image';
  button.append(img,caption);card.appendChild(button);
  if(item.license){const lic=document.createElement('small');lic.textContent='Licence: '+item.license+' · '+item.source;card.appendChild(lic)}
  gallery.appendChild(card);
 });
 if(gallery.childElementCount)reply.appendChild(gallery);
}

/* RENDER VIDEOS */
function renderVideos(reply,videos){
 if(!videos||!videos.length)return;
 addLabel(reply,'VIDEOS');
 const grid=document.createElement('div');grid.className='videos';
 videos.forEach(video=>{
  const card=document.createElement('div');card.className='video-card';
  const button=document.createElement('button');button.type='button';
  button.onclick=()=>openViewer('video',video.id,video.title,video.url);
  const img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+encodeURIComponent(video.id)+'/hqdefault.jpg';img.alt=video.title;img.loading='lazy';
  const title=document.createElement('strong');title.textContent=video.title;
  button.append(img,title);card.appendChild(button);grid.appendChild(card);
 });
 reply.appendChild(grid);
}

/* RENDER ANSWER */
function renderBot(data,save=true){
 const reply=document.createElement('div');reply.className='message bot';
 if(data.mode==='images'){renderImages(reply,data.images);chat.appendChild(reply);if(save)storeMessage({type:'bot',data});scrollDown();return}
 if(data.mode==='videos'){
  renderVideos(reply,data.videos);
  if(data.note){const note=document.createElement('div');note.style.cssText='color:#888;font-size:12px;margin-top:10px';note.textContent=data.note;reply.appendChild(note)}
  chat.appendChild(reply);if(save)storeMessage({type:'bot',data});scrollDown();return;
 }
 addLabel(reply,'VEX AI');
 const answer=document.createElement('div');answer.className='answer';answer.textContent=data.answer||'No information found.';reply.appendChild(answer);
 if(data.results?.length){
  addLabel(reply,'WEB SOURCES');const grid=document.createElement('div');grid.className='sources';
  data.results.forEach(item=>addSource(grid,item));if(grid.childElementCount)reply.appendChild(grid);
 }
 if(data.images?.length){addLabel(reply,'RELATED IMAGES');renderImages(reply,data.images)}
 if(data.videos?.length)renderVideos(reply,data.videos);
 if(data.followups?.length){
  addLabel(reply,'YOU MAY ALSO ASK');const follow=document.createElement('div');follow.className='followups';
  data.followups.forEach(q=>{const b=document.createElement('button');b.type='button';b.textContent=q;b.onclick=()=>quickAsk(q);follow.appendChild(b)});
  reply.appendChild(follow);
 }
 const actions=document.createElement('div');actions.className='actions';
 const copy=document.createElement('button');copy.textContent='Copy answer';
 copy.onclick=()=>copyText(data.answer||'').then(()=>{copy.textContent='Copied';setTimeout(()=>copy.textContent='Copy answer',1400)}).catch(()=>{copy.textContent='Copy failed'});
 actions.appendChild(copy);reply.appendChild(actions);
 chat.appendChild(reply);if(save)storeMessage({type:'bot',data});scrollDown();
}

/* SEND */
async function sendMessage(){
 const query=normalizeQuery(input.value);if(!query||searching)return;
 searching=true;sendButton.disabled=true;addUser(query);
 input.value='';input.style.height='30px';
 const progress=document.createElement('div');progress.className='message bot progress';
 progress.textContent='Preparing your search...';chat.appendChild(progress);scrollDown();
 try{
  let data;
  if(isImageOnlyRequest(query)){progress.textContent='Searching images...';data=await runImageSearch(query)}
  else if(isVideoOnlyRequest(query)){data=await runVideoSearch(query,progress)}
  else{
   data=await runSearch(query,progress);
   if(isVideoRequest(query)){progress.textContent='Finding matching videos...';data.videos=await searchVideos(mediaQuery(query))}
  }
  progress.remove();renderBot(data,true);
 }catch(e){
  progress.classList.remove('progress');
  progress.textContent='VEX could not complete the search: '+(e.message||'Network request failed')+'. Please try again.';
  const retry=document.createElement('button');retry.className='icon-btn';retry.textContent='↻ Retry';
  retry.onclick=()=>{progress.remove();input.value=query;sendMessage()};
  progress.appendChild(document.createTextNode(' '));progress.appendChild(retry);
 }finally{searching=false;sendButton.disabled=false;input.focus()}
}
function quickAsk(text){input.value=text;sendMessage()}
sendButton.addEventListener('click',sendMessage);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,130)+'px'});
loadHistory();
</script>
