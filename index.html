
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="VEX AI - independent web knowledge assistant">
  <title>VEX AI</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --panel: #080808;
      --panel-2: #111111;
      --border: #252525;
      --border-soft: #191919;
      --text: #f5f5f5;
      --muted: #888888;
      --muted-2: #606060;
      --white: #ffffff;
      --black: #000000;
      --radius: 14px;
      --sidebar-width: 270px;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    body { overflow: hidden; }
    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }
    a { color: inherit; }

    .app {
      display: flex;
      width: 100%;
      height: 100dvh;
      min-height: 0;
      background: var(--bg);
    }
    .sidebar {
      position: relative;
      z-index: 20;
      display: flex;
      flex: 0 0 var(--sidebar-width);
      flex-direction: column;
      width: var(--sidebar-width);
      min-width: 0;
      padding: 16px 12px 12px;
      background: #030303;
      border-right: 1px solid var(--border-soft);
    }
    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 3px 5px 22px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 850;
      letter-spacing: 2px;
    }
    .brand-mark {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid #555;
      border-radius: 10px;
      font-size: 14px;
      letter-spacing: 0;
    }
    .icon-button {
      display: inline-grid;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      place-items: center;
      padding: 0;
      color: #dddddd;
      background: #080808;
      border: 1px solid #292929;
      border-radius: 10px;
    }
    .icon-button:hover { background: #191919; border-color: #555; }
    .new-chat-button {
      width: 100%;
      padding: 12px 13px;
      color: #ffffff;
      text-align: left;
      background: #080808;
      border: 1px solid #343434;
      border-radius: 12px;
    }
    .new-chat-button:hover { background: #151515; border-color: #666; }
    .side-tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 9px;
    }
    .side-tool {
      min-width: 0;
      padding: 10px 8px;
      color: #cccccc;
      font-size: 12px;
      background: #050505;
      border: 1px solid #242424;
      border-radius: 10px;
    }
    .side-tool:hover, .side-tool.active {
      color: #ffffff;
      background: #171717;
      border-color: #666666;
    }
    .section-label {
      margin: 25px 8px 9px;
      color: #777777;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }
    .history-list {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      gap: 3px;
      overflow: auto;
    }
    .history-item {
      width: 100%;
      overflow: hidden;
      padding: 10px;
      color: #bdbdbd;
      font-size: 12px;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: transparent;
      border: 0;
      border-radius: 9px;
    }
    .history-item:hover, .history-item.selected { color: #ffffff; background: #151515; }
    .sidebar-footer {
      padding: 14px 7px 4px;
      color: #777777;
      font-size: 11px;
      line-height: 1.7;
      border-top: 1px solid var(--border-soft);
    }
    .sidebar-footer strong { color: #dddddd; font-weight: 650; }

    .main {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      background: #000000;
    }
    .topbar {
      display: flex;
      height: 60px;
      min-height: 60px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 20px;
      background: #000000;
      border-bottom: 1px solid var(--border-soft);
    }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 10px; }
    .mobile-menu { display: none; }
    .top-title { font-size: 14px; font-weight: 700; letter-spacing: .3px; }
    .top-subtitle { margin-left: 8px; color: #777777; font-size: 11px; font-weight: 400; }
    .top-action {
      padding: 8px 11px;
      color: #cccccc;
      font-size: 11px;
      background: #080808;
      border: 1px solid #292929;
      border-radius: 9px;
    }
    .top-action:hover { color: #ffffff; border-color: #666666; }

    .chat-scroll {
      min-height: 0;
      flex: 1;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 24px 18px 30px;
      scroll-behavior: smooth;
    }
    .chat-inner { width: 100%; max-width: 850px; margin: 0 auto; }
    .welcome {
      display: flex;
      min-height: 56vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px 12px;
      text-align: center;
    }
    .welcome-logo {
      display: grid;
      width: 62px;
      height: 62px;
      place-items: center;
      margin-bottom: 23px;
      font-size: 25px;
      font-weight: 850;
      border: 1px solid #555555;
      border-radius: 20px;
    }
    .welcome h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 43px);
      font-weight: 700;
      letter-spacing: -1.7px;
    }
    .welcome p { max-width: 470px; margin: 0; color: #858585; font-size: 13px; line-height: 1.7; }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-top: 27px;
    }
    .suggestion {
      padding: 10px 13px;
      color: #cccccc;
      font-size: 11px;
      background: #050505;
      border: 1px solid #292929;
      border-radius: 22px;
    }
    .suggestion:hover { color: #000000; background: #ffffff; border-color: #ffffff; }
    .messages { display: flex; flex-direction: column; gap: 25px; padding-bottom: 20px; }
    .message { display: flex; width: 100%; align-items: flex-start; gap: 12px; }
    .avatar {
      display: grid;
      width: 31px;
      height: 31px;
      flex: 0 0 31px;
      place-items: center;
      color: #eeeeee;
      font-size: 10px;
      font-weight: 800;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
    }
    .message.user .avatar { background: #151515; }
    .message.assistant .avatar { background: #050505; }
    .message-body { min-width: 0; flex: 1; padding-top: 2px; }
    .message-role { margin-bottom: 7px; color: #888888; font-size: 11px; font-weight: 650; }
    .message-text {
      color: #eeeeee;
      font-size: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .message.user .message-text { color: #ffffff; }
    .message-text a { color: #ffffff; text-decoration: underline; text-underline-offset: 3px; }
    .message-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .message-action {
      padding: 6px 9px;
      color: #aaaaaa;
      font-size: 10px;
      background: transparent;
      border: 1px solid #292929;
      border-radius: 8px;
    }
    .message-action:hover { color: #ffffff; border-color: #666666; }

    .content-label {
      margin: 17px 0 9px;
      color: #858585;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .source-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 9px; }
    .source-card {
      display: block;
      min-width: 0;
      padding: 12px;
      color: #eeeeee;
      text-decoration: none;
      background: #050505;
      border: 1px solid #292929;
      border-radius: 11px;
    }
    .source-card:hover { background: #101010; border-color: #777777; }
    .source-site { display: block; margin-bottom: 6px; color: #777777; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
    .source-title { display: block; font-size: 12px; font-weight: 700; line-height: 1.5; }
    .source-description { display: block; margin-top: 6px; color: #999999; font-size: 11px; line-height: 1.55; }

    .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; }
    .image-card { min-width: 0; overflow: hidden; background: #070707; border: 1px solid #252525; border-radius: 11px; }
    .image-open {
      display: block;
      width: 100%;
      padding: 0;
      color: #eeeeee;
      text-align: left;
      background: transparent;
      border: 0;
    }
    .image-open img { display: block; width: 100%; height: 140px; object-fit: cover; background: #111111; }
    .image-caption { display: block; padding: 8px; color: #bbbbbb; font-size: 10px; line-height: 1.45; }
    .media-viewer {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, .97);
    }
    .media-viewer.open { display: flex; }
    .viewer-close {
      position: absolute;
      top: 15px;
      right: 17px;
      width: 42px;
      height: 42px;
      color: #ffffff;
      font-size: 24px;
      background: #111111;
      border: 1px solid #555555;
      border-radius: 50%;
    }
    .viewer-content { display: flex; max-width: 1100px; max-height: 100%; flex-direction: column; align-items: center; gap: 12px; }
    .viewer-content img { display: block; max-width: 100%; max-height: 78vh; object-fit: contain; }
    .viewer-content iframe { width: min(88vw, 960px); aspect-ratio: 16 / 9; border: 0; background: #111111; }
    .viewer-caption { color: #dddddd; font-size: 12px; text-align: center; }
    .viewer-link { color: #aaaaaa; font-size: 11px; }

    .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 11px; }
    .video-card { min-width: 0; overflow: hidden; background: #070707; border: 1px solid #292929; border-radius: 12px; }
    .video-open { display: block; width: 100%; padding: 0; color: #ffffff; text-align: left; background: transparent; border: 0; }
    .video-thumb { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #111111; }
    .video-title { display: block; padding: 10px 11px 7px; font-size: 12px; font-weight: 700; line-height: 1.5; }
    .video-source { display: block; padding: 0 11px 11px; color: #999999; font-size: 10px; text-decoration: underline; }
    .empty-state { padding: 12px; color: #888888; font-size: 12px; background: #080808; border: 1px solid #252525; border-radius: 10px; }

    .followups { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .followup-button {
      max-width: 100%;
      padding: 8px 11px;
      color: #cccccc;
      font-size: 10px;
      text-align: left;
      background: #050505;
      border: 1px solid #303030;
      border-radius: 18px;
    }
    .followup-button:hover { color: #ffffff; border-color: #888888; }

    .loading-row { display: flex; align-items: center; gap: 10px; color: #999999; font-size: 12px; }
    .loading-dot { width: 7px; height: 7px; background: #ffffff; border-radius: 50%; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
    .status-line { min-height: 16px; margin-top: 7px; color: #777777; font-size: 10px; text-align: center; }

    .composer-wrap {
      flex: 0 0 auto;
      padding: 17px 18px max(13px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, #000000 24%);
    }
    .composer {
      display: flex;
      max-width: 850px;
      align-items: flex-end;
      gap: 10px;
      margin: 0 auto;
      padding: 10px 11px 9px;
      background: #080808;
      border: 1px solid #383838;
      border-radius: 19px;
    }
    .composer:focus-within { border-color: #777777; }
    #prompt {
      display: block;
      width: 100%;
      min-width: 0;
      min-height: 34px;
      max-height: 145px;
      flex: 1;
      resize: none;
      padding: 7px 5px;
      color: #ffffff;
      font-size: 14px;
      line-height: 1.5;
      background: transparent;
      border: 0;
      outline: 0;
    }
    #prompt::placeholder { color: #777777; }
    .send-button {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      place-items: center;
      color: #000000;
      font-size: 20px;
      font-weight: 800;
      background: #ffffff;
      border: 0;
      border-radius: 12px;
    }
    .send-button:disabled { opacity: .35; cursor: not-allowed; }
    .composer-tools { display: flex; max-width: 850px; flex-wrap: wrap; gap: 7px; margin: 9px auto 0; }
    .composer-tool {
      padding: 7px 10px;
      color: #999999;
      font-size: 10px;
      background: #050505;
      border: 1px solid #242424;
      border-radius: 9px;
    }
    .composer-tool:hover, .composer-tool.active { color: #ffffff; border-color: #777777; }
    .bottom-note { margin-top: 8px; color: #555555; font-size: 9px; text-align: center; }

    .chat-scroll::-webkit-scrollbar, .history-list::-webkit-scrollbar { width: 5px; }
    .chat-scroll::-webkit-scrollbar-thumb, .history-list::-webkit-scrollbar-thumb { background: #292929; border-radius: 8px; }

    @media (max-width: 760px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(290px, 86vw);
        transform: translateX(-105%);
        transition: transform .22s ease;
        box-shadow: 18px 0 50px rgba(0,0,0,.65);
      }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu { display: inline-grid; }
      .topbar { padding: 0 11px; }
      .top-subtitle { display: none; }
      .chat-scroll { padding: 18px 12px 22px; }
      .composer-wrap { padding-right: 11px; padding-left: 11px; }
      .welcome { min-height: 50vh; }
      .welcome h1 { font-size: 31px; }
      .message-text { font-size: 13px; }
      .source-grid { grid-template-columns: 1fr; }
      .image-grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
      .image-open img { height: 120px; }
      .top-action { padding: 7px 8px; }
    }
    @media (max-width: 390px) {
      .top-title { font-size: 12px; }
      .composer-tool { padding: 7px 8px; }
      .suggestion { padding: 9px 10px; }
      .avatar { width: 28px; height: 28px; flex-basis: 28px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main menu">
      <div class="sidebar-head">
        <div class="brand"><span class="brand-mark">V</span><span>VEX AI</span></div>
        <button class="icon-button" id="closeSidebar" aria-label="Close menu">×</button>
      </div>

      <button class="new-chat-button" id="newChatButton">＋　New chat</button>

      <div class="side-tools">
        <button class="side-tool" data-mode="search">⌕　Search</button>
        <button class="side-tool" data-mode="images">▧　Images</button>
        <button class="side-tool" data-mode="videos">▶　Videos</button>
        <button class="side-tool" id="builderSideButton">⌘　Code Builder</button>
      </div>

      <div class="section-label">Recent chats</div>
      <div class="history-list" id="historyList"></div>

      <div class="sidebar-footer">
        <strong>VEX AI</strong><br>
        Independent project<br>
        Built by Avee Sharma
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button mobile-menu" id="openSidebar" aria-label="Open menu">☰</button>
          <div class="top-title">VEX AI <span class="top-subtitle">Knowledge Assistant</span></div>
        </div>
        <div class="topbar-right">
          <button class="top-action" id="shareChatButton">↗ Share</button>
          <button class="top-action" id="clearChatButton">Clear chat</button>
        </div>
      </header>

      <section class="chat-scroll" id="chatScroll" aria-live="polite">
        <div class="chat-inner">
          <div class="welcome" id="welcome">
            <div class="welcome-logo">V</div>
            <h1>What can I help with?</h1>
            <p>Ask a question, search the web, explore images or find videos.</p>
            <div class="suggestions">
              <button class="suggestion" data-prompt="Explain artificial intelligence in simple words">Explain AI</button>
              <button class="suggestion" data-prompt="Latest discoveries in space">Space discoveries</button>
              <button class="suggestion" data-prompt="How does the internet work?">Technology</button>
              <button class="suggestion" data-prompt="Explain quantum computing">Science</button>
            </div>
          </div>
          <div class="messages" id="messages"></div>
        </div>
      </section>

      <footer class="composer-wrap">
        <div class="composer">
          <textarea id="prompt" rows="1" maxlength="500" placeholder="Message VEX AI..." aria-label="Message VEX AI"></textarea>
          <button class="send-button" id="sendButton" aria-label="Send message" disabled>↑</button>
        </div>
        <div class="composer-tools">
          <button class="composer-tool" data-mode="search">⌕ Web search</button>
          <button class="composer-tool" data-mode="images">▧ Images only</button>
          <button class="composer-tool" data-mode="videos">▶ Videos only</button>
        </div>
        <div class="status-line" id="statusLine">Ready</div>
        <div class="bottom-note">VEX AI can make mistakes. Check important information from original sources.</div>
      </footer>
    </main>
  </div>

  <div class="media-viewer" id="mediaViewer" role="dialog" aria-modal="true" aria-label="Media viewer">
    <button class="viewer-close" id="viewerClose" aria-label="Close media viewer">×</button>
    <div class="viewer-content" id="viewerContent"></div>
  </div>

  <script>
    (() => {
      'use strict';

      const $ = (id) => document.getElementById(id);
      const promptBox = $('prompt');
      const sendButton = $('sendButton');
      const messagesBox = $('messages');
      const chatScroll = $('chatScroll');
      const historyList = $('historyList');
      const statusLine = $('statusLine');
      const sidebar = $('sidebar');
      const mediaViewer = $('mediaViewer');
      const viewerContent = $('viewerContent');

      const STORAGE_KEY = 'vex_ai_conversations_v3';
      const REQUEST_TIMEOUT = 90000;
      const MAX_HISTORY = 35;
      const MAX_QUERY_LENGTH = 500;

      let conversations = [];
      let activeConversationId = null;
      let activeMessages = [];
      let requestCounter = 0;
      let busy = false;
      let selectedMode = 'chat';
      const pendingRequests = new Map();

      function safeText(value) {
        return String(value === null || value === undefined ? '' : value);
      }

      function escapeHTML(value) {
        return safeText(value).replace(/[&<>"']/g, (char) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[char]);
      }

      function safeURL(value) {
        try {
          const url = new URL(value);
          if (url.protocol !== 'https:' && url.protocol !== 'http:') return '';
          return url.href;
        } catch (_) {
          return '';
        }
      }

      function hostName(value) {
        try { return new URL(value).hostname.replace(/^www\./, ''); }
        catch (_) { return 'Web source'; }
      }

      function scrollToBottom() {
        requestAnimationFrame(() => {
          chatScroll.scrollTop = chatScroll.scrollHeight;
        });
      }

      function setStatus(text) {
        statusLine.textContent = safeText(text);
      }

      function resizePrompt() {
        promptBox.style.height = 'auto';
        promptBox.style.height = Math.min(promptBox.scrollHeight, 145) + 'px';
      }

      function setBusy(value) {
        busy = Boolean(value);
        sendButton.disabled = busy || !promptBox.value.trim();
        promptBox.disabled = busy;
        document.querySelectorAll('[data-mode]').forEach((button) => {
          button.disabled = busy;
        });
      }

      function makeId() {
        requestCounter += 1;
        return 'vex_' + Date.now() + '_' + requestCounter;
      }

      function saveConversations() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations.slice(0, MAX_HISTORY)));
        } catch (error) {
          console.warn('VEX history could not be saved:', error);
          setStatus('Chat history could not be saved on this device.');
        }
      }

      function loadConversations() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          conversations = Array.isArray(saved) ? saved : [];
        } catch (_) {
          conversations = [];
        }
        renderHistory();
      }

      function getConversationTitle() {
        const firstUserMessage = activeMessages.find((message) => message.role === 'user');
        return firstUserMessage ? firstUserMessage.text.slice(0, 48) : 'New chat';
      }

      function persistConversation() {
        if (!activeMessages.length) return;
        if (!activeConversationId) activeConversationId = makeId();

        const record = {
          id: activeConversationId,
          title: getConversationTitle(),
          messages: activeMessages,
          updatedAt: Date.now()
        };

        conversations = [record, ...conversations.filter((item) => item.id !== activeConversationId)]
          .slice(0, MAX_HISTORY);
        saveConversations();
        renderHistory();
      }

      function renderHistory() {
        historyList.textContent = '';
        conversations.forEach((conversation) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'history-item' + (conversation.id === activeConversationId ? ' selected' : '');
          button.textContent = conversation.title || 'Chat';
          button.title = conversation.title || 'Chat';
          button.addEventListener('click', () => openConversation(conversation.id));
          historyList.appendChild(button);
        });
      }

      function openConversation(id) {
        const conversation = conversations.find((item) => item.id === id);
        if (!conversation) return;
        activeConversationId = conversation.id;
        activeMessages = Array.isArray(conversation.messages) ? conversation.messages : [];
        renderMessages();
        closeSidebar();
        renderHistory();
      }

      function startNewChat() {
        if (busy) return;
        activeConversationId = null;
        activeMessages = [];
        renderMessages();
        promptBox.value = '';
        resizePrompt();
        setStatus('New chat');
        closeSidebar();
        promptBox.focus();
      }

      function clearCurrentChat() {
        if (busy) return;
        activeMessages = [];
        activeConversationId = null;
        renderMessages();
        renderHistory();
        setStatus('Chat cleared');
        promptBox.focus();
      }

      function addUserMessage(text) {
        activeMessages.push({ role: 'user', text: safeText(text) });
        renderMessages();
        persistConversation();
      }

      function addAssistantMessage(data) {
        const message = {
          role: 'assistant',
          text: safeText(data.answer || 'I could not find a useful answer.'),
          results: Array.isArray(data.results) ? data.results : [],
          images: Array.isArray(data.images) ? data.images : [],
          videos: Array.isArray(data.videos) ? data.videos : [],
          mode: data.mode || 'chat',
          followups: Array.isArray(data.followups) ? data.followups : []
        };
        activeMessages.push(message);
        renderMessages();
        persistConversation();
      }

      function renderMessages() {
        $('welcome').style.display = activeMessages.length ? 'none' : 'flex';
        messagesBox.textContent = '';

        activeMessages.forEach((message) => {
          const row = document.createElement('article');
          row.className = 'message ' + (message.role === 'user' ? 'user' : 'assistant');

          const avatar = document.createElement('div');
          avatar.className = 'avatar';
          avatar.textContent = message.role === 'user' ? 'YOU' : 'V';

          const body = document.createElement('div');
          body.className = 'message-body';

          const role = document.createElement('div');
          role.className = 'message-role';
          role.textContent = message.role === 'user' ? 'You' : 'VEX AI';

          const text = document.createElement('div');
          text.className = 'message-text';
          text.textContent = message.text;

          body.append(role, text);

          if (message.role === 'assistant') {
            if (message.mode === 'images') {
              renderImageResults(body, message.images || []);
            } else if (message.mode === 'videos') {
              renderVideoResults(body, message.videos || [], message.results || []);
            } else {
              renderSources(body, message.results || []);
              if (message.images && message.images.length) renderImageResults(body, message.images);
              if (message.videos && message.videos.length) renderVideoResults(body, message.videos, []);
              if (message.followups && message.followups.length) renderFollowups(body, message.followups);
            }
            renderMessageActions(body, message.text);
          }

          row.append(avatar, body);
          messagesBox.appendChild(row);
        });

        scrollToBottom();
      }

      function renderMessageActions(parent, text) {
        const actions = document.createElement('div');
        actions.className = 'message-actions';
        const copy = document.createElement('button');
        copy.type = 'button';
        copy.className = 'message-action';
        copy.textContent = 'Copy answer';
        copy.addEventListener('click', async () => {
          try {
            await copyText(text);
            copy.textContent = 'Copied';
            setTimeout(() => { copy.textContent = 'Copy answer'; }, 1300);
          } catch (_) {
            copy.textContent = 'Copy unavailable';
          }
        });
        actions.appendChild(copy);
        parent.appendChild(actions);
      }

      function showLoading() {
        const row = document.createElement('div');
        row.className = 'message assistant';
        row.id = 'vexLoadingMessage';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = 'V';
        const body = document.createElement('div');
        body.className = 'message-body';
        const role = document.createElement('div');
        role.className = 'message-role';
        role.textContent = 'VEX AI';
        const loading = document.createElement('div');
        loading.className = 'loading-row';
        loading.innerHTML = '<span class="loading-dot"></span><span id="vexLoadingText">Connecting to VEX search...</span>';
        body.append(role, loading);
        row.append(avatar, body);
        messagesBox.appendChild(row);
        scrollToBottom();
        return row;
      }

      function updateLoading(text) {
        const target = $('vexLoadingText');
        if (target) target.textContent = safeText(text);
        setStatus(text);
        scrollToBottom();
      }

      function removeLoading() {
        $('vexLoadingMessage')?.remove();
      }

      function renderSources(parent, results) {
        const validResults = (results || []).filter((item) => safeURL(item.url || item.href));
        if (!validResults.length) return;

        const label = document.createElement('div');
        label.className = 'content-label';
        label.textContent = 'Web sources';
        const grid = document.createElement('div');
        grid.className = 'source-grid';

        validResults.slice(0, 8).forEach((item) => {
          const url = safeURL(item.url || item.href);
          const link = document.createElement('a');
          link.className = 'source-card';
          link.href = url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';

          const site = document.createElement('span');
          site.className = 'source-site';
          site.textContent = item.source || hostName(url);
          const title = document.createElement('span');
          title.className = 'source-title';
          title.textContent = item.title || 'Web result';
          const description = document.createElement('span');
          description.className = 'source-description';
          description.textContent = item.description || '';
          link.append(site, title, description);
          grid.appendChild(link);
        });

        parent.append(label, grid);
      }

      function normalizeImage(item) {
        const imageURL = safeURL(item.image || item.image_url || item.thumbUrl || item.url);
        if (!imageURL) return null;
        return {
          title: safeText(item.title || 'Related image'),
          image: imageURL,
          page: safeURL(item.sourceUrl || item.page_url || item.pageUrl || item.url) || imageURL,
          source: safeText(item.source || '')
        };
      }

      function renderImageResults(parent, images) {
        const validImages = (images || []).map(normalizeImage).filter(Boolean);
        const label = document.createElement('div');
        label.className = 'content-label';
        label.textContent = 'Images';
        parent.appendChild(label);

        if (!validImages.length) {
          const empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.textContent = 'No images were returned for this search. Try another keyword.';
          parent.appendChild(empty);
          return;
        }

        const grid = document.createElement('div');
        grid.className = 'image-grid';
        validImages.slice(0, 12).forEach((item) => {
          const card = document.createElement('div');
          card.className = 'image-card';
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'image-open';
          button.addEventListener('click', () => openImageViewer(item));

          const image = document.createElement('img');
          image.src = item.image;
          image.alt = item.title;
          image.loading = 'lazy';
          image.referrerPolicy = 'no-referrer';
          image.addEventListener('error', () => card.remove(), { once: true });

          const caption = document.createElement('span');
          caption.className = 'image-caption';
          caption.textContent = item.title;
          button.append(image, caption);
          card.appendChild(button);
          grid.appendChild(card);
        });
        parent.appendChild(grid);
      }

      function openImageViewer(item) {
        viewerContent.textContent = '';
        const image = document.createElement('img');
        image.src = item.image;
        image.alt = item.title;
        image.referrerPolicy = 'no-referrer';
        const caption = document.createElement('div');
        caption.className = 'viewer-caption';
        caption.textContent = item.title;
        const link = document.createElement('a');
        link.className = 'viewer-link';
        link.href = item.page;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'Open original image source';
        viewerContent.append(image, caption, link);
        mediaViewer.classList.add('open');
      }

      function youtubeInfo(value) {
        try {
          const url = new URL(value);
          let id = '';
          if (url.hostname.includes('youtu.be')) id = url.pathname.slice(1).split('/')[0];
          if (url.hostname.includes('youtube.com')) {
            if (url.pathname === '/watch') id = url.searchParams.get('v') || '';
            if (url.pathname.startsWith('/shorts/')) id = url.pathname.split('/')[2] || '';
            if (url.pathname.startsWith('/embed/')) id = url.pathname.split('/')[2] || '';
          }
          if (!id) return null;
          return {
            id,
            embed: 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id),
            thumbnail: 'https://i.ytimg.com/vi/' + encodeURIComponent(id) + '/hqdefault.jpg'
          };
        } catch (_) { return null; }
      }

      function looksLikeVideo(item) {
        const value = [item.title, item.description, item.url].join(' ').toLowerCase();
        return Boolean(youtubeInfo(item.url || '')) || /\b(video|watch|stream|trailer|documentary|\.mp4|\.webm)\b/i.test(value);
      }

      function normalizeVideos(videos, results) {
        const all = [];
        (videos || []).forEach((item) => all.push(item));
        (results || []).filter(looksLikeVideo).forEach((item) => all.push(item));
        const seen = new Set();
        return all.map((item) => {
          const url = safeURL(item.url || item.href);
          if (!url || seen.has(url)) return null;
          seen.add(url);
          const yt = youtubeInfo(url);
          return {
            title: safeText(item.title || 'Video result'),
            url,
            description: safeText(item.description || ''),
            thumbnail: safeURL(item.thumbnail || item.image || item.image_url || item.thumbUrl) || (yt ? yt.thumbnail : ''),
            embed: yt ? yt.embed : ''
          };
        }).filter(Boolean).slice(0, 10);
      }

      function renderVideoResults(parent, videos, results) {
        const validVideos = normalizeVideos(videos, results);
        const label = document.createElement('div');
        label.className = 'content-label';
        label.textContent = 'Videos';
        parent.appendChild(label);

        if (!validVideos.length) {
          const empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.textContent = 'No video pages were found in the returned web results. Try a different search phrase.';
          parent.appendChild(empty);
          return;
        }

        const grid = document.createElement('div');
        grid.className = 'video-grid';
        validVideos.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'video-card';
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'video-open';
          button.addEventListener('click', () => openVideoViewer(item));

          if (item.thumbnail) {
            const thumb = document.createElement('img');
            thumb.className = 'video-thumb';
            thumb.src = item.thumbnail;
            thumb.alt = item.title;
            thumb.loading = 'lazy';
            thumb.referrerPolicy = 'no-referrer';
            thumb.addEventListener('error', () => { thumb.style.display = 'none'; }, { once: true });
            button.appendChild(thumb);
          }

          const title = document.createElement('span');
          title.className = 'video-title';
          title.textContent = item.title;
          button.appendChild(title);

          const source = document.createElement('a');
          source.className = 'video-source';
          source.href = item.url;
          source.target = '_blank';
          source.rel = 'noopener noreferrer';
          source.textContent = 'Open original video page ↗';
          card.append(button, source);
          grid.appendChild(card);
        });
        parent.appendChild(grid);
      }

      function openVideoViewer(item) {
        viewerContent.textContent = '';
        const caption = document.createElement('div');
        caption.className = 'viewer-caption';
        caption.textContent = item.title;

        if (item.embed) {
          const frame = document.createElement('iframe');
          frame.src = item.embed;
          frame.title = item.title;
          frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
          frame.allowFullscreen = true;
          frame.referrerPolicy = 'strict-origin-when-cross-origin';
          viewerContent.append(frame, caption);
        } else {
          const link = document.createElement('a');
          link.className = 'viewer-link';
          link.href = item.url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'This website does not provide a supported in-app player. Open video page ↗';
          viewerContent.append(caption, link);
        }
        mediaViewer.classList.add('open');
      }

      function closeViewer() {
        mediaViewer.classList.remove('open');
        viewerContent.textContent = '';
      }

      function buildFollowups(query) {
        const topic = safeText(query).replace(/[?!.]+$/g, '').trim();
        if (!topic) return [];
        return [
          'Explain ' + topic + ' with an example',
          'What are the advantages and disadvantages of ' + topic + '?'
        ];
      }

      function renderFollowups(parent, followups) {
        if (!followups.length) return;
        const label = document.createElement('div');
        label.className = 'content-label';
        label.textContent = 'Related questions';
        const group = document.createElement('div');
        group.className = 'followups';
        followups.slice(0, 2).forEach((question) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'followup-button';
          button.textContent = question;
          button.addEventListener('click', () => submitQuestion(question, 'chat'));
          group.appendChild(button);
        });
        parent.append(label, group);
      }

      function nativeSearch(query, onProgress, mode) {
        return new Promise((resolve, reject) => {
          const id = makeId();
          const timer = setTimeout(() => {
            pendingRequests.delete(id);
            reject(new Error('The Android VEX search bridge did not respond. Close and reopen the app, then try again.'));
          }, REQUEST_TIMEOUT);

          pendingRequests.set(id, { resolve, reject, timer, onProgress });

          try {
            console.log('VEX_NATIVE_SEARCH:' + JSON.stringify({ id, query, mode: mode || 'chat' }));
          } catch (error) {
            clearTimeout(timer);
            pendingRequests.delete(id);
            reject(new Error('Could not send the search request to the Android app.'));
          }
        });
      }

      window.addEventListener('vex-native-progress', (event) => {
        const detail = event.detail || {};
        const pending = pendingRequests.get(String(detail.id || ''));
        if (!pending) return;
        if (typeof pending.onProgress === 'function') pending.onProgress(detail.stage || 'Working...');
      });

      window.addEventListener('vex-native-result', (event) => {
        const detail = event.detail || {};
        const id = String(detail.id || '');
        const pending = pendingRequests.get(id);
        if (!pending) return;
        clearTimeout(pending.timer);
        pendingRequests.delete(id);
        if (detail.error) pending.reject(new Error(detail.error));
        else pending.resolve(detail.data || {});
      });

      function cleanMediaQuery(query) {
        return safeText(query)
          .replace(/\b(only|just|show|find|give|send|display|me|please)\b/gi, ' ')
          .replace(/\b(images?|pictures?|photos?|videos?|clips?)\b/gi, ' ')
          .replace(/\s+/g, ' ')
          .trim() || safeText(query).trim();
      }

      function detectMode(query, requestedMode) {
        if (requestedMode && requestedMode !== 'chat') return requestedMode;
        const q = query.toLowerCase();
        if (/\b(images?|pictures?|photos?)\b/.test(q) && /\b(only|just|show|find|give|send|display)\b/.test(q)) return 'images';
        if (/\b(videos?|clips?)\b/.test(q) && /\b(only|just|show|find|give|send|play)\b/.test(q)) return 'videos';
        return 'chat';
      }

      function makeNativeQuery(query, mode) {
        const topic = cleanMediaQuery(query);
        if (mode === 'videos') return topic + ' video watch tutorial';
        return topic;
      }

      function normalizeResults(data) {
        const list = Array.isArray(data.results) ? data.results : (Array.isArray(data.sources) ? data.sources : []);
        return list.map((item) => ({
          title: safeText(item.title || 'Web result'),
          url: safeURL(item.url || item.href),
          description: safeText(item.description || item.snippet || ''),
          source: safeText(item.source || '')
        })).filter((item) => item.url);
      }

      function normalizeImages(data) {
        const list = Array.isArray(data.images) ? data.images : [];
        return list.map(normalizeImage).filter(Boolean);
      }

      async function performSearch(query, mode, progressCallback) {
        const nativeQuery = makeNativeQuery(query, mode);
        const data = await nativeSearch(nativeQuery, progressCallback, mode);
        const results = normalizeResults(data);
        const images = normalizeImages(data);

        if (mode === 'images') {
          return { mode, answer: '', results: [], images, videos: [], followups: [] };
        }

        if (mode === 'videos') {
          const videos = normalizeVideos([], results);
          return { mode, answer: '', results: [], images: [], videos, followups: [] };
        }

        const answer = safeText(data.answer || 'I found some web results, but no explanation was returned. Open the source links below.');
        const wantsVideos = /\b(video|videos|watch|clip|trailer|documentary)\b/i.test(query);
        return {
          mode: 'chat',
          answer,
          results,
          images,
          videos: wantsVideos ? normalizeVideos([], results) : [],
          followups: buildFollowups(query)
        };
      }

      async function submitQuestion(question, requestedMode) {
        const query = safeText(question).trim();
        if (!query || busy) return;
        if (query.length > MAX_QUERY_LENGTH) {
          setStatus('Please keep your question under 500 characters.');
          return;
        }

        const mode = detectMode(query, requestedMode || selectedMode);
        selectedMode = 'chat';
        updateModeButtons();
        promptBox.value = '';
        resizePrompt();
        setBusy(true);
        addUserMessage(query);
        const loading = showLoading();
        updateLoading(mode === 'images' ? 'Searching images...' : mode === 'videos' ? 'Searching video pages...' : 'Connecting to VEX search...');

        try {
          const data = await performSearch(query, mode, updateLoading);
          loading.remove();
          addAssistantMessage(data);
          setStatus('Search complete');
        } catch (error) {
          loading.remove();
          const message = safeText(error && error.message ? error.message : 'Unknown connection error');
          addAssistantMessage({
            answer: 'VEX could not complete this search.\n\n' + message + '\n\nThis version uses the Android app search bridge from vex_ui.py. Open the GitHub Pages site inside the VEX Android app WebView to use native search.'
          });
          setStatus('Search connection error');
          console.error('VEX search error:', error);
        } finally {
          setBusy(false);
          promptBox.focus();
        }
      }

      function updateModeButtons() {
        document.querySelectorAll('[data-mode]').forEach((button) => {
          button.classList.toggle('active', button.dataset.mode === selectedMode && selectedMode !== 'chat');
        });
      }

      function sendFromComposer() {
        const query = promptBox.value.trim();
        if (!query) return;
        submitQuestion(query, selectedMode);
      }

      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(safeText(text));
          return;
        }
        const area = document.createElement('textarea');
        area.value = safeText(text);
        area.style.position = 'fixed';
        area.style.left = '-9999px';
        document.body.appendChild(area);
        area.select();
        const copied = document.execCommand('copy');
        area.remove();
        if (!copied) throw new Error('Copy not available');
      }

      async function shareChat() {
        const transcript = activeMessages.map((message) =>
          (message.role === 'user' ? 'You' : 'VEX AI') + ':\n' + message.text
        ).join('\n\n');
        if (!transcript) {
          setStatus('There is no chat to share yet.');
          return;
        }
        try {
          if (navigator.share) {
            await navigator.share({ title: 'VEX AI chat', text: transcript });
          } else {
            await copyText(transcript);
            setStatus('Chat copied. Paste it wherever you want to share.');
          }
        } catch (error) {
          if (error.name !== 'AbortError') setStatus('Could not share this chat.');
        }
      }

      function closeSidebar() { sidebar.classList.remove('open'); }
      function toggleSidebar() { sidebar.classList.toggle('open'); }

      function setMode(mode) {
        selectedMode = mode;
        updateModeButtons();
        const labels = {
          chat: 'Message VEX AI...',
          search: 'Search the web...',
          images: 'Describe images to find...',
          videos: 'Describe videos to find...'
        };
        promptBox.placeholder = labels[mode] || labels.chat;
        promptBox.focus();
      }

      sendButton.addEventListener('click', sendFromComposer);
      promptBox.addEventListener('input', () => {
        resizePrompt();
        sendButton.disabled = busy || !promptBox.value.trim();
      });
      promptBox.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendFromComposer();
        }
      });

      $('newChatButton').addEventListener('click', startNewChat);
      $('clearChatButton').addEventListener('click', clearCurrentChat);
      $('shareChatButton').addEventListener('click', shareChat);
      $('openSidebar').addEventListener('click', toggleSidebar);
      $('closeSidebar').addEventListener('click', closeSidebar);
      $('viewerClose').addEventListener('click', closeViewer);

      mediaViewer.addEventListener('click', (event) => {
        if (event.target === mediaViewer) closeViewer();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeViewer();
      });

      document.querySelectorAll('[data-mode]').forEach((button) => {
        button.addEventListener('click', () => setMode(button.dataset.mode));
      });

      document.querySelectorAll('.suggestion').forEach((button) => {
        button.addEventListener('click', () => submitQuestion(button.dataset.prompt, 'chat'));
      });

      $('builderSideButton').addEventListener('click', () => {
        const launch = $('vexBuilderLaunch');
        if (launch) {
          launch.click();
        } else {
          setStatus('Code Builder is not loaded. Check that ./vex_builder.js is published beside index.html.');
        }
        closeSidebar();
      });

      loadConversations();
      renderMessages();
      setMode('chat');
      setStatus('Ready');
    })();
  </script>

  <!-- Keep vex_builder.js beside index.html in the GitHub repository root. -->
  <script
    id="vexBuilderScript"
    src="./vex_builder.js?v=4"
    defer
    onerror="document.getElementById('statusLine').textContent='Code Builder script could not load. Check the vex_builder.js file path and GitHub Pages deployment.';">
  </script>
