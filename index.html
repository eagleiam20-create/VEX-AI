
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>VEX AI</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#080808;--panel2:#101010;--line:#222;--text:#f5f5f5;--muted:#929292;--accent:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow:hidden}
button,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.app{height:100dvh;display:flex;background:#000}
.sidebar{width:270px;flex-shrink:0;background:#050505;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 12px;font-size:19px;font-weight:750;letter-spacing:.3px}
.logo{width:30px;height:30px;border:1px solid #555;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:800}
.new-chat{width:100%;padding:12px 14px;border:1px solid #303030;background:#0c0c0c;border-radius:12px;text-align:left;font-size:14px}
.new-chat:hover,.history-item:hover,.icon-btn:hover{background:#171717}
.side-label{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:1.4px;padding:8px 9px 0}
.history{overflow:auto;display:flex;flex-direction:column;gap:4px}
.history-item{border:0;background:transparent;text-align:left;padding:10px;border-radius:9px;color:#c8c8c8;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-bottom{margin-top:auto;color:#777;font-size:11px;padding:8px}
.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}
.topbar{height:58px;flex-shrink:0;border-bottom:1px solid #151515;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.top-title{font-size:14px;font-weight:650;letter-spacing:.2px}
.top-actions{display:flex;gap:8px}
.icon-btn{width:36px;height:36px;border:1px solid #252525;background:#090909;border-radius:10px;display:grid;place-items:center;color:#ddd}
.mobile-menu{display:none}
.chat-scroll{flex:1;overflow-y:auto;padding:30px 18px 20px;scroll-behavior:smooth}
.chat-inner{max-width:820px;margin:0 auto;width:100%}
.welcome{min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 10px}
.welcome-mark{width:58px;height:58px;border:1px solid #444;border-radius:19px;display:grid;place-items:center;font-size:25px;font-weight:800;margin-bottom:22px}
.welcome h1{font-size:clamp(27px,4vw,38px);font-weight:650;letter-spacing:-1.3px;margin:0 0 10px}
.welcome p{color:#888;font-size:14px;margin:0}
.messages{display:flex;flex-direction:column;gap:26px;padding-bottom:18px}
.message{display:flex;gap:13px;align-items:flex-start}
.avatar{width:29px;height:29px;flex:0 0 29px;border:1px solid #383838;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#ddd}
.message.user .avatar{background:#151515}
.message-body{min-width:0;flex:1;padding-top:3px}
.message-role{font-size:12px;color:#888;margin-bottom:8px}
.message-text{font-size:15px;line-height:1.75;color:#e8e8e8;overflow-wrap:anywhere;white-space:pre-wrap}
.message-text a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.message-text code{background:#171717;border:1px solid #282828;padding:2px 5px;border-radius:5px;font-size:.9em}
.message-text pre{background:#0b0b0b;border:1px solid #252525;border-radius:10px;padding:13px;overflow:auto}
.message-text pre code{border:0;padding:0;background:none}
.sources{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.sources-title,.images-title{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:2px}
.source{display:block;text-decoration:none;color:#ddd;border:1px solid #252525;background:#080808;border-radius:10px;padding:11px 13px}
.source:hover{background:#111}
.source-name{font-size:13px;font-weight:600;margin-bottom:4px}
.source-url{font-size:11px;color:#777;overflow-wrap:anywhere}
.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-top:15px}
.images img{width:100%;height:145px;object-fit:cover;border-radius:10px;border:1px solid #292929;background:#111}
.composer-wrap{flex-shrink:0;padding:12px 18px max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#000 20%)}
.composer{max-width:820px;margin:0 auto;border:1px solid #333;background:#0b0b0b;border-radius:18px;padding:10px 11px 9px;box-shadow:0 8px 35px #000}
.composer:focus-within{border-color:#555}
#prompt{width:100%;resize:none;min-height:28px;max-height:160px;border:0;outline:0;background:transparent;color:#f5f5f5;font-size:15px;line-height:1.5;padding:5px 6px}
#prompt::placeholder{color:#666}
.composer-bottom{display:flex;align-items:center;justify-content:space-between;padding:5px 2px 0}
.hint{font-size:11px;color:#666;padding-left:5px}
.send{width:35px;height:35px;border:0;border-radius:11px;background:#f3f3f3;color:#050505;font-size:18px;font-weight:700}
.send:disabled{opacity:.35;cursor:not-allowed}
.status{max-width:820px;margin:7px auto 0;color:#777;font-size:11px;padding:0 6px;min-height:15px}
.typing{color:#888;font-size:13px}
@media(max-width:700px){
 .sidebar{position:absolute;z-index:5;inset:0 auto 0 0;width:min(290px,84vw);transform:translateX(-105%);transition:transform .2s;box-shadow:15px 0 45px #000}
 .sidebar.open{transform:translateX(0)}
 .mobile-menu{display:grid}
 .topbar{padding:0 12px}
 .chat-scroll{padding:22px 13px 14px}
 .composer-wrap{padding-left:12px;padding-right:12px}
 .welcome{min-height:50vh}
 .message-text{font-size:14px}
}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">V</div><span>VEX AI</span></div>
  <button class="new-chat" id="newChat">＋　New chat</button>
  <div class="side-label">Recent chats</div>
  <div class="history" id="history"></div>
  <div class="sidebar-bottom">VEX AI · Independent search assistant</div>
 </aside>
 <main class="main">
  <header class="topbar">
   <div style="display:flex;align-items:center;gap:10px">
    <button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button>
    <div class="top-title">VEX AI</div>
   </div>
   <div class="top-actions">
    <button class="icon-btn" id="shareBtn" title="Share chat" aria-label="Share">↗</button>
    <button class="icon-btn" id="clearBtn" title="Clear chat" aria-label="Clear chat">⌫</button>
   </div>
  </header>
  <section class="chat-scroll" id="chatScroll">
   <div class="chat-inner">
    <div class="welcome" id="welcome">
     <div class="welcome-mark">V</div>
     <h1>What can I help with?</h1>
     <p>Ask anything. VEX will search the web for relevant information.</p>
    </div>
    <div class="messages" id="messages"></div>
   </div>
  </section>
  <footer class="composer-wrap">
   <div class="composer">
    <textarea id="prompt" rows="1" placeholder="Message VEX AI..." aria-label="Message VEX AI"></textarea>
    <div class="composer-bottom">
     <span class="hint">Enter to send · Shift + Enter for new line</span>
     <button class="send" id="sendBtn" aria-label="Send" disabled>↑</button>
    </div>
   </div>
   <div class="status" id="status">Ready</div>
  </footer>
 </main>
</div>
<script>
(() => {
 const $ = id => document.getElementById(id);
 const promptBox=$('prompt'), sendBtn=$('sendBtn'), messages=$('messages');
 let chats=[], activeChat=[], pending=new Map(), requestCounter=0, busy=false;

 function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 function formatText(text){
  let s=escapeHtml(text);
  s=s.replace(/```([\s\S]*?)```/g,(_,c)=>'<pre><code>'+c.trim()+'</code></pre>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\n/g,'<br>');
  return s;
 }
 function scrollBottom(){const el=$('chatScroll');el.scrollTop=el.scrollHeight;}
 function saveChats(){
  try{localStorage.setItem('vex_chats',JSON.stringify(chats.slice(0,30)));}catch(e){}
 }
 function loadChats(){
  try{chats=JSON.parse(localStorage.getItem('vex_chats')||'[]');if(!Array.isArray(chats))chats=[];}catch(e){chats=[];}
  renderHistory();
 }
 function currentTitle(){const first=activeChat.find(m=>m.role==='user');return first?first.text.slice(0,42):'New chat';}
 function persistActive(){
  if(!activeChat.length)return;
  const id=activeChat._id||String(Date.now());
  activeChat._id=id;
  const item={id,title:currentTitle(),messages:activeChat};
  chats=[item,...chats.filter(c=>c.id!==id)].slice(0,30);saveChats();renderHistory();
 }
 function renderHistory(){
  $('history').innerHTML='';
  chats.forEach(chat=>{
   const b=document.createElement('button');b.className='history-item';b.textContent=chat.title||'Chat';
   b.onclick=()=>{activeChat=chat.messages||[];activeChat._id=chat.id;renderMessages();$('sidebar').classList.remove('open');};
   $('history').appendChild(b);
  });
 }
 function addMessage(role,text,extra={}){
  const msg={role,text:String(text??''),...extra};activeChat.push(msg);renderMessages();persistActive();return msg;
 }
 function renderMessages(){
  $('welcome').style.display=activeChat.length?'none':'flex';
  messages.innerHTML='';
  activeChat.forEach(msg=>{
   const row=document.createElement('div');row.className='message '+(msg.role==='user'?'user':'assistant');
   const avatar=msg.role==='user'?'U':'V';
   let html='<div class="avatar">'+avatar+'</div><div class="message-body"><div class="message-role">'+(msg.role==='user'?'You':'VEX AI')+'</div><div class="message-text">'+formatText(msg.text)+'</div>';
   if(msg.sources?.length){
    html+='<div class="sources"><div class="sources-title">Sources</div>';
    msg.sources.forEach(src=>{
     const url=src.url||src.href||'';
     if(url) html+='<a class="source" href="'+escapeHtml(url)+'" target="_blank" rel="noopener noreferrer"><div class="source-name">'+escapeHtml(src.title||'Web result')+'</div><div class="source-url">'+escapeHtml(url)+'</div></a>';
    });
    html+='</div>';
   }
   if(msg.images?.length){
    html+='<div class="images-title" style="margin-top:15px">Images</div><div class="images">';
    msg.images.forEach(img=>{
     const url=img.image||img.url||'';
     if(url) html+='<a href="'+escapeHtml(img.page_url||url)+'" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="'+escapeHtml(url)+'" alt="'+escapeHtml(img.title||'Search image')+'" onerror="this.parentElement.style.display=\'none\'"></a>';
    });
    html+='</div>';
   }
   html+='</div>';row.innerHTML=html;messages.appendChild(row);
  });
  scrollBottom();
 }
 function showTyping(){
  const row=document.createElement('div');row.className='message';row.id='typing';
  row.innerHTML='<div class="avatar">V</div><div class="message-body"><div class="message-role">VEX AI</div><div class="typing">Searching the web...</div></div>';
  messages.appendChild(row);scrollBottom();
 }
 function nativeSearch(query){
  return new Promise((resolve,reject)=>{
   const id='vex_'+Date.now()+'_'+(++requestCounter);
   const timer=setTimeout(()=>{pending.delete(id);reject(new Error('VEX app did not respond. Close and reopen the app, then try again.'));},90000);
   pending.set(id,{resolve,reject,timer});
   try{console.log('VEX_NATIVE_SEARCH:'+JSON.stringify({id,query}));}
   catch(e){clearTimeout(timer);pending.delete(id);reject(e);}
  });
 }
 window.addEventListener('vex-native-result',event=>{
  window.__vexNativeBridgeSeen=true;
  const data=event.detail||{},p=pending.get(String(data.id||''));
  if(!p)return;
  clearTimeout(p.timer);pending.delete(String(data.id));
  if(data.error)p.reject(new Error(data.error));
  else p.resolve(data.data||{});
 });
 async function send(){
  const query=promptBox.value.trim();if(!query||busy)return;
  busy=true;sendBtn.disabled=true;promptBox.value='';resizePrompt();
  addMessage('user',query);showTyping();$('status').textContent='Searching...';
  try{
   const data=await nativeSearch(query);
   const answer=data.answer||'I could not find a useful answer. Please try another query.';
   const sources=data.results||data.sources||[];
   const images=data.images||[];
   $('typing')?.remove();
   addMessage('assistant',answer,{sources,images});
   $('status').textContent='Search complete';
  }catch(err){
   $('typing')?.remove();
   addMessage('assistant','I could not connect to VEX search. '+(err.message||'Please try again.'));
   $('status').textContent='Connection error';
  }finally{busy=false;sendBtn.disabled=!promptBox.value.trim();promptBox.focus();}
 }
 function resizePrompt(){promptBox.style.height='auto';promptBox.style.height=Math.min(promptBox.scrollHeight,160)+'px';}
 promptBox.addEventListener('input',()=>{resizePrompt();sendBtn.disabled=!promptBox.value.trim()||busy;});
 promptBox.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
 sendBtn.addEventListener('click',send);
 $('newChat').onclick=()=>{activeChat=[];renderMessages();$('sidebar').classList.remove('open');promptBox.focus();};
 $('clearBtn').onclick=()=>{activeChat=[];renderMessages();persistActive();$('status').textContent='Chat cleared';};
 $('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');
 $('shareBtn').onclick=async()=>{
  const transcript=activeChat.map(m=>(m.role==='user'?'You':'VEX AI')+':\n'+m.text).join('\n\n');
  if(!transcript){$('status').textContent='Nothing to share yet';return;}
  try{
   if(navigator.share)await navigator.share({title:'VEX AI chat',text:transcript});
   else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(transcript);$('status').textContent='Chat copied to clipboard';}
   else{$('status').textContent='Sharing is not available on this device';}
  }catch(e){if(e.name!=='AbortError')$('status').textContent='Could not share this chat';}
 };
 loadChats();
})();
</script>
</body>
</html>
