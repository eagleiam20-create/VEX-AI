
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>VEX AI</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial, sans-serif;height:100vh;overflow:hidden}
button,textarea{font:inherit}
.app{height:100dvh;display:flex;background:#000}
.sidebar{width:260px;border-right:1px solid #222;padding:16px;display:flex;flex-direction:column;flex-shrink:0}
.brand{font-size:23px;font-weight:900;letter-spacing:4px;margin:8px 4px 25px}
.btn{background:#000;border:1px solid #333;color:#fff;padding:13px;border-radius:12px;text-align:left;cursor:pointer}
.btn:hover{background:#181818}
.section{font-size:10px;color:#777;letter-spacing:2px;margin:25px 5px 12px}
.history{overflow:auto;flex:1}
.history-item{padding:11px;border-radius:9px;font-size:13px;color:#ccc;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item:hover{background:#171717}
.profile{border-top:1px solid #222;padding:15px 5px 5px;font-size:12px;color:#888;line-height:1.8}
.profile strong{color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{height:58px;border-bottom:1px solid #171717;display:flex;align-items:center;padding:0 18px;gap:12px}
.top button{background:none;border:0;color:white;font-size:20px;cursor:pointer}
.top strong{font-size:14px}
.top small{color:#777;margin-left:8px}
#chat{flex:1;overflow:auto;padding:25px 18px 160px}
.welcome{max-width:700px;margin:19vh auto 25px;text-align:center}
.welcome h1{font-size:38px;letter-spacing:2px}
.welcome p{color:#888;font-size:14px}
.suggestions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:25px}
.suggestions button{background:#000;border:1px solid #333;color:#ddd;padding:12px 16px;border-radius:22px;cursor:pointer}
.suggestions button:hover{background:#fff;color:#000}
.message{max-width:800px;margin:0 auto 27px;line-height:1.8;font-size:15px;overflow-wrap:anywhere}
.user-row{display:flex;justify-content:flex-end}
.user-bubble{background:#fff;color:#000;padding:12px 17px;border-radius:20px;max-width:85%;white-space:pre-wrap}
.label{font-size:10px;color:#888;letter-spacing:2px;margin:22px 0 10px;font-weight:bold}
.answer{white-space:pre-wrap;line-height:1.9}
.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.source{border:1px solid #292929;padding:13px;border-radius:11px;text-decoration:none;color:#fff;display:block}
.source:hover{border-color:#fff}
.source b{display:block;font-size:13px}
.source small{display:block;color:#999;font-size:11px;margin-top:6px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.image-card{background:#090909;border:1px solid #242424;border-radius:11px;overflow:hidden;cursor:pointer}
.image-card img{width:100%;height:145px;object-fit:cover;display:block}
.image-card div{padding:8px;font-size:11px;color:#bbb}
.actions{display:flex;gap:10px;margin-top:12px}
.actions button{background:none;border:0;color:#888;cursor:pointer;padding:6px}
.related{display:block;width:100%;text-align:left;padding:13px;border:1px solid #292929;border-radius:10px;background:#000;color:#fff;cursor:pointer}
.related:hover{border-color:#fff}
.composer-area{position:absolute;bottom:0;left:0;right:0;padding:25px 16px 13px;background:linear-gradient(transparent,#000 25%)}
.composer{max-width:800px;margin:auto;border:1px solid #444;border-radius:25px;background:#000;padding:10px 12px;display:flex;align-items:flex-end;gap:10px}
.composer:focus-within{border-color:#aaa}
textarea{background:none;color:#fff;border:0;outline:0;resize:none;flex:1;min-height:30px;max-height:130px;padding:7px;font-size:15px}
textarea::placeholder{color:#777}
.send{border:0;border-radius:50%;width:39px;height:39px;background:#fff;color:#000;font-size:22px;font-weight:bold;cursor:pointer}
.send:disabled{opacity:.4}
.note{text-align:center;color:#666;font-size:10px;margin-top:10px}
.loading{color:#aaa;font-size:13px}
.loading:before{content:"";display:inline-block;width:7px;height:7px;background:white;border-radius:50%;margin-right:10px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.2}}
#viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:20;align-items:center;justify-content:center;padding:20px}
#viewer img{max-width:95vw;max-height:85vh;object-fit:contain}
#viewer button{position:absolute;top:20px;right:25px;background:none;border:0;color:white;font-size:30px;cursor:pointer}
@media(max-width:700px){
.sidebar{position:fixed;z-index:10;top:0;bottom:0;left:-275px;background:#000;transition:.2s}
.sidebar.open{left:0}
.welcome{margin-top:17vh}
.welcome h1{font-size:29px}
#chat{padding:18px 13px 150px}
}
</style>
</head>

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand">VEX AI</div>
  <button class="btn" onclick="newChat()">＋ &nbsp; New chat</button>
  <div class="section">YOUR CHATS</div>
  <div class="history" id="history"></div>
  <div class="profile">
    <strong>VEX AI</strong><br>
    Owner &amp; Creator: Avee Sharma<br>
    Experimental model: VEX V6<br>
    Independent AI project
  </div>
</aside>

<main class="main">
  <div class="top">
    <button onclick="toggleSidebar()">☰</button>
    <strong>VEX AI</strong><small>Knowledge Assistant</small>
  </div>

  <div id="chat">
    <div class="welcome" id="welcome">
      <h1>What can I help with?</h1>
      <p>Explore knowledge. Discover ideas. Ask VEX anything.</p>
      <div class="suggestions">
        <button onclick="quickAsk('Explain artificial intelligence')">Explain AI</button>
        <button onclick="quickAsk('Latest space discoveries')">Space</button>
        <button onclick="quickAsk('How does the internet work?')">Technology</button>
        <button onclick="quickAsk('Explain quantum computing')">Science</button>
      </div>
    </div>
  </div>

  <div class="composer-area">
    <div class="composer">
      <textarea id="question" rows="1" placeholder="Message VEX AI..."></textarea>
      <button class="send" id="send">↑</button>
    </div>
    <div class="note">VEX AI · Built by Avee Sharma</div>
  </div>
</main>
</div>

<div id="viewer" onclick="closeViewer()">
  <button onclick="closeViewer()">×</button>
  <img id="viewerImage" alt="VEX image">
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("question");
const sendButton=document.getElementById("send");
const historyBox=document.getElementById("history");

let conversations=[];
let activeId=null;
let busy=false;

const WIKI="https://en.wikipedia.org/w/api.php";
const COMMONS="https://commons.wikimedia.org/w/api.php";

function toggleSidebar(){
  document.getElementById("sidebar").classList.toggle("open");
}

function saveHistory(){
  try{
    localStorage.setItem("vex_chats",JSON.stringify(conversations));
  }catch(e){}
}

function loadHistory(){
  try{
    conversations=JSON.parse(localStorage.getItem("vex_chats")||"[]");
    if(!Array.isArray(conversations))conversations=[];
  }catch(e){conversations=[]}
  renderHistory();
}

function renderHistory(){
  historyBox.innerHTML="";
  conversations.forEach(c=>{
    const el=document.createElement("div");
    el.className="history-item";
    el.textContent=c.title;
    el.onclick=()=>openChat(c.id);
    historyBox.appendChild(el);
  });
}

function newChat(){
  activeId=null;
  chat.innerHTML=`
  <div class="welcome" id="welcome">
    <h1>What can I help with?</h1>
    <p>Explore knowledge. Discover ideas. Ask VEX anything.</p>
    <div class="suggestions">
      <button onclick="quickAsk('Explain artificial intelligence')">Explain AI</button>
      <button onclick="quickAsk('Latest space discoveries')">Space</button>
      <button onclick="quickAsk('How does the internet work?')">Technology</button>
      <button onclick="quickAsk('Explain quantum computing')">Science</button>
    </div>
  </div>`;
  document.getElementById("sidebar").classList.remove("open");
}

function openChat(id){
  const c=conversations.find(x=>x.id===id);
  if(!c)return;
  activeId=id;
  chat.innerHTML="";
  c.messages.forEach(m=>{
    if(m.type==="user")addUser(m.text,false);
    else renderAnswer(m.data,false);
  });
  document.getElementById("sidebar").classList.remove("open");
}

function storeMessage(message){
  if(!activeId){
    activeId=String(Date.now());
    conversations.unshift({
      id:activeId,
      title:message.type==="user"?message.text.slice(0,45):"New chat",
      messages:[]
    });
  }
  const c=conversations.find(x=>x.id===activeId);
  if(c)c.messages.push(message);
  saveHistory();
  renderHistory();
}

function addUser(text,save=true){
  document.getElementById("welcome")?.remove();
  const row=document.createElement("div");
  row.className="message user-row";
  const bubble=document.createElement("div");
  bubble.className="user-bubble";
  bubble.textContent=text;
  row.appendChild(bubble);
  chat.appendChild(row);
  if(save)storeMessage({type:"user",text});
  scrollDown();
}

function addLabel(parent,text){
  const el=document.createElement("div");
  el.className="label";
  el.textContent=text;
  parent.appendChild(el);
}

function scrollDown(){
  chat.scrollTop=chat.scrollHeight;
}

function showViewer(url){
  document.getElementById("viewerImage").src=url;
  document.getElementById("viewer").style.display="flex";
}

function closeViewer(){
  document.getElementById("viewer").style.display="none";
  document.getElementById("viewerImage").src="";
}

function renderAnswer(data,save=true){
  const box=document.createElement("div");
  box.className="message";
  addLabel(box,"VEX AI");

  if(data.imageOnly){
    addLabel(box,"IMAGES");
    addGallery(box,data.images||[]);
  }else{
    const answer=document.createElement("div");
    answer.className="answer";
    answer.textContent=data.answer||"No answer was found.";
    box.appendChild(answer);

    if(data.images?.length){
      addLabel(box,"RELATED IMAGES");
      addGallery(box,data.images);
    }

    if(data.sources?.length){
      addLabel(box,"WEB SOURCES");
      const grid=document.createElement("div");
      grid.className="sources";

      data.sources.forEach(source=>{
        if(!source.url)return;
        const a=document.createElement("a");
        a.className="source";
        a.href=source.url;
        a.target="_blank";
        a.rel="noopener noreferrer";

        const title=document.createElement("b");
        title.textContent=source.title||"Web source";

        const description=document.createElement("small");
        description.textContent=source.description||"Read source";

        a.append(title,description);
        grid.appendChild(a);
      });

      box.appendChild(grid);
    }

    if(data.related){
      addLabel(box,"ASK VEX");
      const related=document.createElement("button");
      related.className="related";
      related.textContent=data.related;
      related.onclick=()=>quickAsk(data.related);
      box.appendChild(related);
    }

    const actions=document.createElement("div");
    actions.className="actions";
    const copy=document.createElement("button");
    copy.textContent="Copy answer";
    copy.onclick=()=>{
      navigator.clipboard?.writeText(data.answer||"");
      copy.textContent="Copied";
    };
    actions.appendChild(copy);
    box.appendChild(actions);
  }

  chat.appendChild(box);
  if(save)storeMessage({type:"bot",data});
  scrollDown();
}

function addGallery(parent,images){
  const gallery=document.createElement("div");
  gallery.className="gallery";

  images.forEach(item=>{
    if(!item.url)return;

    const card=document.createElement("div");
    card.className="image-card";
    card.onclick=()=>showViewer(item.url);

    const img=document.createElement("img");
    img.src=item.url;
    img.alt=item.title||"VEX image";
    img.loading="lazy";
    img.onerror=()=>card.remove();

    const caption=document.createElement("div");
    caption.textContent=item.title||"Open image";

    card.append(img,caption);
    gallery.appendChild(card);
  });

  parent.appendChild(gallery);
}

function isImageRequest(query){
  return /\b(show|find|give|display|send|get)\b.*\b(images?|photos?|pictures?)\b|\b(images?|photos?|pictures?)\b.*\b(of|for|show)\b/i.test(query);
}

function cleanQuery(query){
  return query
    .replace(/\b(show me|show|find|give me|give|display|send me|get me|images?|photos?|pictures?)\b/gi," ")
    .replace(/\b(of|for|please)\b/gi," ")
    .replace(/\s+/g," ")
    .trim();
}

async function wikiSearch(query){
  const url=WIKI+"?origin=*&action=query&format=json&list=search&srlimit=5&srsearch="+encodeURIComponent(query);
  const response=await fetch(url);
  if(!response.ok)throw new Error("Wikipedia search is unavailable.");
  const json=await response.json();
  return json.query?.search||[];
}

async function wikiSummary(title){
  const url="https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title);
  const response=await fetch(url);
  if(!response.ok)return null;
  return await response.json();
}

async function commonsImages(query){
  const url=COMMONS+
    "?origin=*&action=query&format=json&generator=search"+
    "&gsrsearch="+encodeURIComponent(query+" filetype:bitmap")+
    "&gsrnamespace=6&gsrlimit=8"+
    "&prop=imageinfo&iiprop=url&iiurlwidth=500";

  const response=await fetch(url);
  if(!response.ok)return [];
  const json=await response.json();
  const pages=Object.values(json.query?.pages||{});

  return pages.map(page=>{
    const info=page.imageinfo?.[0];
    if(!info)return null;
    return {
      title:page.title.replace("File:",""),
      url:info.thumburl||info.url
    };
  }).filter(Boolean);
}

function makeRelated(query){
  const words=query.replace(/[?!.]/g,"").trim().split(/\s+/);
  if(!words.length)return "";
  return "How does "+words.slice(0,7).join(" ")+" work?";
}

async function searchVex(query){
  const imageOnly=isImageRequest(query);
  const searchTerm=imageOnly?cleanQuery(query):query;

  if(!searchTerm)throw new Error("Please tell VEX what image you want.");

  const imagePromise=commonsImages(searchTerm);

  if(imageOnly){
    const images=await imagePromise;
    return {
      imageOnly:true,
      images
    };
  }

  const results=await wikiSearch(searchTerm);

  const summaries=await Promise.all(
    results.slice(0,4).map(item=>wikiSummary(item.title))
  );

  const sources=[];
  const answerParts=[];

  summaries.forEach((item,index)=>{
    if(!item)return;

    const title=item.title||results[index]?.title||"Source";
    const description=item.extract||"";
    const url=item.content_urls?.desktop?.page||
      "https://en.wikipedia.org/wiki/"+encodeURIComponent(title.replace(/ /g,"_"));

    if(description){
      answerParts.push(title+"\n"+description);
      sources.push({title,url,description:description.slice(0,180)});
    }
  });

  const images=await imagePromise;

  let answer;
  if(answerParts.length){
    answer=answerParts.slice(0,3).join("\n\n");
  }else{
    answer="I couldn't find a matching Wikipedia article. Try asking with different keywords.";
  }

  return {
    imageOnly:false,
    answer,
    images,
    sources,
    related:answerParts.length?makeRelated(searchTerm):""
  };
}

async function sendMessage(){
  const query=input.value.trim();
  if(!query||busy)return;

  busy=true;
  sendButton.disabled=true;

  addUser(query);
  input.value="";
  input.style.height="30px";

  const loading=document.createElement("div");
  loading.className="message loading";
  loading.textContent="VEX is searching information and images...";
  chat.appendChild(loading);
  scrollDown();

  try{
    const result=await searchVex(query);
    loading.remove();

    if(!result.imageOnly&&!result.answer){
      result.answer="I couldn't find a useful answer.";
    }

    renderAnswer(result,true);

  }catch(error){
    loading.className="message";
    loading.textContent="VEX error: "+(error.message||"Search failed. Please try again.");
  }finally{
    busy=false;
    sendButton.disabled=false;
    input.focus();
  }
}

function quickAsk(text){
  input.value=text;
  sendMessage();
}

sendButton.addEventListener("click",sendMessage);

input.addEventListener("keydown",event=>{
  if(event.key==="Enter"&&!event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input",function(){
  this.style.height="auto";
  this.style.height=Math.min(this.scrollHeight,130)+"px";
});

loadHistory();
</script>
</body>
</html>
