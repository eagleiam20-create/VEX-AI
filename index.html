<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>VEX AI</title>

<style>
:root{--black:#000;--white:#fff;--border:#202020;--soft:#a0a0a0}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Inter,"Segoe UI",Arial,sans-serif}
body{height:100dvh;overflow:hidden}
button,textarea{font:inherit}
.app{height:100dvh;display:flex;background:#000}

.sidebar{width:265px;background:#000;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px;flex-shrink:0}
.side-top{display:flex;align-items:center;justify-content:space-between;padding:8px 5px 22px}
.brand{font-size:22px;font-weight:900;letter-spacing:3px;color:#fff}
.icon-btn{background:transparent;border:0;color:#fff;font-size:21px;cursor:pointer;padding:9px;border-radius:10px}
.icon-btn:hover{background:#171717}
.new-chat{background:#000;border:1px solid #333;color:#fff;border-radius:12px;padding:13px;text-align:left;cursor:pointer;transition:.2s}
.new-chat:hover{background:#151515;border-color:#777}
.history-title{font-size:10px;color:#888;margin:25px 8px 10px;letter-spacing:2px}
.history{overflow-y:auto;flex:1}
.history-item{padding:11px;border-radius:9px;color:#ddd;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.history-item:hover{background:#151515}
.profile{border-top:1px solid #202020;padding:15px 6px 5px}
.profile-name{font-size:13px;font-weight:800;color:white}
.profile-info{font-size:11px;color:#888;margin-top:6px;line-height:1.8}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh;background:#000}
.topbar{height:60px;min-height:60px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid #171717;background:#000}
.mobile-brand{display:none;font-weight:900;letter-spacing:2px}
.model-label{font-size:14px;color:#fff;font-weight:600}
.model-label span{color:#777;font-size:11px;margin-left:8px}

#chat{flex:1;overflow-y:auto;padding:26px 20px 165px;scroll-behavior:smooth;background:#000}
.welcome{max-width:700px;margin:20vh auto 30px;text-align:center}
.welcome h1{font-size:39px;letter-spacing:4px;font-weight:750;margin:0 0 14px;color:#fff}
.welcome p{color:#888;font-size:14px}
.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:30px}
.suggestions button{background:#000;border:1px solid #292929;color:#ddd;border-radius:22px;padding:12px 17px;font-size:12px;cursor:pointer;transition:.2s}
.suggestions button:hover{background:#fff;color:#000;border-color:#fff}

.message{max-width:790px;width:100%;margin:0 auto 28px;line-height:1.8;font-size:15px;overflow-wrap:anywhere}
.user-wrap{display:flex;justify-content:flex-end}
.user{background:#fff;color:#000;padding:12px 18px;border-radius:21px;max-width:80%;white-space:pre-wrap}
.bot{padding:6px 0;color:#fff}
.answer{white-space:pre-wrap;line-height:1.9;color:#fff}
.label{font-size:10px;letter-spacing:2px;color:#888;margin:20px 0 10px;font-weight:700}

.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.source{display:block;background:#000;border:1px solid #292929;padding:14px;border-radius:12px;text-decoration:none;color:#fff;transition:.2s}
.source:hover{border-color:#fff}
.source strong{font-size:13px;display:block}
.source small{font-size:11px;color:#999;display:block;margin-top:6px;line-height:1.6}
.tag{font-size:9px;color:#888;display:block;margin-bottom:7px;letter-spacing:1.5px}

.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.image-card{border:0;background:#080808;padding:0;border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;color:#ddd}
.image-card img{width:100%;height:145px;object-fit:cover;display:block;background:#080808;transition:transform .25s}
.image-card:hover img{transform:scale(1.04)}
.image-card span{display:block;padding:8px;font-size:11px;line-height:1.4}

.related{display:flex;flex-wrap:wrap;gap:9px}
.related button{background:#050505;border:1px solid #292929;color:#ddd;border-radius:18px;padding:10px 14px;text-align:left;font-size:12px;cursor:pointer}
.related button:hover{border-color:#fff;color:#fff}

.composer-area{position:absolute;bottom:0;left:265px;right:0;background:linear-gradient(transparent,#000 22%);padding:30px 20px 17px}
.composer{max-width:790px;margin:auto;background:#000;border:1px solid #454545;border-radius:26px;padding:10px 12px;display:flex;gap:10px;align-items:flex-end;transition:.2s}
.composer:focus-within{border-color:#aaa}
textarea{background:transparent;color:#fff;border:0;outline:0;resize:none;flex:1;min-height:30px;max-height:130px;font-size:15px;padding:7px 3px}
textarea::placeholder{color:#777}
.send{width:39px;height:39px;border:0;border-radius:50%;background:#fff;color:#000;font-size:23px;font-weight:900;cursor:pointer}
.send:hover{background:#ddd}
.send:disabled{opacity:.4;cursor:not-allowed}
.bottom-note{text-align:center;color:#666;font-size:10px;margin-top:11px}
.actions{display:flex;gap:9px;margin-top:12px}
.actions button{background:transparent;border:0;color:#888;padding:7px;cursor:pointer;font-size:12px}
.actions button:hover{color:#fff}
.progress{color:#aaa;font-size:13px}
.progress:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:10px;animation:pulse 1s infinite}
.error-text{color:#aaa;font-size:13px}

.viewer{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:50;display:none;align-items:center;justify-content:center;padding:55px 20px 25px}
.viewer.open{display:flex}
.viewer img{max-width:95vw;max-height:85vh;object-fit:contain}
.viewer-close{position:absolute;right:22px;top:15px;background:#151515;color:#fff;border:1px solid #444;border-radius:50%;width:42px;height:42px;font-size:24px;cursor:pointer}
.viewer-caption{position:absolute;bottom:15px;left:15px;right:15px;text-align:center;color:#aaa;font-size:12px}

#chat::-webkit-scrollbar,.history::-webkit-scrollbar{width:5px}
#chat::-webkit-scrollbar-thumb,.history::-webkit-scrollbar-thumb{background:#292929;border-radius:10px}

@keyframes pulse{50%{opacity:.2}}

@media(max-width:700px){
 .sidebar{position:fixed;z-index:5;left:-275px;top:0;bottom:0;transition:left .2s}
 .sidebar.open{left:0}
 .main{width:100%}
 .mobile-brand{display:block;margin-right:15px}
 .topbar{padding:0 12px}
 #chat{padding:20px 15px 155px}
 .composer-area{left:0;padding:22px 12px 12px}
 .welcome{margin-top:18vh}
 .welcome h1{font-size:31px}
 .user{max-width:90%}
 .sources{grid-template-columns:1fr}
 .images{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
 <div class="side-top">
  <div class="brand">VEX AI</div>
  <button class="icon-btn" onclick="toggleSidebar()">×</button>
 </div>

 <button class="new-chat" onclick="newChat()">＋ &nbsp; New chat</button>

 <div class="history-title">YOUR CHATS</div>
 <div class="history" id="history"></div>

 <div class="profile">
  <div class="profile-name">VEX AI</div>
  <div class="profile-info">
   Owner &amp; Creator: Avee Sharma<br>
   Experimental model: VEX V6<br>
   Knowledge: Public web index<br>
   Independent AI project
  </div>
 </div>
</aside>

<main class="main">
 <div class="topbar">
  <button class="icon-btn" onclick="toggleSidebar()">☰</button>
  <div class="mobile-brand">VEX AI</div>
  <div class="model-label">VEX AI <span>Knowledge Assistant</span></div>
 </div>

 <section id="chat">
  <div class="welcome" id="welcome">
   <h1>What can I help with?</h1>
   <p>Explore knowledge. Discover ideas. Ask VEX anything.</p>
   <div class="suggestions">
    <button onclick="quickAsk('Explain artificial intelligence')">Explain AI</button>
    <button onclick="quickAsk('Latest space discoveries')">Space</button>
    <button onclick="quickAsk('How does the internet work?')">Technology</button>
    <button onclick="quickAsk('Explain quantum computing')">Science</button>
   </div>
  </div>
 </section>

 <div class="composer-area">
  <div class="composer">
   <textarea id="question" rows="1" placeholder="Message VEX AI..." aria-label="Message VEX AI"></textarea>
   <button class="send" id="send" aria-label="Send">↑</button>
  </div>
  <div class="bottom-note">VEX AI · Built by Avee Sharma</div>
 </div>
</main>
</div>

<!-- In-app image viewer -->
<div class="viewer" id="viewer" onclick="closeViewer()">
 <button class="viewer-close" onclick="closeViewer()">×</button>
 <img id="viewer-image" alt="Image preview">
 <div class="viewer-caption" id="viewer-caption"></div>
</div>

<script>
const API = "https://puri.li";

const chat = document.getElementById("chat");
const input = document.getElementById("question");
const sendButton = document.getElementById("send");
const historyBox = document.getElementById("history");

let conversations = [];
let activeId = null;
let searching = false;

/* ---------------- CHAT HISTORY ---------------- */

function saveHistory(){
 try{
  localStorage.setItem("vex_chats",JSON.stringify(conversations));
 }catch(e){}
}

function loadHistory(){
 try{
  conversations=JSON.parse(localStorage.getItem("vex_chats")||"[]");
  if(!Array.isArray(conversations))conversations=[];
 }catch(e){
  conversations=[];
 }
 renderHistory();
}

function renderHistory(){
 historyBox.textContent="";
 conversations.forEach(c=>{
  const el=document.createElement("div");
  el.className="history-item";
  el.textContent=c.title||"New chat";
  el.onclick=()=>openChat(c.id);
  historyBox.appendChild(el);
 });
}

function newChat(){
 activeId=null;
 chat.innerHTML=`
 <div class="welcome" id="welcome">
  <h1>What can I help with?</h1>
  <p>Explore knowledge. Discover ideas. Ask VEX anything.</p>
  <div class="suggestions">
   <button onclick="quickAsk('Explain artificial intelligence')">Explain AI</button>
   <button onclick="quickAsk('Latest space discoveries')">Space</button>
   <button onclick="quickAsk('How does the internet work?')">Technology</button>
   <button onclick="quickAsk('Explain quantum computing')">Science</button>
  </div>
 </div>`;
 input.value="";
 input.focus();
 document.getElementById("sidebar").classList.remove("open");
}

function toggleSidebar(){
 document.getElementById("sidebar").classList.toggle("open");
}

function openChat(id){
 const c=conversations.find(x=>x.id===id);
 if(!c)return;

 activeId=id;
 chat.innerHTML="";

 c.messages.forEach(m=>{
  if(m.type==="user")addUser(m.text,false);
  else renderBot(m.data,false);
 });

 document.getElementById("sidebar").classList.remove("open");
}

function storeMessage(m){
 if(!activeId){
  activeId=String(Date.now());
  conversations.unshift({
   id:activeId,
   title:m.type==="user"?m.text.slice(0,45):"New chat",
   messages:[]
  });
 }

 const c=conversations.find(x=>x.id===activeId);
 if(c)c.messages.push(m);

 saveHistory();
 renderHistory();
}

function addUser(text,save=true){
 document.getElementById("welcome")?.remove();

 const wrap=document.createElement("div");
 wrap.className="message user-wrap";

 const bubble=document.createElement("div");
 bubble.className="user";
 bubble.textContent=text;

 wrap.appendChild(bubble);
 chat.appendChild(wrap);

 if(save)storeMessage({type:"user",text});
 scrollDown();
}

function addLabel(parent,text){
 const el=document.createElement("div");
 el.className="label";
 el.textContent=text;
 parent.appendChild(el);
}

function scrollDown(){
 chat.scrollTop=chat.scrollHeight;
}

/* ---------------- SAFE HELPERS ---------------- */

function validURL(url){
 try{
  const u=new URL(url);
  return u.protocol==="https:"||u.protocol==="http:";
 }catch(e){
  return false;
 }
}

function escapeText(value){
 return String(value||"").replace(/\s+/g," ").trim();
}

function getHost(url){
 try{return new URL(url).hostname.replace(/^www\./,"");}
 catch(e){return "WEB SOURCE";}
}

async function fetchJSON(url,timeout=25000){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),timeout);

 try{
  const response=await fetch(url,{
   method:"GET",
   signal:controller.signal,
   headers:{"Accept":"application/json"}
  });

  if(!response.ok)throw new Error("Search service returned "+response.status);
  return await response.json();
 }finally{
  clearTimeout(timer);
 }
}

/* ---------------- INTERNET SEARCH ---------------- */

/*
  Purili search returns ranked pages from its independent
  crawler-built web index. It is not a Wikipedia-only search.
*/

async function searchWeb(query,page=1){
 const params=new URLSearchParams({
  q:query,
  page:String(page),
  exact:"0"
 });

 const data=await fetchJSON(API+"/api/search?"+params.toString());

 return Array.isArray(data.results)?data.results:[];
}

/*
  Context retrieves text already stored in the search index.
  It does not scrape every live website.
*/

async function getPageContext(url){
 try{
  const params=new URLSearchParams({url});
  return await fetchJSON(API+"/api/context?"+params.toString(),20000);
 }catch(e){
  return null;
 }
}

/* ---------------- RELEVANCE / ANSWER ---------------- */

function getWords(text){
 return String(text||"")
  .toLowerCase()
  .replace(/[^a-z0-9\s]/g," ")
  .split(/\s+/)
  .filter(w=>w.length>2);
}

function scoreText(text,words){
 const lower=String(text||"").toLowerCase();
 let score=0;

 words.forEach(word=>{
  const matches=lower.split(word).length-1;
  score+=Math.min(matches,5);
 });

 return score;
}

function extractParagraphs(text){
 return String(text||"")
  .replace(/\r/g,"")
  .split(/\n+/)
  .map(p=>p.replace(/\s+/g," ").trim())
  .filter(p=>p.length>100);
}

function buildAnswer(query,results,contexts){
 const words=getWords(query);
 let passages=[];

 results.forEach((result,index)=>{
  const context=contexts[index];

  const title=result.title||context?.title||"";
  const content=context?.content||context?.summary||result.description||"";

  const paragraphs=extractParagraphs(content);

  paragraphs.forEach(p=>{
   const score=scoreText(p,words)+scoreText(title,words)*2;

   if(score>0){
    passages.push({
     text:p,
     score,
     title
    });
   }
  });

  if(paragraphs.length===0&&result.description){
   passages.push({
    text:result.description,
    score:scoreText(result.description,words)+1,
    title
   });
  }
 });

 passages.sort((a,b)=>b.score-a.score);

 const selected=[];
 const seen=new Set();

 for(const p of passages){
  const key=p.text.slice(0,100).toLowerCase();
  if(seen.has(key))continue;

  seen.add(key);
  selected.push(p);

  if(selected.length>=4)break;
 }

 if(!selected.length){
  const descriptions=results
   .map(r=>r.description)
   .filter(Boolean)
   .slice(0,4);

  if(descriptions.length){
   return "Here is what I found from the indexed web sources:\n\n"+
    descriptions.map((x,i)=>(i+1)+". "+x).join("\n\n");
  }

  return "I couldn't find enough relevant indexed information for this question. Try using more specific keywords.";
 }

 return "Here is a source-based overview of your question:\n\n"+
  selected.map((p,i)=>(i+1)+". "+p.text.slice(0,850)).join("\n\n");
}

/* ---------------- RELATED QUESTIONS ---------------- */

function makeRelatedQuestions(query,results){
 const title=escapeText(results[0]?.title||"");
 let topic=title||query;

 if(topic.length>65)topic=topic.slice(0,65).trim();

 const questions=[
  "How does "+topic+" work?",
  "What are the important facts about "+topic+"?",
  "What are the latest developments related to "+topic+"?"
 ];

 return [...new Set(questions)].slice(0,3);
}

/* ---------------- IMAGE SEARCH ---------------- */

function isImageOnlyRequest(query){
 const q=query.toLowerCase().trim();

 return (
  /\b(images?|photos?|pictures?)\s+(of|for)\b/i.test(q) ||
  /\b(show|find|display|send|get|give)\b.*\b(images?|photos?|pictures?)\b/i.test(q) ||
  /\b(images?|photos?|pictures?)\b.*\b(only|please|show)\b/i.test(q) ||
  /^(image|images|photo|photos|picture|pictures)\s*$/i.test(q)
 );
}

function cleanImageQuery(query){
 return query
  .replace(/\b(show me|show|find|display|send|give me|get me|give|please)\b/gi,"")
  .replace(/\b(images?|photos?|pictures?)\b/gi,"")
  .replace(/\b(only)\b/gi,"")
  .replace(/\b(of|for)\b/gi,"")
  .replace(/\s+/g," ")
  .trim();
}

async function searchImages(query){
 const params=new URLSearchParams({
  q:query,
  page:"1"
 });

 const data=await fetchJSON(API+"/api/images?"+params.toString());

 return Array.isArray(data.images)?data.images:[];
}

/* ---------------- IMAGE VIEWER ---------------- */

function showViewer(url,title){
 if(!validURL(url))return;

 document.getElementById("viewer-image").src=url;
 document.getElementById("viewer-caption").textContent=title||"";
 document.getElementById("viewer").classList.add("open");
}

function closeViewer(){
 document.getElementById("viewer").classList.remove("open");
 document.getElementById("viewer-image").src="";
}

document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeViewer();
});

/* ---------------- RENDER IMAGES ---------------- */

function renderImages(parent,images){
 if(!images?.length)return;

 const gallery=document.createElement("div");
 gallery.className="images";

 images.forEach(item=>{
  const imageUrl=item.thumbUrl||item.image||item.url||"";
  const title=escapeText(item.title||"Image");

  if(!validURL(imageUrl))return;

  const card=document.createElement("button");
  card.className="image-card";
  card.type="button";
  card.onclick=()=>showViewer(item.url||imageUrl,title);

  const img=document.createElement("img");
  img.src=imageUrl;
  img.alt=title;
  img.loading="lazy";
  img.onerror=()=>card.remove();

  const caption=document.createElement("span");
  caption.textContent=title;

  card.append(img,caption);
  gallery.appendChild(card);
 });

 if(gallery.children.length)parent.appendChild(gallery);
}

/* ---------------- RENDER SOURCES ---------------- */

function renderSources(parent,results){
 const grid=document.createElement("div");
 grid.className="sources";

 results.forEach(item=>{
  const url=item.url||"";
  if(!validURL(url))return;

  const a=document.createElement("a");
  a.className="source";
  a.href=url;
  a.target="_blank";
  a.rel="noopener noreferrer";

  const tag=document.createElement("span");
  tag.className="tag";
  tag.textContent=getHost(url);

  const title=document.createElement("strong");
  title.textContent=item.title||"Web result";

  const small=document.createElement("small");
  small.textContent=item.description||"Open original source";

  a.append(tag,title,small);
  grid.appendChild(a);
 });

 if(grid.children.length)parent.appendChild(grid);
}

/* ---------------- RENDER RELATED QUESTIONS ---------------- */

function renderRelated(parent,questions){
 if(!questions?.length)return;

 const row=document.createElement("div");
 row.className="related";

 questions.forEach(q=>{
  const btn=document.createElement("button");
  btn.type="button";
  btn.textContent=q;
  btn.onclick=()=>quickAsk(q);
  row.appendChild(btn);
 });

 parent.appendChild(row);
}

/* ---------------- BOT MESSAGE ---------------- */

function renderBot(data,save=true){
 const reply=document.createElement("div");
 reply.className="message bot";

 addLabel(reply,"VEX AI");

 /*
   Image-only response:
   show only images. No answer, sources or suggestions.
 */
 if(data.imageOnly){
  renderImages(reply,data.images||[]);
  if(!reply.querySelector(".images")){
   const empty=document.createElement("div");
   empty.className="error-text";
   empty.textContent="No images were found for this search.";
   reply.appendChild(empty);
  }
 }else{
  const answer=document.createElement("div");
  answer.className="answer";
  answer.textContent=data.answer||"No information found.";
  reply.appendChild(answer);

  if(data.images?.length){
   addLabel(reply,"RELATED IMAGES");
   renderImages(reply,data.images);
  }

  if(data.results?.length){
   addLabel(reply,"WEB SOURCES");
   renderSources(reply,data.results);
  }

  if(data.related?.length){
   addLabel(reply,"EXPLORE FURTHER");
   renderRelated(reply,data.related);
  }

  const actions=document.createElement("div");
  actions.className="actions";

  const copy=document.createElement("button");
  copy.textContent="Copy";
  copy.onclick=()=>{
   navigator.clipboard?.writeText(data.answer||"");
   copy.textContent="Copied";
   setTimeout(()=>copy.textContent="Copy",1200);
  };

  actions.appendChild(copy);
  reply.appendChild(actions);
 }

 chat.appendChild(reply);

 if(save)storeMessage({type:"bot",data});
 scrollDown();
}

/* ---------------- SEARCH PROCESS ---------------- */

function showProgress(text){
 let el=document.getElementById("vex-progress");

 if(!el){
  el=document.createElement("div");
  el.id="vex-progress";
  el.className="message bot progress";
  chat.appendChild(el);
 }

 el.textContent=text;
 scrollDown();
}

function removeProgress(){
 document.getElementById("vex-progress")?.remove();
}

async function runImageSearch(query){
 const clean=cleanImageQuery(query)||query;
 const images=await searchImages(clean);

 return {
  imageOnly:true,
  images
 };
}

async function runWebSearch(query){
 showProgress("Finding relevant pages across the web...");

 const results=await searchWeb(query);

 if(!results.length){
  return {
   answer:"I couldn't find matching pages in the current web index. Try a different or more specific search query.",
   results:[],
   images:[],
   related:[]
  };
 }

 showProgress("Reading relevant indexed sources...");

 const selected=results.slice(0,5);

 const contexts=await Promise.all(
  selected.map(r=>getPageContext(r.url))
 );

 showProgress("Preparing your answer...");

 const answer=buildAnswer(query,selected,contexts);

 let images=[];
 try{
  const imageData=await searchImages(query);
  images=imageData.slice(0,6);
 }catch(e){
  images=[];
 }

 return {
  imageOnly:false,
  answer,
  results:selected,
  images,
  related:makeRelatedQuestions(query,selected)
 };
}

/* ---------------- SEND MESSAGE ---------------- */

async function sendMessage(){
 const query=input.value.trim();

 if(!query||searching)return;

 searching=true;
 sendButton.disabled=true;

 addUser(query);

 input.value="";
 input.style.height="30px";

 showProgress("Understanding your question...");

 try{
  let data;

  if(isImageOnlyRequest(query)){
   showProgress("Finding matching images...");
   data=await runImageSearch(query);
  }else{
   data=await runWebSearch(query);
  }

  removeProgress();
  renderBot(data,true);

 }catch(error){
  removeProgress();

  const reply=document.createElement("div");
  reply.className="message bot";

  addLabel(reply,"VEX AI");

  const text=document.createElement("div");
  text.className="error-text";
  text.textContent=
   "VEX couldn't access the web search service right now. Please try again. ("+
   (error.message||"Network error")+")";

  reply.appendChild(text);
  chat.appendChild(reply);
  scrollDown();

 }finally{
  searching=false;
  sendButton.disabled=false;
  input.focus();
 }
}

function quickAsk(text){
 input.value=text;
 sendMessage();
}

/* ---------------- INPUT ---------------- */

sendButton.addEventListener("click",sendMessage);

input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

input.addEventListener("input",function(){
 this.style.height="auto";
 this.style.height=Math.min(this.scrollHeight,130)+"px";
});

loadHistory();
</script>
