
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>VEX AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#000;color:#eee;
 font-family:Arial,Helvetica,sans-serif;
 height:100dvh;overflow:hidden
}
button,textarea{font:inherit}
button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}
.topbar{
 height:58px;flex-shrink:0;border-bottom:1px solid #202020;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 18px;background:#000
}
.brand{font-size:19px;font-weight:700;letter-spacing:1px}
.brand span{color:#777;font-size:11px;margin-left:7px}
.top-actions{display:flex;gap:8px}
.icon-btn{
 background:#111;border:1px solid #292929;color:#ddd;
 border-radius:9px;padding:8px 12px
}
.workspace{flex:1;min-height:0;display:flex}
.chat-area{
 flex:1;min-width:0;display:flex;flex-direction:column;
 align-items:center;position:relative
}
.messages{
 width:100%;max-width:850px;flex:1;overflow-y:auto;
 padding:30px 22px 25px
}
.welcome{margin:13vh auto 30px;text-align:center}
.welcome h1{font-size:30px;font-weight:500;margin-bottom:10px}
.welcome p{color:#777;font-size:14px}
.message{margin:0 0 27px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.user-message{
 margin-left:auto;max-width:85%;width:fit-content;
 background:#171717;border:1px solid #292929;
 padding:12px 16px;border-radius:18px;color:#eee
}
.assistant-message{max-width:100%;color:#ddd}
.assistant-label{font-size:12px;color:#777;margin-bottom:8px}
.message-content{font-size:15px}
.message-content p{margin:8px 0}
.message-content pre{
 background:#101010;border:1px solid #292929;
 padding:14px;border-radius:10px;overflow:auto
}
.message-content code{font-family:Consolas,monospace}
.composer-wrap{
 width:100%;max-width:850px;padding:12px 18px 20px
}
.composer{
 border:1px solid #343434;background:#101010;
 border-radius:18px;padding:12px 13px
}
#prompt{
 width:100%;resize:none;min-height:48px;max-height:160px;
 background:transparent;border:0;outline:0;color:#fff;
 font-size:15px;line-height:1.5
}
#prompt::placeholder{color:#777}
.composer-bottom{display:flex;align-items:center;justify-content:space-between}
.hint{font-size:11px;color:#666}
.send-btn{
 border:0;background:#eee;color:#000;border-radius:10px;
 width:38px;height:36px;font-size:19px;font-weight:bold
}
.send-btn:disabled{opacity:.35}
.artifact{
 width:50%;min-width:350px;max-width:780px;
 border-left:1px solid #292929;background:#080808;
 display:none;flex-direction:column
}
.artifact.open{display:flex}
.artifact-head{
 height:54px;display:flex;align-items:center;
 justify-content:space-between;padding:0 14px;
 border-bottom:1px solid #252525
}
.artifact-title{font-size:14px;font-weight:600}
.artifact-controls{display:flex;gap:6px;align-items:center}
.small-btn{
 background:#151515;border:1px solid #333;color:#ddd;
 border-radius:8px;padding:7px 10px;font-size:12px
}
.small-btn.primary{background:#eee;color:#000;border-color:#eee}
.tabs{
 display:flex;gap:18px;padding:0 16px;
 border-bottom:1px solid #252525;height:43px;align-items:center
}
.tab{
 height:100%;display:flex;align-items:center;
 color:#888;font-size:13px;border-bottom:2px solid transparent;
 cursor:pointer
}
.tab.active{color:#fff;border-color:#fff}
.artifact-body{flex:1;min-height:0;position:relative}
#codeView,#previewView{height:100%;width:100%}
#codeView{display:flex;flex-direction:column}
.code-toolbar{
 padding:8px 12px;background:#0d0d0d;border-bottom:1px solid #222;
 color:#888;font-size:12px;display:flex;justify-content:space-between
}
#codeEditor{
 flex:1;width:100%;resize:none;border:0;outline:0;
 background:#080808;color:#d6e6d6;padding:17px;
 font:13px/1.65 Consolas,Monaco,monospace;
 tab-size:2;white-space:pre;overflow:auto
}
#previewView{display:none;background:#fff}
#previewFrame{width:100%;height:100%;border:0;background:#fff}
.empty-preview{
 height:100%;display:flex;align-items:center;justify-content:center;
 color:#777;background:#101010;font-size:14px
}
.status{
 padding:8px 13px;border-top:1px solid #222;
 color:#777;font-size:11px;display:flex;justify-content:space-between
}
.typing{color:#888;font-size:13px;margin:10px 0}
@media(max-width:760px){
 .workspace{position:relative}
 .chat-area{width:100%}
 .artifact{
  position:absolute;inset:0;width:100%;max-width:none;
  min-width:0;z-index:5;border-left:0
 }
 .artifact.open{display:flex}
 .messages{padding:22px 16px}
 .composer-wrap{padding:10px 12px 15px}
 .welcome h1{font-size:25px}
}
</style>
</head>

<body>
<div class="app">
 <header class="topbar">
  <div class="brand">VEX AI <span>ARTIFACTS</span></div>
  <div class="top-actions">
   <button class="icon-btn" id="newChat">＋ New chat</button>
  </div>
 </header>

 <main class="workspace">
  <section class="chat-area">
   <div class="messages" id="messages">
    <div class="welcome" id="welcome">
     <h1>What are we building?</h1>
     <p>Ask VEX to create a website, app design, or code.</p>
    </div>
   </div>

   <div class="composer-wrap">
    <div class="composer">
     <textarea id="prompt" rows="2"
      placeholder="Ask VEX anything or describe what you want to build..."></textarea>
     <div class="composer-bottom">
      <span class="hint">Enter to send · Shift + Enter for new line</span>
      <button class="send-btn" id="send" aria-label="Send">↑</button>
     </div>
    </div>
   </div>
  </section>

  <aside class="artifact" id="artifact">
   <div class="artifact-head">
    <div class="artifact-title" id="artifactTitle">Artifact</div>
    <div class="artifact-controls">
     <button class="small-btn" id="closeArtifact">Close</button>
     <button class="small-btn" id="copyCode">Copy</button>
     <button class="small-btn" id="downloadCode">Download</button>
     <button class="small-btn primary" id="runCode">▶ Run</button>
    </div>
   </div>

   <div class="tabs">
    <div class="tab active" data-tab="code">Code</div>
    <div class="tab" data-tab="preview">Preview</div>
   </div>

   <div class="artifact-body">
    <div id="codeView">
     <div class="code-toolbar">
      <span id="fileName">index.html</span>
      <span>Editable code</span>
     </div>
     <textarea id="codeEditor" spellcheck="false"
      aria-label="Artifact code"></textarea>
    </div>

    <div id="previewView">
     <div class="empty-preview" id="previewEmpty">
      Press Run to preview your artifact.
     </div>
     <iframe id="previewFrame"
      title="Artifact preview"
      sandbox="allow-scripts allow-forms"
      style="display:none"></iframe>
    </div>
   </div>

   <div class="status">
    <span id="artifactStatus">Ready</span>
    <span>VEX Artifact</span>
   </div>
  </aside>
 </main>
</div>

<script>
const messages = document.getElementById("messages");
const promptBox = document.getElementById("prompt");
const sendBtn = document.getElementById("send");
const welcome = document.getElementById("welcome");
const artifact = document.getElementById("artifact");
const codeEditor = document.getElementById("codeEditor");
const previewFrame = document.getElementById("previewFrame");
const previewEmpty = document.getElementById("previewEmpty");

let requestCounter = 0;
let activeRequest = null;
let currentFileName = "index.html";

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g, char => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[char]));
}

function addMessage(text, role){
 if(welcome) welcome.style.display="none";

 const wrapper=document.createElement("div");
 wrapper.className="message "+(role==="user"?"user-message":"assistant-message");

 if(role!=="user"){
  const label=document.createElement("div");
  label.className="assistant-label";
  label.textContent="VEX AI";
  wrapper.appendChild(label);
 }

 const content=document.createElement("div");
 content.className="message-content";
 content.textContent=text;
 wrapper.appendChild(content);
 messages.appendChild(wrapper);
 messages.scrollTop=messages.scrollHeight;
 return content;
}

function setTyping(show){
 const old=document.getElementById("typing");
 if(old) old.remove();
 if(show){
  const el=document.createElement("div");
  el.id="typing";
  el.className="typing";
  el.textContent="VEX is working...";
  messages.appendChild(el);
  messages.scrollTop=messages.scrollHeight;
 }
}

function showArtifact(code, language){
 codeEditor.value=code;
 artifact.classList.add("open");

 const ext={
  html:"html",htm:"html",css:"css",javascript:"js",
  js:"js",python:"py",py:"py",json:"json",
  jsx:"jsx",typescript:"ts",ts:"ts",java:"java",
  cpp:"cpp",c:"c"
 };

 const extension=ext[(language||"html").toLowerCase()]||"txt";
 currentFileName="index."+extension;
 document.getElementById("fileName").textContent=currentFileName;
 document.getElementById("artifactTitle").textContent="Artifact";
 document.getElementById("artifactStatus").textContent="Code ready";
 selectTab("code");
}

function extractArtifact(text){
 const match=text.match(/```([a-zA-Z0-9_-]*)\s*\n([\s\S]*?)```/);
 if(!match) return null;

 const language=(match[1]||"html").toLowerCase();
 const code=match[2].trim();

 const supported=[
  "html","htm","css","javascript","js",
  "jsx","typescript","ts","python","py",
  "json","java","cpp","c"
 ];

 if(!supported.includes(language)) return null;
 return {language,code};
}

function selectTab(tab){
 document.querySelectorAll(".tab").forEach(el=>{
  el.classList.toggle("active",el.dataset.tab===tab);
 });
 document.getElementById("codeView").style.display=
  tab==="code"?"flex":"none";
 document.getElementById("previewView").style.display=
  tab==="preview"?"block":"none";
}

document.querySelectorAll(".tab").forEach(el=>{
 el.addEventListener("click",()=>selectTab(el.dataset.tab));
});

function makePreviewDocument(){
 const code=codeEditor.value;
 const ext=currentFileName.split(".").pop().toLowerCase();

 if(ext==="html"||ext==="htm"){
  return code;
 }
 if(ext==="css"){
  return "<!DOCTYPE html><html><head><style>"+code+
   "</style></head><body><h2>CSS Preview</h2></body></html>";
 }
 if(ext==="js"){
  return "<!DOCTYPE html><html><body><h2>JavaScript Preview</h2><pre id='out'></pre><script>"+
   code.replace(/<\/script/gi,"<\\/script")+
   "<\/script></body></html>";
 }

 return null;
}

document.getElementById("runCode").addEventListener("click",()=>{
 const doc=makePreviewDocument();

 if(!doc){
  document.getElementById("artifactStatus").textContent=
   "Live preview supports HTML, CSS and JavaScript.";
  return;
 }

 previewFrame.srcdoc=doc;
 previewFrame.style.display="block";
 previewEmpty.style.display="none";
 selectTab("preview");
 document.getElementById("artifactStatus").textContent="Preview running";
});

document.getElementById("copyCode").addEventListener("click",async()=>{
 try{
  await navigator.clipboard.writeText(codeEditor.value);
  document.getElementById("artifactStatus").textContent="Copied";
 }catch(e){
  codeEditor.select();
  document.execCommand("copy");
  document.getElementById("artifactStatus").textContent="Copied";
 }
});

document.getElementById("downloadCode").addEventListener("click",()=>{
 const blob=new Blob([codeEditor.value],{type:"text/plain;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download=currentFileName;
 a.click();
 URL.revokeObjectURL(url);
});

document.getElementById("closeArtifact").addEventListener("click",()=>{
 artifact.classList.remove("open");
});

function sendRequest(){
 const query=promptBox.value.trim();
 if(!query||activeRequest) return;

 promptBox.value="";
 promptBox.style.height="auto";
 addMessage(query,"user");

 const id="vex_"+Date.now()+"_"+(++requestCounter);
 activeRequest=id;
 sendBtn.disabled=true;
 setTyping(true);

 const request={
  id:id,
  query:query,
  mode:"chat"
 };

 if(window.VEX_NATIVE && typeof window.VEX_NATIVE.search==="function"){
  window.VEX_NATIVE.search(request);
 }else{
  console.log("VEX_NATIVE_SEARCH:"+JSON.stringify(request));
 }
}

sendBtn.addEventListener("click",sendRequest);

promptBox.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendRequest();
 }
});

promptBox.addEventListener("input",()=>{
 promptBox.style.height="auto";
 promptBox.style.height=Math.min(promptBox.scrollHeight,160)+"px";
});

document.getElementById("newChat").addEventListener("click",()=>{
 messages.innerHTML="";
 if(welcome){
  welcome.style.display="block";
  messages.appendChild(welcome);
 }
 artifact.classList.remove("open");
 activeRequest=null;
 setTyping(false);
 sendBtn.disabled=false;
});

window.addEventListener("vex-native-progress",e=>{
 const data=e.detail||{};
 if(data.id!==activeRequest) return;
 const typing=document.getElementById("typing");
 if(typing) typing.textContent=data.stage||"VEX is working...";
});

window.addEventListener("vex-native-result",e=>{
 const payload=e.detail||{};
 if(payload.id!==activeRequest) return;

 activeRequest=null;
 sendBtn.disabled=false;
 setTyping(false);

 if(payload.error){
  addMessage("Error: "+payload.error,"assistant");
  return;
 }

 const data=payload.data||{};
 const answer=String(data.answer||"");

 const artifactData=extractArtifact(answer);

 if(artifactData){
  const cleanAnswer=answer.replace(
   /```[a-zA-Z0-9_-]*\s*\n[\s\S]*?```/,
   "I've created an artifact for you."
  ).trim();

  addMessage(cleanAnswer||"I've created an artifact for you.", "assistant");
  showArtifact(artifactData.code,artifactData.language);
 }else{
  addMessage(answer||"I couldn't generate a response.","assistant");
 }

 messages.scrollTop=messages.scrollHeight;
});

</script>
</body>
</html>
