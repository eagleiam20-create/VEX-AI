
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>VEX AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:#f5f5f5;
 font-family:"Segoe UI",Arial,sans-serif;
 height:100dvh;overflow:hidden
}
.app{
 height:100dvh;max-width:950px;margin:auto;
 display:flex;flex-direction:column
}
header{
 height:65px;min-height:65px;
 display:flex;align-items:center;
 padding:0 18px;border-bottom:1px solid #252525
}
.logo{
 font-size:23px;font-weight:900;
 letter-spacing:3px
}
.status{margin-left:auto;color:#888;font-size:11px}
#chat{
 flex:1;overflow-y:auto;
 padding:24px 18px 35px;scroll-behavior:smooth
}
.welcome{text-align:center;margin:18vh auto 30px}
.welcome h1{font-size:38px;letter-spacing:5px;margin:0 0 12px}
.welcome p{color:#888;font-size:14px}
.message{
 max-width:90%;padding:13px 17px;
 margin:17px 0;border-radius:17px;
 line-height:1.7;font-size:15px;
 overflow-wrap:anywhere
}
.user{
 background:#222;margin-left:auto;
 border-bottom-right-radius:5px;
 white-space:pre-wrap
}
.bot{margin-right:auto;padding-left:3px}
.sources{margin-top:15px;display:flex;flex-direction:column;gap:9px}
.source{
 display:block;background:#151515;
 border:1px solid #292929;border-radius:11px;
 padding:11px;color:#ddd;text-decoration:none;
 font-size:13px
}
.source:hover{background:#222}
.source small{display:block;color:#888;margin-top:5px}
.images{display:flex;gap:10px;overflow-x:auto;margin-top:14px}
.images img{width:145px;height:120px;object-fit:cover;border-radius:12px}
.label{font-size:11px;color:#999;letter-spacing:1px;margin:16px 0 8px}
.composer{
 padding:12px 14px 20px;
 border-top:1px solid #222;background:#080808
}
.inputbox{
 display:flex;align-items:center;
 background:#171717;border:1px solid #333;
 border-radius:22px;padding:7px 8px 7px 16px;gap:10px
}
textarea{
 flex:1;background:transparent;color:white;
 border:none;outline:none;resize:none;
 font-family:inherit;font-size:15px;
 min-height:28px;max-height:120px;padding-top:6px
}
textarea::placeholder{color:#777}
.send{
 width:40px;height:40px;border-radius:50%;
 background:white;color:black;font-size:22px;font-weight:bold
}
.send:disabled{opacity:.5}
.footer{text-align:center;color:#555;font-size:10px;padding-top:10px}
.typing{color:#888;font-size:13px}
@media(max-width:600px){
 .message{max-width:96%}
 .welcome h1{font-size:31px}
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="logo">VEX AI</div>
 <div class="status">● WEB SEARCH</div>
</header>

<main id="chat">
 <div class="welcome" id="welcome">
  <h1>HELLO.</h1>
  <p>What would you like to explore today?</p>
 </div>
</main>

<div class="composer">
 <div class="inputbox">
  <textarea id="question" placeholder="Ask VEX anything..." rows="1"></textarea>
  <button class="send" id="send">↑</button>
 </div>
 <div class="footer">VEX AI · Independent AI Assistant</div>
</div>

</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("question");
const sendButton=document.getElementById("send");

function addMessage(text,type){
 document.getElementById("welcome")?.remove();

 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;

 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}

function addSource(container,title,url,snippet){
 if(!url || !/^https?:\/\//i.test(url))return;

 const a=document.createElement("a");
 a.className="source";
 a.href=url;
 a.target="_blank";
 a.rel="noopener noreferrer";

 const strong=document.createElement("strong");
 strong.textContent=title || "Web result";

 const small=document.createElement("small");
 small.textContent=snippet || "";

 a.append(strong,small);
 container.appendChild(a);
}

async function searchWeb(query){
 const params=new URLSearchParams({
  q:query,
  format:"json",
  no_html:"1",
  skip_disambig:"1"
 });

 const response=await fetch(
  "https://api.duckduckgo.com/?"+params.toString(),
  {method:"GET"}
 );

 if(!response.ok){
  throw new Error("Search failed: HTTP "+response.status);
 }

 return await response.json();
}

function collectResults(data){
 const results=[];

 function add(item){
  if(item.FirstURL){
   results.push({
    title:item.Text || "Web result",
    url:item.FirstURL,
    snippet:item.Text || ""
   });
  }
 }

 (data.RelatedTopics || []).forEach(item=>{
  if(item.Topics){
   item.Topics.forEach(add);
  }else{
   add(item);
  }
 });

 return results;
}

function showImages(container,data){
 const urls=[];

 if(data.Image)urls.push(data.Image);

 if(!urls.length)return;

 const heading=document.createElement("div");
 heading.className="label";
 heading.textContent="RELATED IMAGES";
 container.appendChild(heading);

 const gallery=document.createElement("div");
 gallery.className="images";

 urls.forEach(url=>{
  const img=document.createElement("img");
  img.src=url;
  img.alt="Related image";
  img.loading="lazy";
  img.onerror=()=>img.remove();
  gallery.appendChild(img);
 });

 container.appendChild(gallery);
}

async function sendMessage(){
 const query=input.value.trim();
 if(!query)return;

 addMessage(query,"user");

 input.value="";
 input.style.height="28px";
 sendButton.disabled=true;

 const reply=addMessage("VEX is searching...","bot typing");

 try{
  const data=await searchWeb(query);

  reply.classList.remove("typing");
  reply.textContent="";

  const label=document.createElement("div");
  label.className="label";
  label.textContent="VEX AI";
  reply.appendChild(label);

  const answer=document.createElement("div");
  answer.style.whiteSpace="pre-wrap";

  const abstract=
   data.AbstractText ||
   data.Answer ||
   data.Definition ||
   "";

  answer.textContent=abstract ||
   "I couldn't find a direct answer. Here are the related search results.";

  reply.appendChild(answer);

  if(data.AbstractURL){
   const heading=document.createElement("div");
   heading.className="label";
   heading.textContent="MAIN SOURCE";
   reply.appendChild(heading);

   const sourceBox=document.createElement("div");
   sourceBox.className="sources";

   addSource(
    sourceBox,
    data.Heading || "Read more",
    data.AbstractURL,
    abstract
   );

   reply.appendChild(sourceBox);
  }

  const results=collectResults(data);

  if(results.length){
   const heading=document.createElement("div");
   heading.className="label";
   heading.textContent="RELATED WEB RESULTS";
   reply.appendChild(heading);

   const sourceBox=document.createElement("div");
   sourceBox.className="sources";

   results.slice(0,10).forEach(item=>{
    addSource(sourceBox,item.title,item.url,item.snippet);
   });

   reply.appendChild(sourceBox);
  }

  showImages(reply,data);

  if(!abstract && !results.length){
   answer.textContent=
    "No instant answer was returned by DuckDuckGo. Try another search query.";
  }

 }catch(error){
  reply.classList.remove("typing");
  reply.textContent=
   "Search connection failed: "+error.message+
   "\n\nDuckDuckGo may be unavailable or may block this browser request.";
 }

 sendButton.disabled=false;
 chat.scrollTop=chat.scrollHeight;
 input.focus();
}

sendButton.addEventListener("click",sendMessage);

input.addEventListener("keydown",event=>{
 if(event.key==="Enter" && !event.shiftKey){
  event.preventDefault();
  sendMessage();
 }
});

input.addEventListener("input",function(){
 this.style.height="auto";
 this.style.height=Math.min(this.scrollHeight,120)+"px";
});
</script>

</body>
</html>
