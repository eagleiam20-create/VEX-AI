<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>VEX AI</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,system-ui,sans-serif}
body{overflow:hidden}
button,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;background:#000}
.sidebar{width:260px;flex-shrink:0;border-right:1px solid #222;padding:15px;display:flex;flex-direction:column;background:#000;z-index:5}
.side-top{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 22px}
.brand{font-size:22px;font-weight:900;letter-spacing:3px}
.icon-btn{background:none;border:0;color:#fff;padding:9px;border-radius:9px;font-size:19px}
.icon-btn:hover,.history-item:hover{background:#181818}
.new-chat{background:#000;border:1px solid #333;color:#fff;padding:13px;border-radius:12px;text-align:left}
.new-chat:hover{border-color:#fff}
.history-title{font-size:10px;letter-spacing:2px;color:#888;margin:25px 8px 10px}
.history{overflow:auto;flex:1}
.history-item{font-size:13px;padding:11px;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#ddd}
.profile{border-top:1px solid #222;padding:15px 6px 5px}
.profile-name{font-weight:bold;font-size:13px}
.profile-info{font-size:11px;color:#888;line-height:1.8;margin-top:6px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;height:100dvh;background:#000}
.topbar{height:58px;flex-shrink:0;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #191919}
.mobile-brand{display:none;font-weight:900;letter-spacing:2px;margin-right:12px}
.model-label{font-size:14px;font-weight:600}
.model-label span{font-size:11px;color:#777;margin-left:8px}
#chat{flex:1;overflow-y:auto;padding:25px 20px 160px;scroll-behavior:smooth}
.welcome{max-width:700px;margin:18vh auto 30px;text-align:center}
.welcome h1{font-size:37px;margin:0 0 14px}
.welcome p{color:#888;font-size:14px}
.suggestions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.suggestions button{border:1px solid #292929;border-radius:22px;padding:12px 16px;background:#000;color:#ddd;font-size:12px}
.suggestions button:hover{background:#fff;color:#000}
.message{max-width:820px;width:100%;margin:0 auto 26px;line-height:1.75;font-size:15px;overflow-wrap:anywhere}
.user-wrap{display:flex;justify-content:flex-end}
.user{background:#fff;color:#000;padding:12px 17px;border-radius:20px;max-width:85%;white-space:pre-wrap}
.bot{padding:6px 0}
.answer{white-space:pre-wrap;line-height:1.85}
.label{font-size:10px;color:#888;letter-spacing:2px;font-weight:bold;margin:20px 0 10px}
.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.source{display:block;background:#050505;border:1px solid #292929;padding:13px;border-radius:12px;text-decoration:none;color:#fff}
.source:hover{border-color:#fff}
.source strong{font-size:13px;display:block}
.source small{display:block;color:#999;font-size:11px;margin-top:6px;line-height:1.5}
.tag{font-size:9px;color:#888;letter-spacing:1px;display:block;margin-bottom:7px}
.images{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px}
.image-card{background:#080808;border:1px solid #292929;border-radius:11px;overflow:hidden;min-width:0}
.image-card button{border:0;background:none;padding:0;width:100%;color:#fff;text-align:left}
.image-frame{width:100%;height:145px;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
.image-frame img{width:100%;height:100%;object-fit:cover;display:block}
.image-fallback{font-size:11px;color:#aaa;text-align:center;padding:10px}
.image-caption{font-size:11px;padding:9px;line-height:1.4;color:#ddd}
.image-source{display:block;padding:0 9px 9px;font-size:10px;color:#999;text-decoration:underline}
.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.video-card{border:1px solid #292929;border-radius:12px;overflow:hidden;background:#080808}
.video-card button{border:0;background:none;color:#fff;padding:0;width:100%;text-align:left}
.video-thumb{width:100%;aspect-ratio:16/9;background:#111;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.video-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play-overlay{position:absolute;background:#000b;border:1px solid #777;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:20px}
.video-card strong{font-size:12px;padding:10px;display:block;line-height:1.5}
.video-source{display:block;color:#aaa;font-size:11px;padding:0 10px 11px;text-decoration:underline}
.followups{display:flex;flex-wrap:wrap;gap:8px}
.followups button{background:#050505;border:1px solid #333;border-radius:18px;color:#ddd;padding:9px 12px;font-size:11px}
.followups button:hover{border-color:#fff}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{background:none;border:1px solid #333;color:#aaa;border-radius:9px;padding:7px 11px;font-size:12px}
.progress{color:#aaa;font-size:13px}
.progress:before{content:"";display:inline-block;width:7px;height:7px;background:white;border-radius:50%;margin-right:9px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.2}}
.composer-area{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000 22%);padding:30px 20px 16px}
.composer{max-width:820px;margin:auto;border:1px solid #454545;border-radius:25px;background:#000;padding:10px 12px;display:flex;align-items:flex-end;gap:10px}
.composer:focus-within{border-color:#aaa}
textarea{background:none;color:white;border:0;outline:0;resize:none;flex:1;min-height:30px;max-height:130px;padding:7px 3px;font-size:15px}
textarea::placeholder{color:#777}
.send{width:39px;height:39px;border:0;border-radius:50%;background:#fff;color:#000;font-size:23px;font-weight:bold}
.send:disabled{opacity:.4}
.bottom-note{text-align:center;color:#666;font-size:10px;margin-top:10px}
.media-viewer{display:none;position:fixed;inset:0;background:#000f;z-index:100;align-items:center;justify-content:center;padding:22px}
.media-viewer.open{display:flex}
.viewer-inner{width:min(100%,1000px);display:flex;flex-direction:column;align-items:center;gap:12px}
.viewer-inner img{max-width:100%;max-height:78vh;object-fit:contain}
.viewer-inner iframe,.viewer-inner video{width:min(100%,900px);aspect-ratio:16/9;background:#111;border:0}
.viewer-inner video{max-height:78vh}
.viewer-close{position:absolute;top:15px;right:18px;width:42px;height:42px;border-radius:50%;background:#111;border:1px solid #555;color:white;font-size:24px}
.viewer-caption{font-size:12px;color:#ddd;text-align:center}
.viewer-source{color:#aaa;font-size:12px;text-decoration:underline}
.hidden{display:none!important}
#chat::-webkit-scrollbar,.history::-webkit-scrollbar{width:5px}
#chat::-webkit-scrollbar-thumb,.history::-webkit-scrollbar-thumb{background:#333;border-radius:9px}
@media(max-width:700px){
.sidebar{position:fixed;top:0;bottom:0;left:-270px;transition:left .2s;width:260px}
.sidebar.open{left:0}
.mobile-brand{display:block}
.topbar{padding:0 10px}
#chat{padding:20px 14px 150px}
.composer-area{padding:22px 11px 12px}
.welcome h1{font-size:29px}
.welcome{margin-top:18vh}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="side-top">
  <div class="brand">VEX AI</div>
  <button class="icon-btn" onclick="toggleSidebar()">×</button>
 </div>
 <button class="new-chat" onclick="newChat()">＋ &nbsp; New chat</button>
 <div class="history-title">YOUR CHATS</div>
 <div class="history" id="history"></div>
 <div class="profile">
  <div class="profile-name">VEX AI</div>
  <div class="profile-info">Owner &amp; Creator: Avee Sharma<br>Independent AI project<br>Public web knowledge</div>
 </div>
</aside>
<main class="main">
 <div class="topbar">
  <button class="icon-btn" onclick="toggleSidebar()">☰</button>
  <div class="mobile-brand">VEX AI</div>
  <div class="model-label">VEX AI <span>Knowledge Assistant</span></div>
 </div>
 <section id="chat">
  <div class="welcome" id="welcome">
   <h1>What can I help with?</h1>
   <p>Explore knowledge. Discover ideas. Ask VEX anything.</p>
   <div class="suggestions">
    <button onclick="quickAsk('Explain artificial intelligence')">Explain AI</button>
    <button onclick="quickAsk('Latest space discoveries')">Space</button>
    <button onclick="quickAsk('How does the internet work?')">Technology</button>
    <button onclick="quickAsk('Explain quantum computing')">Science</button>
   </div>
  </div>
 </section>
 <div class="composer-area">
  <div class="composer">
   <textarea id="question" rows="1" placeholder="Message VEX AI..."></textarea>
   <button class="send" id="send">↑</button>
  </div>
  <div class="bottom-note">VEX AI · Built by Avee Sharma</div>
 </div>
</main>
</div>

<div class="media-viewer" id="mediaViewer" onclick="if(event.target===this)closeViewer()">
 <button class="viewer-close" onclick="closeViewer()">×</button>
 <div class="viewer-inner" id="viewerInner"></div>
</div>

<script>
'use strict';
const API='https://puri.li';
const PROXY='https://proxy.cors.dev/';
const chat=document.getElementById('chat');
const input=document.getElementById('question');
const sendButton=document.getElementById('send');
const historyBox=document.getElementById('history');
let conversations=[],activeId=null,searching=false;

const WELCOME=`<div class="welcome" id="welcome"><h1>What can I help with?</h1><p>Explore knowledge. Discover ideas. Ask VEX anything.</p><div class="suggestions"><button onclick="quickAsk('Explain artificial intelligence')">Explain AI</button><button onclick="quickAsk('Latest space discoveries')">Space</button><button onclick="quickAsk('How does the internet work?')">Technology</button><button onclick="quickAsk('Explain quantum computing')">Science</button></div></div>`;

function scrollDown(){chat.scrollTop=chat.scrollHeight}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function saveHistory(){try{localStorage.setItem('vex_chats',JSON.stringify(conversations))}catch(e){}}
function loadHistory(){try{conversations=JSON.parse(localStorage.getItem('vex_chats')||'[]')}catch(e){conversations=[]}renderHistory()}
function renderHistory(){
 historyBox.textContent='';
 conversations.forEach(c=>{
  const el=document.createElement('div');
  el.className='history-item';
  el.textContent=c.title||'New chat';
  el.onclick=()=>openChat(c.id);
  historyBox.appendChild(el);
 });
}
function newChat(){activeId=null;chat.innerHTML=WELCOME;input.value='';document.getElementById('sidebar').classList.remove('open');input.focus()}
function openChat(id){
 const c=conversations.find(x=>x.id===id);if(!c)return;
 activeId=id;chat.innerHTML='';
 (c.messages||[]).forEach(m=>{if(m.type==='user')addUser(m.text,false);else if(m.type==='bot')renderBot(m.data,false)});
 document.getElementById('sidebar').classList.remove('open');scrollDown();
}
function storeMessage(m){
 if(!activeId){activeId=String(Date.now());conversations.unshift({id:activeId,title:m.type==='user'?m.text.slice(0,48):'New chat',messages:[]})}
 const c=conversations.find(x=>x.id===activeId);if(c)c.messages.push(m);
 saveHistory();renderHistory();
}
function addUser(text,save=true){
 document.getElementById('welcome')?.remove();
 const wrap=document.createElement('div');wrap.className='message user-wrap';
 const bubble=document.createElement('div');bubble.className='user';bubble.textContent=text;
 wrap.appendChild(bubble);chat.appendChild(wrap);
 if(save)storeMessage({type:'user',text});scrollDown();
}
function validURL(s){try{return ['https:','http:'].includes(new URL(s,API).protocol)}catch(e){return false}}
function absoluteURL(s){try{return new URL(s,API).href}catch(e){return ''}}
function safeText(x){return String(x||'')}
function addLabel(parent,s){const el=document.createElement('div');el.className='label';el.textContent=s;parent.appendChild(el)}
function addSource(parent,item){
 if(!validURL(item.url))return;
 const a=document.createElement('a');a.className='source';a.href=absoluteURL(item.url);a.target='_blank';a.rel='noopener noreferrer';
 const tag=document.createElement('span');tag.className='tag';tag.textContent=item.source||'WEB SOURCE';
 const title=document.createElement('strong');title.textContent=item.title||'Web result';
 const desc=document.createElement('small');desc.textContent=item.description||'';
 a.append(tag,title,desc);parent.appendChild(a);
}
function parseResponse(raw,status){
 let d;try{d=JSON.parse(raw)}catch(e){throw new Error('Search service returned invalid data')}
 if(status<200||status>=300)throw new Error(d.error||'HTTP '+status);
 return d;
}
async function fetchJSON(path,timeout=16000){
 const target=API+path;
 const urls=[PROXY+target,target];
 let errors=[];
 for(const url of urls){
  try{
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),timeout);
   try{
    const r=await fetch(url,{signal:controller.signal,cache:'no-store',mode:'cors'});
    const raw=await r.text();return parseResponse(raw,r.status);
   }finally{clearTimeout(timer)}
  }catch(e){errors.push(e.message||'Network error')}
 }
 throw new Error(errors.join(' / '));
}
async function fetchRetry(path){
 let err;
 for(let i=0;i<2;i++){try{return await fetchJSON(path)}catch(e){err=e;await new Promise(r=>setTimeout(r,600))}}
 throw err;
}

function getWords(q){
 return q.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w=>w.length>2&&!['what','when','where','which','who','with','from','that','this','have','does','about','into','your','the','and','for','are','was','will','how','why','tell','explain','please'].includes(w));
}
function extractRelevant(text,q,max=3500){
 if(!text)return '';
 const words=getWords(q);
 const chunks=String(text).replace(/\r/g,'').split(/\n+|(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>45);
 const ranked=chunks.map((s,i)=>({s,i,score:words.reduce((n,w)=>n+(s.toLowerCase().includes(w)?2:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.i-b.i);
 let out=[],size=0,seen=new Set();
 for(const x of ranked){
  const k=x.s.toLowerCase().slice(0,100);if(seen.has(k))continue;seen.add(k);
  if(size+x.s.length>max)continue;
  out.push(x.s);size+=x.s.length;if(out.length>=7)break;
 }
 return out.join('\n\n');
}
async function getContext(item){
 try{
  const d=await fetchJSON('/api/context?url='+encodeURIComponent(item.url),12000);
  return {title:d.title||item.title,text:[d.summary,d.content,Array.isArray(d.passages)?d.passages.join('\n'):''].filter(Boolean).join('\n'),structured:d.structured||{}};
 }catch(e){return {title:item.title,text:item.description||'',structured:{}}}
}
async function getInfocard(q){try{return await fetchJSON('/api/infocard?q='+encodeURIComponent(q),10000)}catch(e){return null}}

function answerFromSources(query,parts,card){
 let output=[];
 const instant=card?.instantAnswer?.answer;
 if(typeof instant==='string'&&instant.trim())output.push(instant.trim());
 const facts=Array.isArray(card?.facts)?card.facts.slice(0,5):[];
 if(facts.length)output.push('IMPORTANT FACTS\n'+facts.map(f=>'• '+f.label+': '+f.value).join('\n'));
 const texts=parts.map(p=>extractRelevant(p.text,query,1500)).filter(Boolean);
 if(texts.length)output.push('EXPLANATION\n'+texts.slice(0,4).join('\n\n'));
 if(!output.length)output=parts.map(p=>p.text).filter(Boolean).slice(0,4);
 if(!output.length)return 'I found some pages, but the indexed text did not contain enough information for a reliable explanation. Please open the sources below.';
 return output.join('\n\n')+'\n\nThis explanation is compiled from indexed web sources. Please check the source links for additional context.';
}
function makeFollowups(q){
 const t=q.trim();
 if(!t)return [];
 return ['How does '+t+' work?','What are the advantages and disadvantages of '+t+'?','What are the latest developments about '+t+'?'];
}

// IMAGE URL FIXES

function imageCandidates(item){
 const urls=[
  item.image,item.thumbUrl,item.url,item.imageUrl,item.thumbnail,
  item.thumbnailUrl,item.src,item.original,item.fullUrl
 ];
 return [...new Set(urls.filter(validURL).map(absoluteURL))];
}
function imageProxy(url){
 return PROXY+url;
}
function createImageCard(item){
 const card=document.createElement('div');card.className='image-card';
 const btn=document.createElement('button');btn.type='button';
 const frame=document.createElement('div');frame.className='image-frame';
 const img=document.createElement('img');
 const candidates=imageCandidates(item);
 let index=0;
 const fallback=document.createElement('div');fallback.className='image-fallback';fallback.textContent='Image unavailable';
 fallback.style.display='none';
 frame.append(img,fallback);
 img.loading='lazy';img.referrerPolicy='no-referrer';
 function tryNext(){
  if(index<candidates.length){
   const url=candidates[index++];
   img.style.display='block';
   img.src=url;
  }else if(index===candidates.length){
   index++;
   if(candidates[0]){
    img.src=imageProxy(candidates[0]);
    img.style.display='block';
   }else{
    img.style.display='none';fallback.style.display='block';
   }
  }else{
   img.style.display='none';fallback.style.display='block';
  }
 }
 img.onerror=tryNext;
 img.onclick=()=>{};
 btn.onclick=()=>{
  if(img.naturalWidth>0)openViewer('image',img.src,item.title,item.sourceUrl);
  else if(candidates.length)openViewer('image',candidates[0],item.title,item.sourceUrl);
 };
 const caption=document.createElement('div');caption.className='image-caption';caption.textContent=item.title||'Image';
 btn.append(frame,caption);card.appendChild(btn);
 if(item.license){
  const lic=document.createElement('div');lic.className='image-caption';lic.textContent='Licence: '+item.license;card.appendChild(lic);
 }
 if(item.sourceUrl){
  const a=document.createElement('a');a.className='image-source';a.href=item.sourceUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Image source ↗';card.appendChild(a);
 }
 if(candidates.length)tryNext();else{img.style.display='none';fallback.style.display='block'}
 return card;
}

async function searchImages(q){
 try{
  const d=await fetchRetry('/api/images?q='+encodeURIComponent(q)+'&page=1');
  const rows=Array.isArray(d.images)?d.images:[];
  return rows.slice(0,12).map(x=>({
   title:x.title||'Image',
   image:x.thumbUrl||x.url||x.imageUrl||x.thumbnail||'',
   thumbUrl:x.thumbUrl||'',
   url:x.url||'',
   imageUrl:x.imageUrl||'',
   thumbnail:x.thumbnail||'',
   license:x.license||'',
   source:x.source||'Image source',
   sourceUrl:x.sourceUrl||x.pageUrl||x.sourcePage||''
  }));
 }catch(e){console.warn('Image search:',e);return []}
}

// VIDEO THUMBNAILS + EMBEDS

function videoInfo(url){
 try{
  const u=new URL(url),host=u.hostname.toLowerCase(),path=u.pathname;
  if(host==='youtu.be'||host.includes('youtube.com')){
   const id=host==='youtu.be'?path.split('/').filter(Boolean)[0]:(u.searchParams.get('v')||path.match(/\/(?:shorts|embed|live)\/([^/?]+)/)?.[1]);
   if(id)return {kind:'youtube',id,embed:'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&rel=0',thumbs:['https://i.ytimg.com/vi/'+id+'/maxresdefault.jpg','https://i.ytimg.com/vi/'+id+'/hqdefault.jpg']};
  }
  if(host.includes('vimeo.com')){
   const id=path.split('/').filter(Boolean).pop();
   if(/^\d+$/.test(id||''))return {kind:'vimeo',id,embed:'https://player.vimeo.com/video/'+id+'?autoplay=1',thumbs:[]};
  }
  if(host.includes('dailymotion.com')||host==='dai.ly'){
   const id=path.match(/\/(?:video|embed)\/([a-zA-Z0-9]+)/)?.[1]||path.match(/^\/([a-zA-Z0-9]+)/)?.[1];
   if(id)return {kind:'dailymotion',id,embed:'https://www.dailymotion.com/embed/video/'+id+'?autoplay=1',thumbs:['https://www.dailymotion.com/thumbnail/video/'+id]};
  }
  if(/\.(mp4|webm|ogg)(\?|$)/i.test(url))return {kind:'file',id:url,embed:url,thumbs:[]};
  if(/\.m3u8(\?|$)/i.test(url))return {kind:'hls',id:url,embed:url,thumbs:[]};
  return {kind:'page',id:url,embed:url,thumbs:[]};
 }catch(e){return null}
}
function metadataThumb(obj){
 if(!obj||typeof obj!=='object')return '';
 const keys=['thumbnailUrl','thumbnail','image','poster','og:image','imageUrl','thumbUrl'];
 for(const k of keys){
  const v=obj[k];
  if(typeof v==='string'&&validURL(v))return v;
  if(Array.isArray(v)&&v.length){
   const x=typeof v[0]==='string'?v[0]:v[0]?.url;
   if(validURL(x))return x;
  }
  if(v&&typeof v==='object'&&validURL(v.url))return v.url;
 }
 for(const [k,v] of Object.entries(obj)){
  if(typeof v==='object'&&v){
   const found=metadataThumb(v);if(found)return found;
  }
 }
 return '';
}
function videoThumbnail(row,context,info){
 const meta=metadataThumb(context?.structured)||metadataThumb(row);
 return meta||info?.thumbs?.[1]||info?.thumbs?.[0]||'';
}
async function searchVideos(q){
 const terms=[q+' video',q+' watch',q+' tutorial video'];
 const groups=await Promise.all(terms.map(async term=>{
  try{const d=await fetchRetry('/api/search?q='+encodeURIComponent(term)+'&page=1&exact=0');return d.results||[]}catch(e){return []}
 }));
 const seen=new Set(),rows=[];
 for(const x of groups.flat()){
  if(!validURL(x.url)||seen.has(x.url))continue;
  seen.add(x.url);
  const info=videoInfo(x.url);
  const text=(x.title+' '+x.description+' '+x.url).toLowerCase();
  if(info&&(info.kind!=='page'||/video|watch|youtube|vimeo|dailymotion|stream|trailer/i.test(text)))rows.push({...x,info});
  if(rows.length>=12)break;
 }
 const contexts=await Promise.all(rows.map(getContext));
 return rows.map((r,i)=>{
  const c=contexts[i]||{};
  return {
   title:r.title||c.title||'Video',
   url:r.url,
   description:r.description||'',
   kind:r.info.kind,
   embedUrl:r.info.embed,
   thumbnail:videoThumbnail(r,c,r.info),
   thumbs:r.info.thumbs,
   source:(()=>{try{return new URL(r.url).hostname.replace(/^www\./,'')}catch(e){return 'Website'}})()
  };
 });
}
function openViewer(kind,url,title,source,embed,mediaType){
 const viewer=document.getElementById('mediaViewer'),inner=document.getElementById('viewerInner');
 inner.textContent='';
 if(kind==='image'){
  const img=document.createElement('img');img.src=url;img.alt=title||'Image';inner.appendChild(img);
 }else if(mediaType==='file'){
  const v=document.createElement('video');v.src=url;v.controls=true;v.autoplay=true;v.playsInline=true;inner.appendChild(v);
 }else if(mediaType==='hls'){
  const msg=document.createElement('div');msg.style.color='#ddd';msg.textContent='This HLS stream may not be supported by this browser. Try opening the original source.';inner.appendChild(msg);
 }else{
  const frame=document.createElement('iframe');frame.src=embed||url;frame.title=title||'Video';frame.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';inner.appendChild(frame);
 }
 const caption=document.createElement('div');caption.className='viewer-caption';caption.textContent=title||'';inner.appendChild(caption);
 if(source){
  const a=document.createElement('a');a.className='viewer-source';a.href=source;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open original website';inner.appendChild(a);
 }
 viewer.classList.add('open');document.body.style.overflow='hidden';
}
function closeViewer(){
 document.getElementById('mediaViewer').classList.remove('open');
 document.getElementById('viewerInner').textContent='';
 document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});

function isImageOnly(q){return /\b(images?|pictures?|photos?)\b/i.test(q)&&/\b(only|just|show|give|send|find|display)\b/i.test(q)&&!/\b(video|videos|explain|describe|what is|who is|how)\b/i.test(q)}
function isVideo(q){return /\b(video|videos|watch|clip|documentary|trailer)\b/i.test(q)}
function isVideoOnly(q){return isVideo(q)&&/\b(only|just|show|give|send|find|play)\b/i.test(q)&&!/\b(images?|pictures?|photos?|explain)\b/i.test(q)}
function mediaQuery(q){return q.replace(/\b(show|give|send|find|display|me|some|only|just|images?|pictures?|photos?|videos?|clips?|documentary|trailer|of|about)\b/gi,' ').replace(/\s+/g,' ').trim()||q}

async function runSearch(q,progress){
 progress.textContent='Searching the web...';
 const [sd,card]=await Promise.all([
  fetchRetry('/api/search?q='+encodeURIComponent(q)+'&page=1&exact=0'),
  getInfocard(q)
 ]);
 const results=Array.isArray(sd.results)?sd.results:[];
 if(!results.length)return {answer:card?.instantAnswer?.answer||'No matching pages were found in the web index.',results:[],images:[],followups:[]};
 progress.textContent='Reading web pages...';
 const chosen=results.slice(0,5),contexts=await Promise.all(chosen.map(getContext));
 const parts=contexts.map((c,i)=>({title:c.title||chosen[i].title,text:c.text||chosen[i].description||''}));
 const answer=answerFromSources(q,parts,card);
 progress.textContent='Finding related images...';
 const images=await searchImages(q);
 return {answer,results:results.slice(0,8).map(x=>({title:x.title,url:x.url,description:x.description||x.displayUrl||'',source:x.source||'WEB SOURCE'})),images,followups:makeFollowups(q)};
}

async function runImageSearch(q){return {mode:'images',images:await searchImages(mediaQuery(q))}}
async function runVideoSearch(q,progress){
 progress.textContent='Finding video pages and thumbnails...';
 const videos=await searchVideos(mediaQuery(q));
 return {mode:'videos',videos,note:videos.length?'Select a thumbnail to open the video inside VEX. Some websites may block embedded playback.':'No matching video pages found. Try a shorter search.'};
}

function renderImageGrid(parent,items){
 const grid=document.createElement('div');grid.className='images';
 items.forEach(item=>grid.appendChild(createImageCard(item)));
 parent.appendChild(grid);
}
function renderVideoGrid(parent,items){
 const grid=document.createElement('div');grid.className='videos';
 items.forEach(v=>{
  const card=document.createElement('div');card.className='video-card';
  const btn=document.createElement('button');btn.type='button';
  btn.onclick=()=>openViewer('video',v.url,v.title,v.url,v.embedUrl,v.kind);
  const thumb=document.createElement('div');thumb.className='video-thumb';
  const img=document.createElement('img');
  img.loading='lazy';img.referrerPolicy='no-referrer';
  img.alt=v.title;
  const candidates=[v.thumbnail,...(v.thumbs||[])].filter(Boolean);
  let i=0;
  function nextThumb(){
   if(i<candidates.length){img.src=candidates[i++];}
   else{img.remove();const t=document.createElement('div');t.className='image-fallback';t.textContent='Video thumbnail unavailable';thumb.appendChild(t)}
  }
  img.onerror=nextThumb;
  if(candidates.length){thumb.appendChild(img);nextThumb()}
  else{const t=document.createElement('div');t.className='image-fallback';t.textContent='Video';thumb.appendChild(t)}
  const play=document.createElement('div');play.className='play-overlay';play.textContent='▶';thumb.appendChild(play);
  const title=document.createElement('strong');title.textContent=v.title;
  btn.append(thumb,title);card.appendChild(btn);
  const a=document.createElement('a');a.className='video-source';a.href=v.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open original website ↗';card.appendChild(a);
  grid.appendChild(card);
 });
 parent.appendChild(grid);
}

function renderBot(data,save=true){
 const reply=document.createElement('div');reply.className='message bot';
 if(data.mode==='images'){
  if(data.images?.length){addLabel(reply,'IMAGES');renderImageGrid(reply,data.images)}
  else reply.textContent='No images found. Try another search.';
  chat.appendChild(reply);if(save)storeMessage({type:'bot',data});scrollDown();return;
 }
 if(data.mode==='videos'){
  if(data.videos?.length){addLabel(reply,'VIDEOS');renderVideoGrid(reply,data.videos)}
  const note=document.createElement('div');note.style.cssText='font-size:12px;color:#888;margin-top:12px';note.textContent=data.note||'';reply.appendChild(note);
  chat.appendChild(reply);if(save)storeMessage({type:'bot',data});scrollDown();return;
 }
 addLabel(reply,'VEX AI');
 const answer=document.createElement('div');answer.className='answer';answer.textContent=data.answer||'No information found.';reply.appendChild(answer);
 if(data.results?.length){
  addLabel(reply,'WEB SOURCES');
  const grid=document.createElement('div');grid.className='sources';data.results.forEach(x=>addSource(grid,x));reply.appendChild(grid);
 }
 if(data.images?.length){addLabel(reply,'RELATED IMAGES');renderImageGrid(reply,data.images)}
 if(data.videos?.length){addLabel(reply,'RELATED VIDEOS');renderVideoGrid(reply,data.videos)}
 if(data.followups?.length){
  addLabel(reply,'YOU MAY ALSO ASK');
  const follow=document.createElement('div');follow.className='followups';
  data.followups.forEach(q=>{const b=document.createElement('button');b.textContent=q;b.onclick=()=>quickAsk(q);follow.appendChild(b)});
  reply.appendChild(follow);
 }
 const actions=document.createElement('div');actions.className='actions';
 const copy=document.createElement('button');copy.textContent='Copy answer';
 copy.onclick=async()=>{try{await navigator.clipboard.writeText(data.answer||'');copy.textContent='Copied'}catch(e){copy.textContent='Copy unavailable'}};
 actions.appendChild(copy);reply.appendChild(actions);
 chat.appendChild(reply);if(save)storeMessage({type:'bot',data});scrollDown();
}

async function sendMessage(){
 const q=input.value.trim();if(!q||searching)return;
 searching=true;sendButton.disabled=true;addUser(q);
 input.value='';input.style.height='30px';
 const progress=document.createElement('div');progress.className='message bot progress';progress.textContent='Preparing search...';chat.appendChild(progress);scrollDown();
 try{
  let data;
  if(isImageOnly(q)){progress.textContent='Searching images...';data=await runImageSearch(q)}
  else if(isVideoOnly(q)){data=await runVideoSearch(q,progress)}
  else{
   data=await runSearch(q,progress);
   if(isVideo(q)){
    progress.textContent='Finding related videos...';
    data.videos=await searchVideos(mediaQuery(q));
   }
  }
  progress.remove();renderBot(data);
 }catch(e){
  progress.classList.remove('progress');
  progress.textContent='VEX search error: '+(e.message||'Connection failed')+'. Please try again.';
  const b=document.createElement('button');b.className='icon-btn';b.textContent='↻ Retry';b.onclick=()=>{progress.remove();input.value=q;sendMessage()};progress.appendChild(b);
 }finally{searching=false;sendButton.disabled=false;input.focus()}
}
function quickAsk(q){input.value=q;sendMessage()}
sendButton.addEventListener('click',sendMessage);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,130)+'px'});
loadHistory();
</script>
