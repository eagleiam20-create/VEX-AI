
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>VEX AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:#f5f5f5;
 font-family:Inter,"Segoe UI",Arial,sans-serif;
 height:100dvh;overflow:hidden
}
.app{
 height:100dvh;max-width:1000px;margin:auto;
 display:flex;flex-direction:column
}
header{
 height:66px;min-height:66px;
 display:flex;align-items:center;padding:0 20px;
 border-bottom:1px solid #252525;background:#090909
}
.logo{font-size:23px;font-weight:900;letter-spacing:3px}
.logo span{color:#888}
.status{margin-left:auto;color:#888;font-size:11px}
.status i{color:#62d99b;font-style:normal}
#chat{
 flex:1;overflow-y:auto;padding:25px 18px 40px;
 scroll-behavior:smooth
}
.welcome{text-align:center;margin:17vh auto 30px}
.welcome h1{font-size:42px;letter-spacing:7px;margin:0 0 12px}
.welcome p{color:#888;font-size:14px}
.suggestions{
 display:flex;flex-wrap:wrap;justify-content:center;
 gap:9px;margin-top:25px
}
.suggestions button{
 background:#151515;color:#ccc;border:1px solid #303030;
 padding:10px 14px;border-radius:20px;cursor:pointer
}
.message{
 max-width:94%;margin:18px 0;
 line-height:1.7;font-size:15px;overflow-wrap:anywhere
}
.user{
 background:#202020;margin-left:auto;
 padding:13px 17px;border-radius:18px 18px 5px 18px;
 white-space:pre-wrap;width:fit-content
}
.bot{margin-right:auto;padding:5px 2px;width:100%}
.label{
 font-size:10px;color:#999;letter-spacing:1.7px;
 margin:17px 0 9px;font-weight:700
}
.answer{white-space:pre-wrap;line-height:1.85}
.sources{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
 gap:10px;margin-top:8px
}
.source{
 display:block;background:#121212;border:1px solid #292929;
 border-radius:13px;padding:13px;color:#eee;
 text-decoration:none;transition:.2s;min-width:0
}
.source:hover{background:#1d1d1d;border-color:#555}
.source strong{font-size:13px;display:block}
.source small{
 display:block;color:#888;margin-top:6px;
 font-size:12px;line-height:1.5
}
.tag{
 display:inline-block;color:#aaa;font-size:9px;
 border:1px solid #383838;padding:3px 7px;
 border-radius:10px;margin-bottom:8px
}
.images{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
 gap:10px;margin-top:10px
}
.images a{color:#ccc;text-decoration:none;font-size:11px}
.images img{
 width:100%;height:135px;object-fit:cover;
 border-radius:12px;background:#171717
}
.composer{
 padding:12px 14px 18px;border-top:1px solid #222;
 background:#080808
}
.inputbox{
 display:flex;align-items:center;background:#171717;
 border:1px solid #333;border-radius:24px;
 padding:7px 8px 7px 17px;gap:10px
}
textarea{
 flex:1;background:transparent;color:white;
 border:none;outline:none;resize:none;
 font-family:inherit;font-size:15px;
 min-height:28px;max-height:120px;padding-top:6px
}
textarea::placeholder{color:#777}
.send{
 width:42px;height:42px;border:0;border-radius:50%;
 background:white;color:black;font-size:23px;
 font-weight:bold;cursor:pointer
}
.send:disabled{opacity:.4}
.footer{text-align:center;color:#555;font-size:10px;padding-top:10px}
.typing{color:#999;font-size:13px}
.dot{display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
@media(max-width:600px){
 .message{max-width:100%}
 .welcome h1{font-size:34px}
 .sources{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="logo">VEX <span>AI</span></div>
 <div class="status"><i>●</i> KNOWLEDGE SEARCH</div>
</header>

<main id="chat">
 <div class="welcome" id="welcome">
  <h1>VEX AI</h1>
  <p>Explore knowledge. Discover ideas. Find answers.</p>
  <div class="suggestions">
   <button onclick="quickAsk('What is artificial intelligence?')">Artificial Intelligence</button>
   <button onclick="quickAsk('Explain space exploration')">Space exploration</button>
   <button onclick="quickAsk('Who invented the internet?')">Technology</button>
  </div>
 </div>
</main>

<div class="composer">
 <div class="inputbox">
  <textarea id="question" placeholder="Ask VEX anything..." rows="1"></textarea>
  <button class="send" id="send">↑</button>
 </div>
 <div class="footer">VEX AI · Independent Knowledge Assistant</div>
</div>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("question");
const sendButton=document.getElementById("send");

function addMessage(text,type){
 document.getElementById("welcome")?.remove();
 const div=document.createElement("div");
 div.className="message "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}

function section(parent,title){
 const el=document.createElement("div");
 el.className="label";
 el.textContent=title;
 parent.appendChild(el);
 return el;
}

function addCard(parent,title,url,description,tag){
 if(!url || !/^https?:\/\//i.test(url))return;
 const a=document.createElement("a");
 a.className="source";
 a.href=url;
 a.target="_blank";
 a.rel="noopener noreferrer";

 const badge=document.createElement("span");
 badge.className="tag";
 badge.textContent=tag || "SOURCE";

 const strong=document.createElement("strong");
 strong.textContent=title || "Open source";

 const small=document.createElement("small");
 small.textContent=description || "";

 a.append(badge,strong,small);
 parent.appendChild(a);
}

async function getJSON(url){
 const response=await fetch(url);
 if(!response.ok)throw new Error("HTTP "+response.status);
 return await response.json();
}

// 1. Wikipedia knowledge search
async function wikipediaSearch(query){
 const params=new URLSearchParams({
  action:"query",
  list:"search",
  srsearch:query,
  srlimit:"6",
  format:"json",
  origin:"*"
 });
 const data=await getJSON(
  "https://en.wikipedia.org/w/api.php?"+params
 );
 const items=data.query?.search || [];

 const pages=await Promise.all(items.slice(0,5).map(async item=>{
  try{
   const p=new URLSearchParams({
    action:"query",
    prop:"extracts|pageimages",
    exintro:"1",
    explaintext:"1",
    piprop:"thumbnail",
    pithumbsize:"500",
    titles:item.title,
    format:"json",
    origin:"*"
   });
   const result=await getJSON(
    "https://en.wikipedia.org/w/api.php?"+p
   );
   const page=Object.values(result.query.pages)[0];
   return {
    title:item.title,
    url:"https://en.wikipedia.org/wiki/"+encodeURIComponent(item.title.replace(/ /g,"_")),
    extract:page.extract || item.snippet || "",
    image:page.thumbnail?.source || ""
   };
  }catch(e){
   return {
    title:item.title,
    url:"https://en.wikipedia.org/wiki/"+encodeURIComponent(item.title.replace(/ /g,"_")),
    extract:item.snippet || "",
    image:""
   };
  }
 }));
 return pages;
}

// 2. Wikidata factual search
async function wikidataSearch(query){
 const params=new URLSearchParams({
  action:"wbsearchentities",
  search:query,
  language:"en",
  limit:"5",
  format:"json",
  origin:"*"
 });
 const data=await getJSON(
  "https://www.wikidata.org/w/api.php?"+params
 );
 return (data.search || []).map(item=>({
  title:item.label || "Wikidata item",
  description:item.description || "Knowledge database entry",
  url:item.concepturi || ("https://www.wikidata.org/wiki/"+item.id)
 }));
}

// 3. Open Library book search
async function bookSearch(query){
 const params=new URLSearchParams({
  q:query,
  limit:"5",
  fields:"title,author_name,first_publish_year,key"
 });
 const data=await getJSON(
  "https://openlibrary.org/search.json?"+params
 );
 return (data.docs || []).map(book=>({
  title:book.title || "Book",
  author:(book.author_name || []).slice(0,2).join(", "),
  year:book.first_publish_year || "",
  url:"https://openlibrary.org"+book.key
 }));
}

// 4. Wikimedia Commons image search
async function imageSearch(query){
 const params=new URLSearchParams({
  action:"query",
  generator:"search",
  gsrsearch:"filetype:bitmap "+query,
  gsrnamespace:"6",
  gsrlimit:"8",
  prop:"imageinfo",
  iiprop:"url",
  iiurlwidth:"400",
  format:"json",
  origin:"*"
 });
 const data=await getJSON(
  "https://commons.wikimedia.org/w/api.php?"+params
 );
 return Object.values(data.query?.pages || {}).map(page=>({
  title:page.title.replace("File:",""),
  image:page.imageinfo?.[0]?.thumburl || page.imageinfo?.[0]?.url || "",
  url:"https://commons.wikimedia.org/wiki/"+encodeURIComponent(page.title.replace(/ /g,"_"))
 })).filter(x=>x.image);
}

function cleanText(text){
 const temp=document.createElement("div");
 temp.innerHTML=text || "";
 return (temp.textContent || "").replace(/\s+/g," ").trim();
}

function showWikipedia(reply,pages){
 if(!pages.length)return false;

 section(reply,"KNOWLEDGE ANSWER");
 const answer=document.createElement("div");
 answer.className="answer";

 const best=pages.find(p=>p.extract && p.extract.length>80);
 if(best){
  answer.textContent=best.extract.slice(0,3500);
 }else{
  answer.textContent="I found related knowledge pages. Open a result below to explore the topic.";
 }
 reply.appendChild(answer);

 section(reply,"WIKIPEDIA SOURCES");
 const grid=document.createElement("div");
 grid.className="sources";
 pages.forEach(p=>{
  addCard(grid,p.title,p.url,cleanText(p.extract).slice(0,180), "WIKIPEDIA");
 });
 reply.appendChild(grid);
 return true;
}

function showWikidata(reply,items){
 if(!items.length)return;
 section(reply,"WIKIDATA FACTS");
 const grid=document.createElement("div");
 grid.className="sources";
 items.forEach(item=>{
  addCard(grid,item.title,item.url,item.description,"WIKIDATA");
 });
 reply.appendChild(grid);
}

function showBooks(reply,books){
 if(!books.length)return;
 section(reply,"RELATED BOOKS");
 const grid=document.createElement("div");
 grid.className="sources";
 books.forEach(book=>{
  addCard(
   grid,
   book.title,
   book.url,
   [book.author,book.year].filter(Boolean).join(" · "),
   "OPEN LIBRARY"
  );
 });
 reply.appendChild(grid);
}

function showImages(reply,images){
 if(!images.length)return;
 section(reply,"RELATED IMAGES · WIKIMEDIA");
 const gallery=document.createElement("div");
 gallery.className="images";

 images.forEach(item=>{
  const a=document.createElement("a");
  a.href=item.url;
  a.target="_blank";
  a.rel="noopener noreferrer";

  const img=document.createElement("img");
  img.src=item.image;
  img.alt=item.title;
  img.loading="lazy";
  img.onerror=()=>a.remove();

  const caption=document.createElement("div");
  caption.textContent=item.title.slice(0,55);

  a.append(img,caption);
  gallery.appendChild(a);
 });
 reply.appendChild(gallery);
}

async function sendMessage(){
 const query=input.value.trim();
 if(!query || sendButton.disabled)return;

 addMessage(query,"user");
 input.value="";
 input.style.height="28px";
 sendButton.disabled=true;

 const reply=addMessage("Searching knowledge sources","bot typing");
 const animation=document.createElement("span");
 animation.className="dot";
 animation.textContent=" ...";
 reply.appendChild(animation);

 try{
  // Run all four searches together.
  const results=await Promise.allSettled([
   wikipediaSearch(query),
   wikidataSearch(query),
   bookSearch(query),
   imageSearch(query)
  ]);

  reply.classList.remove("typing");
  reply.textContent="";

  const wiki=results[0].status==="fulfilled"?results[0].value:[];
  const wikiData=results[1].status==="fulfilled"?results[1].value:[];
  const books=results[2].status==="fulfilled"?results[2].value:[];
  const images=results[3].status==="fulfilled"?results[3].value:[];

  const successful=results.filter(r=>r.status==="fulfilled").length;

  section(reply,"VEX AI");
  if(successful===0){
   const error=document.createElement("div");
   error.className="answer";
   error.textContent="All knowledge sources are temporarily unavailable. Please try again.";
   reply.appendChild(error);
  }else{
   if(!wiki.length && !wikiData.length && !books.length){
    const note=document.createElement("div");
    note.className="answer";
    note.textContent="No matching knowledge was found. Try a more specific question or different keywords.";
    reply.appendChild(note);
   }else{
    showWikipedia(reply,wiki);
    showWikidata(reply,wikiData);
    showBooks(reply,books);
    showImages(reply,images);
   }
   const note=document.createElement("div");
   note.style.cssText="color:#777;font-size:11px;margin-top:20px";
   note.textContent="Sources are retrieved from independent public knowledge services. Results may be incomplete.";
   reply.appendChild(note);
  }

 }catch(error){
  reply.classList.remove("typing");
  reply.textContent="VEX search error: "+error.message;
 }

 sendButton.disabled=false;
 chat.scrollTop=chat.scrollHeight;
 input.focus();
}

function quickAsk(text){
 input.value=text;
 sendMessage();
}

sendButton.addEventListener("click",sendMessage);

input.addEventListener("keydown",event=>{
 if(event.key==="Enter" && !event.shiftKey){
  event.preventDefault();
  sendMessage();
 }
});

input.addEventListener("input",function(){
 this.style.height="auto";
 this.style.height=Math.min(this.scrollHeight,120)+"px";
});
</script>
</body>
</html>
