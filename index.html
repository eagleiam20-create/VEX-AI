
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000">
<title>VEX AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;height:100dvh;overflow:hidden}
button,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;background:#000}
.sidebar{width:255px;flex-shrink:0;border-right:1px solid #222;padding:15px;display:flex;flex-direction:column;background:#000;z-index:5}
.brand{font-size:23px;font-weight:900;letter-spacing:3px;padding:12px 5px 25px}
.new-chat{background:#000;color:#fff;border:1px solid #333;border-radius:12px;padding:13px;text-align:left}
.history-title{font-size:10px;color:#888;letter-spacing:2px;margin:25px 8px 10px}
.history{overflow:auto;flex:1}
.history-item{padding:11px;border-radius:9px;color:#ddd;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.history-item:hover{background:#171717}
.profile{border-top:1px solid #222;padding:15px 5px;font-size:12px;color:#aaa;line-height:1.8}
.main{flex:1;min-width:0;height:100dvh;display:flex;flex-direction:column;position:relative}
.topbar{height:60px;min-height:60px;border-bottom:1px solid #171717;display:flex;align-items:center;padding:0 17px;gap:12px}
.mobile-brand{display:none;font-weight:bold;letter-spacing:2px}
.model{font-size:14px;font-weight:bold}
.model small{color:#777;font-weight:normal;margin-left:8px}
.icon{background:none;border:0;color:#fff;font-size:21px}
#chat{flex:1;overflow-y:auto;padding:25px 18px 155px}
.welcome{max-width:700px;margin:18vh auto 30px;text-align:center}
.welcome h1{font-size:38px;margin:0 0 14px}
.welcome p{font-size:14px;color:#888}
.suggestions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:25px}
.suggestions button{background:#000;border:1px solid #333;color:#ddd;padding:12px 15px;border-radius:22px;font-size:12px}
.message{max-width:850px;width:100%;margin:0 auto 25px;font-size:15px;line-height:1.8;overflow-wrap:anywhere}
.user-wrap{display:flex;justify-content:flex-end}
.user{background:#fff;color:#000;padding:12px 18px;border-radius:19px;max-width:85%;white-space:pre-wrap}
.bot{padding:6px 0}
.label{font-size:10px;color:#888;letter-spacing:2px;margin:22px 0 10px;font-weight:bold}
.answer{white-space:pre-wrap;line-height:1.85}
.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.source{display:block;background:#050505;border:1px solid #292929;padding:13px;border-radius:11px;text-decoration:none;color:#fff}
.source strong{font-size:13px;display:block}
.source small{font-size:11px;color:#999;display:block;margin-top:6px}
.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px}
.image-card{border:1px solid #242424;border-radius:11px;overflow:hidden;background:#050505}
.image-open{display:block;width:100%;padding:0;border:0;background:#080808}
.images img{width:100%;height:150px;object-fit:cover;display:block}
.image-caption{font-size:11px;padding:8px}
.image-credit{font-size:10px;color:#888;padding:0 8px 9px}
.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.video-card{border:1px solid #292929;border-radius:12px;overflow:hidden;background:#050505}
.video-card video,.video-card iframe{width:100%;aspect-ratio:16/9;display:block;background:#111;border:0}
.video-info{padding:12px}
.video-info strong{font-size:13px;display:block}
.video-info small{font-size:11px;color:#999;display:block;margin-top:5px}
.video-link{font-size:11px;color:#fff;display:inline-block;margin-top:8px}
.related{display:flex;flex-direction:column;gap:8px}
.related button{background:#050505;border:1px solid #292929;color:#ddd;border-radius:10px;padding:12px;text-align:left;font-size:12px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{background:transparent;border:1px solid #292929;color:#aaa;padding:7px 11px;border-radius:9px;font-size:12px}
.progress{color:#aaa;font-size:13px}
.progress:before{content:"";display:inline-block;width:7px;height:7px;background:#fff;border-radius:50%;margin-right:10px}
.composer-area{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#000 25%);padding:28px 18px 15px}
.composer{max-width:850px;margin:auto;background:#000;border:1px solid #444;border-radius:26px;padding:10px 12px;display:flex;gap:10px;align-items:flex-end}
.composer:focus-within{border-color:#aaa}
textarea{background:transparent;color:#fff;border:0;outline:0;resize:none;flex:1;min-height:30px;max-height:130px;font-size:15px;padding:7px 3px}
textarea::placeholder{color:#777}
.send{width:39px;height:39px;border:0;border-radius:50%;background:#fff;color:#000;font-size:23px;font-weight:bold}
.send:disabled{opacity:.4}
.bottom-note{text-align:center;color:#666;font-size:10px;margin-top:10px}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:99;display:none;align-items:center;justify-content:center;flex-direction:column;padding:55px 15px 20px}
#viewer.open{display:flex}
#viewer img{max-width:95vw;max-height:78vh;object-fit:contain}
#viewer button{position:absolute;top:12px;right:18px;background:#171717;border:1px solid #444;color:#fff;border-radius:50%;width:42px;height:42px;font-size:22px}
#viewerTitle{font-size:12px;color:#bbb;margin-top:12px;text-align:center}
@media(max-width:700px){
.sidebar{position:fixed;left:-270px;top:0;bottom:0;transition:left .2s;width:260px}
.sidebar.open{left:0}
.mobile-brand{display:block}
#chat{padding:18px 13px 150px}
.composer-area{padding:20px 10px 12px}
.welcome h1{font-size:29px}
.images{grid-template-columns:repeat(2,minmax(0,1fr))}
.images img{height:125px}
.videos{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand">VEX AI</div>
 <button class="new-chat" onclick="newChat()">＋ &nbsp; New chat</button>
 <div class="history-title">YOUR CHATS</div>
 <div class="history" id="history"></div>
 <div class="profile">VEX AI<br>Owner &amp; Creator: Avee Sharma<br>Knowledge Assistant</div>
</aside>
<main class="main">
 <div class="topbar">
  <button class="icon" onclick="toggleSidebar()">☰</button>
  <div class="mobile-brand">VEX AI</div>
  <div class="model">VEX AI <small>Knowledge Assistant</small></div>
 </div>
 <section id="chat">
  <div class="welcome" id="welcome">
   <h1>What can I help with?</h1>
   <p>Explore knowledge. Discover ideas. Ask VEX anything.</p>
   <div class="suggestions">
    <button onclick="quickAsk('Explain artificial intelligence')">Explain AI</button>
    <button onclick="quickAsk('Latest space discoveries')">Space</button>
    <button onclick="quickAsk('How does the internet work?')">Technology</button>
    <button onclick="quickAsk('Explain quantum computing')">Science</button>
   </div>
  </div>
 </section>
 <div class="composer-area">
  <div class="composer">
   <textarea id="question" rows="1" placeholder="Message VEX AI..."></textarea>
   <button class="send" id="send">↑</button>
  </div>
  <div class="bottom-note">VEX AI · Built by Avee Sharma</div>
 </div>
</main>
</div>
<div id="viewer" onclick="closeViewer()">
 <button onclick="closeViewer()">×</button>
 <img id="viewerImage" alt="Full size image">
 <div id="viewerTitle"></div>
</div>

<script>
const API='https://puri.li';
const chat=document.getElementById('chat');
const input=document.getElementById('question');
const sendButton=document.getElementById('send');
const historyBox=document.getElementById('history');
let conversations=[];
let activeId=null;
let busy=false;

const WELCOME=`<div class="welcome" id="welcome">
<h1>What can I help with?</h1>
<p>Explore knowledge. Discover ideas. Ask VEX anything.</p>
<div class="suggestions">
<button onclick="quickAsk('Explain artificial intelligence')">Explain AI</button>
<button onclick="quickAsk('Latest space discoveries')">Space</button>
<button onclick="quickAsk('How does the internet work?')">Technology</button>
<button onclick="quickAsk('Explain quantum computing')">Science</button>
</div></div>`;

function scrollDown(){chat.scrollTop=chat.scrollHeight}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function newChat(){activeId=null;chat.innerHTML=WELCOME;input.value='';document.getElementById('sidebar').classList.remove('open');input.focus()}
function save(){try{localStorage.setItem('vex_chats',JSON.stringify(conversations))}catch(e){}}
function load(){
 try{conversations=JSON.parse(localStorage.getItem('vex_chats')||'[]');if(!Array.isArray(conversations))conversations=[]}catch(e){conversations=[]}
 renderHistory();
}
function renderHistory(){
 historyBox.textContent='';
 conversations.forEach(c=>{
  const el=document.createElement('div');el.className='history-item';el.textContent=c.title||'New chat';
  el.onclick=()=>openChat(c.id);historyBox.appendChild(el);
 });
}
function store(m){
 if(!activeId){
  activeId=String(Date.now());
  conversations.unshift({id:activeId,title:m.type==='user'?m.text.slice(0,45):'New chat',messages:[]});
 }
 const c=conversations.find(x=>x.id===activeId);
 if(c)c.messages.push(m);
 save();renderHistory();
}
function openChat(id){
 const c=conversations.find(x=>x.id===id);if(!c)return;
 activeId=id;chat.innerHTML='';
 (c.messages||[]).forEach(m=>{
  if(m.type==='user')addUser(m.text,false);
  else if(m.type==='bot')renderBot(m.data,false);
 });
 document.getElementById('sidebar').classList.remove('open');scrollDown();
}
function addUser(text,saveIt=true){
 document.getElementById('welcome')?.remove();
 const wrap=document.createElement('div');wrap.className='message user-wrap';
 const bubble=document.createElement('div');bubble.className='user';bubble.textContent=text;
 wrap.appendChild(bubble);chat.appendChild(wrap);
 if(saveIt)store({type:'user',text});
 scrollDown();
}
function addLabel(parent,text){
 const el=document.createElement('div');el.className='label';el.textContent=text;parent.appendChild(el);
}
function absURL(v){try{return new URL(v,API).href}catch(e){return ''}}
function goodURL(v){try{return ['http:','https:'].includes(new URL(v).protocol)}catch(e){return false}}
async function getJSON(url,timeout=16000){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),timeout);
 try{
  const response=await fetch(url,{mode:'cors',credentials:'omit',cache:'no-store',signal:controller.signal,headers:{Accept:'application/json'}});
  if(!response.ok)throw Error('HTTP '+response.status);
  return await response.json();
 }finally{clearTimeout(timer)}
}
function words(q){
 const stop='what when where which who with from that this have does doing about into your the and for are was were will would could should can how why tell explain please show give me some only pictures picture images image photo photos video videos watch find search'.split(' ');
 return q.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w=>w.length>2&&!stop.includes(w));
}
function extractRelevant(text,q,max=3200){
 if(!text)return '';
 const terms=words(q);
 const sentences=text.replace(/\r/g,'').split(/\n+|(?<=[.!?])\s+/).map(x=>x.trim()).filter(x=>x.length>35);
 const ranked=sentences.map((s,i)=>({s,i,score:terms.reduce((n,w)=>n+(s.toLowerCase().includes(w)?2:0),0)}))
 .filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.i-b.i);
 let output=[],seen=new Set(),size=0;
 for(const item of ranked){
  const key=item.s.toLowerCase().slice(0,100);if(seen.has(key))continue;
  seen.add(key);if(size+item.s.length>max)continue;
  output.push(item.s);size+=item.s.length;if(output.length>=7)break;
 }
 return output.join('\n\n');
}

/* Search endpoint */
async function searchWeb(q){
 return await getJSON(API+'/api/search?'+new URLSearchParams({q,page:'1',exact:'0'}));
}
async function readPage(url){
 try{
  const data=await getJSON(API+'/api/context?url='+encodeURIComponent(url),14000);
  return [data.summary,data.content,Array.isArray(data.passages)?data.passages.join('\n'):''].filter(Boolean).join('\n');
 }catch(e){return ''}
}
async function getInfoCard(q){
 try{return await getJSON(API+'/api/infocard?q='+encodeURIComponent(q),10000)}catch(e){return null}
}
async function searchImages(q){
 const data=await getJSON(API+'/api/images?'+new URLSearchParams({q,page:'1'}),18000);
 return (Array.isArray(data.images)?data.images:[]).slice(0,12).map(x=>({
  title:x.title||'Image',
  thumb:absURL(x.thumbUrl||x.url),
  full:absURL(x.url||x.thumbUrl),
  license:x.license||'Licence not provided',
  creator:x.creator||x.author||'',
  source:x.source||'Wikimedia Commons'
 })).filter(x=>goodURL(x.thumb)&&goodURL(x.full));
}

/* Video search */
function getYoutubeId(url){
 try{
  const u=new URL(url);
  if(u.hostname.includes('youtu.be'))return u.pathname.split('/').filter(Boolean)[0]||'';
  if(u.hostname.includes('youtube.com')){
   if(u.pathname==='/watch')return u.searchParams.get('v')||'';
   const p=u.pathname.split('/').filter(Boolean);
   if(['embed','shorts'].includes(p[0]))return p[1]||'';
  }
 }catch(e){}
 return '';
}
async function searchYoutube(q){
 const query='site:youtube.com/watch '+q;
 const data=await searchWeb(query);
 const seen=new Set(),out=[];
 for(const r of data.results||[]){
  const id=getYoutubeId(r.url||'');
  if(!id||seen.has(id))continue;
  seen.add(id);
  out.push({type:'youtube',id,title:r.title||'YouTube video',description:r.description||'',url:r.url});
  if(out.length>=5)break;
 }
 return out;
}
async function searchArchive(q){
 const params=new URLSearchParams({
  q:q+' AND mediatype:movies',
  fl:'identifier,title,description',
  rows:'10',
  output:'json'
 });
 const data=await getJSON('https://archive.org/advancedsearch.php?'+params,18000);
 const docs=data?.response?.docs||[];
 const videos=[];
 for(const doc of docs.slice(0,8)){
  if(!doc.identifier)continue;
  try{
   const meta=await getJSON('https://archive.org/metadata/'+encodeURIComponent(doc.identifier),14000);
   const file=(meta.files||[]).find(f=>f.name&&/\.(mp4|webm|ogv)$/i.test(f.name)&&!f.name.includes('_thumb'));
   if(!file)continue;
   videos.push({
    type:'archive',
    title:doc.title||doc.identifier,
    description:typeof doc.description==='string'?doc.description.slice(0,200):'Internet Archive video',
    url:'https://archive.org/download/'+encodeURIComponent(doc.identifier)+'/'+file.name,
    page:'https://archive.org/details/'+encodeURIComponent(doc.identifier)
   });
   if(videos.length>=5)break;
  }catch(e){}
 }
 return videos;
}
async function searchVideos(q){
 const topic=q.replace(/\b(show|find|search|give|play|watch|me|some|videos?|video|please|about)\b/gi,' ').replace(/\s+/g,' ').trim()||q;
 const settled=await Promise.allSettled([searchYoutube(topic),searchArchive(topic)]);
 const youtube=settled[0].status==='fulfilled'?settled[0].value:[];
 const archive=settled[1].status==='fulfilled'?settled[1].value:[];
 return [...youtube,...archive].slice(0,8);
}

/* Related questions */
function relatedQuestions(q,results){
 const base=words(q).slice(0,3).join(' ')||q;
 const relatedWord=[];
 (results||[]).forEach(r=>words(r.title||'').forEach(w=>{
  if(!words(q).includes(w)&&!relatedWord.includes(w))relatedWord.push(w);
 }));
 return [
  'How does '+base+' work?',
  'What are the benefits and limitations of '+base+'?',
  relatedWord.length?'How is '+relatedWord.slice(0,2).join(' ')+' connected to '+base+'?':'What are real-world examples of '+base+'?'
 ];
}

/* Build explanation */
async function normalAnswer(q,status){
 status.textContent='Searching the web...';
 const [search,card]=await Promise.all([searchWeb(q),getInfoCard(q)]);
 const results=Array.isArray(search.results)?search.results:[];
 if(!results.length){
  return {answer:card?.instantAnswer?.answer||'No matching web pages were found. Try a more specific question.',results:[],images:[],related:[]};
 }
 status.textContent='Reading relevant pages...';
 const chosen=results.slice(0,5);
 const pages=await Promise.all(chosen.map(r=>readPage(r.url)));
 const excerpts=pages.map((p,i)=>extractRelevant(p||chosen[i].description||'',q,1000)).filter(Boolean);
 let answer='';
 const instant=card?.instantAnswer?.answer;
 if(instant)answer+='DIRECT ANSWER\n'+instant+'\n\n';
 if(Array.isArray(card?.facts)&&card.facts.length){
  answer+='KEY FACTS\n'+card.facts.slice(0,5).map(f=>'• '+f.label+': '+f.value).join('\n')+'\n\n';
 }
 if(excerpts.length)answer+='DETAILED EXPLANATION\n'+excerpts.slice(0,4).map((x,i)=>(i+1)+'. '+x).join('\n\n');
 if(!answer)answer='I found related web pages, but their indexed content was limited. Check the sources below for more detail.';
 status.textContent='Finding related images...';
 let images=[];
 try{images=await searchImages(q)}catch(e){console.warn('Image API error:',e)}
 return {
  answer,
  results:chosen.map(r=>({title:r.title,url:r.url,description:r.description||'',source:r.source||'WEB SOURCE'})),
  images,
  related:relatedQuestions(q,results)
 };
}

/* Display functions */
function renderSources(parent,items){
 if(!items?.length)return;
 addLabel(parent,'WEB SOURCES');
 const grid=document.createElement('div');grid.className='sources';
 items.forEach(x=>{
  const url=absURL(x.url);if(!goodURL(url))return;
  const a=document.createElement('a');a.className='source';a.href=url;a.target='_blank';a.rel='noopener noreferrer';
  const title=document.createElement('strong');title.textContent=x.title||'Web result';
  const desc=document.createElement('small');desc.textContent=x.description||x.source||'Open source';
  a.append(title,desc);grid.appendChild(a);
 });
 if(grid.childElementCount)parent.appendChild(grid);
}
function renderImages(parent,items){
 if(!items?.length){
  const n=document.createElement('div');n.style.color='#888';n.textContent='No images were returned by the image search service.';parent.appendChild(n);return;
 }
 addLabel(parent,'RELATED IMAGES');
 const grid=document.createElement('div');grid.className='images';
 items.forEach(x=>{
  const card=document.createElement('div');card.className='image-card';
  const button=document.createElement('button');button.className='image-open';button.onclick=()=>openViewer(x.full,x.title);
  const img=document.createElement('img');img.src=x.thumb;img.alt=x.title;img.loading='lazy';
  img.onerror=()=>card.remove();
  button.appendChild(img);
  const title=document.createElement('div');title.className='image-caption';title.textContent=x.title;
  const credit=document.createElement('div');credit.className='image-credit';
  credit.textContent=(x.creator?x.creator+' · ':'')+x.license+' · '+x.source;
  card.append(button,title,credit);grid.appendChild(card);
 });
 parent.appendChild(grid);
}
function renderVideos(parent,items){
 if(!items?.length){
  const n=document.createElement('div');n.style.color='#999';n.textContent='No playable videos found for this topic. Try a different search.';parent.appendChild(n);return;
 }
 addLabel(parent,'VIDEOS');
 const grid=document.createElement('div');grid.className='videos';
 items.forEach(v=>{
  const card=document.createElement('div');card.className='video-card';
  if(v.type==='youtube'){
   const iframe=document.createElement('iframe');
   iframe.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.id);
   iframe.title=v.title;iframe.loading='lazy';iframe.allowFullscreen=true;
   iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
   card.appendChild(iframe);
  }else{
   const video=document.createElement('video');video.src=v.url;video.controls=true;video.preload='metadata';video.playsInline=true;card.appendChild(video);
  }
  const info=document.createElement('div');info.className='video-info';
  const title=document.createElement('strong');title.textContent=v.title;
  const desc=document.createElement('small');desc.textContent=v.description||'Video result';
  const link=document.createElement('a');link.className='video-link';link.href=v.page||v.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Open video source';
  info.append(title,desc,link);card.appendChild(info);grid.appendChild(card);
 });
 parent.appendChild(grid);
}
function renderRelated(parent,items){
 if(!items?.length)return;
 addLabel(parent,'EXPLORE FURTHER');
 const box=document.createElement('div');box.className='related';
 items.forEach(q=>{
  const b=document.createElement('button');b.textContent='↗  '+q;b.onclick=()=>quickAsk(q);box.appendChild(b);
 });
 parent.appendChild(box);
}
function renderBot(data,saveIt=true){
 const reply=document.createElement('div');reply.className='message bot';
 addLabel(reply,'VEX AI');
 if(data.mode==='images')renderImages(reply,data.images);
 else if(data.mode==='videos')renderVideos(reply,data.videos);
 else{
  const answer=document.createElement('div');answer.className='answer';answer.textContent=data.answer||'No answer found.';
  reply.appendChild(answer);
  renderSources(reply,data.results);
  renderImages(reply,data.images);
  renderRelated(reply,data.related);
 }
 const actions=document.createElement('div');actions.className='actions';
 const copy=document.createElement('button');copy.textContent='Copy answer';
 copy.onclick=async()=>{
  try{await navigator.clipboard.writeText(data.answer||'');copy.textContent='Copied'}catch(e){copy.textContent='Copy unavailable'}
 };
 actions.appendChild(copy);reply.appendChild(actions);
 chat.appendChild(reply);
 if(saveIt)store({type:'bot',data});
 scrollDown();
}
function openViewer(url,title){
 document.getElementById('viewerImage').src=url;
 document.getElementById('viewerTitle').textContent=title||'';
 document.getElementById('viewer').classList.add('open');
}
function closeViewer(){
 document.getElementById('viewer').classList.remove('open');
 document.getElementById('viewerImage').src='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});

/* User intent */
function isVideo(q){return /\b(video|videos|watch|documentary|clip|clips|movie|movies)\b/i.test(q)}
function isImage(q){return /\b(image|images|picture|pictures|photo|photos|wallpaper|wallpapers)\b/i.test(q)}

async function sendMessage(){
 const q=input.value.trim();if(!q||busy)return;
 busy=true;sendButton.disabled=true;
 addUser(q);input.value='';input.style.height='30px';
 const status=document.createElement('div');status.className='message bot progress';status.textContent='Preparing your search...';chat.appendChild(status);scrollDown();
 try{
  let data;
  if(isVideo(q)){
   status.textContent='Searching video sources...';
   data={mode:'videos',videos:await searchVideos(q)};
  }else if(isImage(q)){
   status.textContent='Searching images...';
   data={mode:'images',images:await searchImages(q)};
  }else{
   data=await normalAnswer(q,status);
  }
  status.remove();renderBot(data);
 }catch(e){
  status.classList.remove('progress');
  status.textContent='Search connection failed: '+(e.message||'Network error')+'. This may be a browser CORS or API connection issue.';
  const retry=document.createElement('button');retry.className='icon';retry.textContent='↻ Retry';
  retry.onclick=()=>{status.remove();input.value=q;sendMessage()};
  status.appendChild(retry);
  console.error('VEX request error:',e);
 }finally{
  busy=false;sendButton.disabled=false;input.focus();
 }
}
function quickAsk(q){input.value=q;sendMessage()}
sendButton.addEventListener('click',sendMessage);
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,130)+'px'});
load();
</script>
