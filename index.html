<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>VEX AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #f5f5f5;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

.app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 950px;
    margin: auto;
}

header {
    height: 65px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    border-bottom: 1px solid #202020;
    gap: 14px;
}

.logo {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg,#fff,#777);
    color: transparent;
    background-clip: text;
}

.status {
    color: #888;
    font-size: 11px;
    margin-left: auto;
}

#chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px 17px 30px;
}

.welcome {
    text-align: center;
    margin: 19vh auto 30px;
}

.welcome h1 {
    font-size: 35px;
    letter-spacing: 3px;
    margin-bottom: 10px;
}

.welcome p {
    color: #888;
    font-size: 14px;
}

.message {
    max-width: 85%;
    padding: 14px 17px;
    margin: 15px 0;
    border-radius: 17px;
    line-height: 1.65;
    font-size: 15px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #202020;
    margin-left: auto;
    border-bottom-right-radius: 5px;
}

.bot {
    background: transparent;
    color: #e5e5e5;
    margin-right: auto;
    padding-left: 3px;
}

.composer {
    padding: 12px 14px 20px;
    border-top: 1px solid #202020;
    background: #080808;
}

.inputbox {
    display: flex;
    align-items: center;
    background: #171717;
    border: 1px solid #333;
    border-radius: 22px;
    padding: 7px 8px 7px 17px;
    gap: 9px;
}

textarea {
    flex: 1;
    background: transparent;
    color: white;
    border: none;
    outline: none;
    resize: none;
    font-size: 15px;
    font-family: inherit;
    min-height: 27px;
    max-height: 120px;
    padding-top: 7px;
}

textarea::placeholder {
    color: #777;
}

button {
    border: none;
    cursor: pointer;
}

.send {
    width: 39px;
    height: 39px;
    border-radius: 50%;
    background: white;
    color: black;
    font-size: 20px;
    font-weight: bold;
}

.footer {
    text-align: center;
    color: #555;
    font-size: 10px;
    padding-top: 10px;
}

@media(max-width:600px) {
    .welcome h1 { font-size: 29px; }
    .message { max-width: 93%; }
}
</style>
</head>

<body>
<div class="app">

<header>
    <div class="logo">VEX AI</div>
    <div class="status">● Independent AI</div>
</header>

<main id="chat">
    <div class="welcome" id="welcome">
        <h1>HELLO.</h1>
        <p>What would you like to explore today?</p>
    </div>
</main>

<div class="composer">
    <div class="inputbox">
        <textarea id="question"
          placeholder="Ask VEX anything..."
          rows="1"></textarea>
        <button class="send" onclick="sendMessage()">↑</button>
    </div>
    <div class="footer">VEX AI · Built independently</div>
</div>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("question");

function addMessage(text, type) {
    document.getElementById("welcome")?.remove();

    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

async function sendMessage() {
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user");
    input.value = "";

    const reply = addMessage("VEX is ready to be connected to its AI engine.", "bot");
}

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

input.addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
});
</script>

</body>
</html>
