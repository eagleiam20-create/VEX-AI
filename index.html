
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>VEX AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:#f5f5f5;
 font-family:"Segoe UI",Arial,sans-serif;
 height:100dvh;overflow:hidden
}
.app{height:100dvh;max-width:1000px;margin:auto;display:flex;flex-direction:column}
header{
 height:65px;min-height:65px;display:flex;align-items:center;
 padding:0 18px;border-bottom:1px solid #252525
}
.logo{font-size:23px;font-weight:900;letter-spacing:3px}
.status{margin-left:auto;color:#888;font-size:11px}
#chat{flex:1;overflow-y:auto;padding:24px 18px 35px;scroll-behavior:smooth}
.welcome{text-align:center;margin:17vh auto 30px}
.welcome h1{font-size:40px;letter-spacing:6px;margin:0 0 12px}
.welcome p{color:#888;font-size:14px}
.message{max-width:96%;padding:13px 17px;margin:17px 0;border-radius:17px;line-height:1.7;font-size:15px;overflow-wrap:anywhere}
.user{background:#222;margin-left:auto;width:fit-content;border-bottom-right-radius:5px;white-space:pre-wrap}
.bot{margin-right:auto;padding-left:3px;width:100%}
.label{font-size:10px;color:#999;letter-spacing:1.5px;margin:17px 0 9px;font-weight:bold}
.answer{white-space:pre-wrap;line-height:1.8}
.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.source{
 display:block;background:#141414;border:1px solid #292929;
 border-radius:12px;padding:13px;color:#eee;text-decoration:none
}
.source:hover{background:#222}
.source strong{font-size:13px;display:block}
.source small{display:block;color:#999;margin-top:6px;font-size:12px;line-height:1.5}
.tag{font-size:9px;color:#aaa;margin-bottom:7px;display:block;letter-spacing:1px}
.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.images img{width:100%;height:130px;object-fit:cover;border-radius:10px;background:#171717}
.images a{color:#aaa;text-decoration:none;font-size:11px}
.more{
 margin-top:15px;padding:10px 16px;border-radius:20px;
 background:#202020;border:1px solid #444;color:white;cursor:pointer
}
.composer{padding:12px 14px 18px;border-top:1px solid #222;background:#080808}
.inputbox{display:flex;align-items:center;background:#171717;border:1px solid #333;border-radius:22px;padding:7px 8px 7px 16px;gap:10px}
textarea{flex:1;background:transparent;color:white;border:none;outline:none;resize:none;font-family:inherit;font-size:15px;min-height:28px;max-height:120px;padding-top:6px}
textarea::placeholder{color:#777}
.send{width:42px;height:42px;border:0;border-radius:50%;background:white;color:black;font-size:23px;font-weight:bold;cursor:pointer}
.send:disabled{opacity:.4}
.footer{text-align:center;color:#555;font-size:10px;padding-top:10px}
@media(max-width:600px){.message{max-width:100%}.sources{grid-template-columns:1fr}.welcome h1{font-size:32px}}
</style>
</head>

<body>
<div class="app">
<header>
 <div class="logo">VEX AI</div>
 <div class="status">● LIVE WEB INDEX</div>
</header>

<main id="chat">
 <div class="welcome" id="welcome">
  <h1>VEX AI</h1>
  <p>Search the web. Explore knowledge. Discover more.</p>
 </div>
</main>

<div class="composer">
 <div class="inputbox">
  <textarea id="question" placeholder="Ask VEX anything..." rows="1"></textarea>
  <button class="send" id="send">↑</button>
 </div>
 <div class="footer">VEX AI · Independent Web Search Assistant</div>
</div>
</div>

<script>
const API="https://puri.li";
const chat=document.getElementById("chat");
const input=document.getElementById("question");
const sendButton=document.getElementById("send");

let currentQuery="";
let currentPage=1;
let searching=false;

function addMessage(text,type){
 document.getElementById("welcome")?.remove();
 const el=document.createElement("div");
 el.className="message "+type;
 el.textContent=text;
 chat.appendChild(el);
 chat.scrollTop=chat.scrollHeight;
 return el;
}

function section(parent,title){
 const el=document.createElement("div");
 el.className="label";
 el.textContent=title;
 parent.appendChild(el);
 return el;
}

function validURL(url){
 try{
  const u=new URL(url);
  return u.protocol==="https:" || u.protocol==="http:";
 }catch(e){return false}
}

async function api(path){
 const response=await fetch(API+path);
 if(!response.ok)throw new Error("HTTP "+response.status);
 return await response.json();
}

function addSource(parent,item,context){
 if(!validURL(item.url))return;

 const a=document.createElement("a");
 a.className="source";
 a.href=item.url;
 a.target="_blank";
 a.rel="noopener noreferrer";

 const tag=document.createElement("span");
 tag.className="tag";
 tag.textContent=item.source || "WEB RESULT";

 const title=document.createElement("strong");
 title.textContent=item.title || "Web page";

 const description=document.createElement("small");
 description.textContent=
  context || item.description || item.displayUrl || "";

 a.append(tag,title,description);
 parent.appendChild(a);
}

function relevantText(content,query){
 if(!content)return "";
 const words=query.toLowerCase().split(/\s+/).filter(x=>x.length>2);
 const paragraphs=content
  .replace(/\r/g,"")
  .split(/\n+/)
  .map(x=>x.trim())
  .filter(x=>x.length>70);

 const scored=paragraphs.map(p=>{
  const lower=p.toLowerCase();
  const score=words.reduce((n,w)=>n+(lower.includes(w)?1:0),0);
  return {text:p,score};
 });

 scored.sort((a,b)=>b.score-a.score);
 const selected=scored.slice(0,3).map(x=>x.text);
 return selected.join("\n\n").slice(0,2200);
}

async function getContext(item){
 try{
  const data=await api(
   "/api/context?url="+encodeURIComponent(item.url)
  );
  return {
   text:data.content || data.summary || item.description || "",
   coverage:data.coverage || "unknown"
  };
 }catch(e){
  return {
   text:item.description || "Only the search snippet was available.",
   coverage:"search-snippet-fallback"
  };
 }
}

async function searchImages(query,parent){
 try{
  const data=await api(
   "/api/images?q="+encodeURIComponent(query)+"&page=1"
  );
  const images=data.images || [];
  if(!images.length)return;

  section(parent,"RELATED IMAGES");
  const gallery=document.createElement("div");
  gallery.className="images";

  images.slice(0,8).forEach(item=>{
   const imageURL=item.thumbUrl || item.url;
   const originalURL=item.url;

   if(!validURL(imageURL) && !imageURL.startsWith("/"))return;
   if(!validURL(originalURL) && !originalURL.startsWith("/"))return;

   const a=document.createElement("a");
   a.href=new URL(originalURL,API).href;
   a.target="_blank";
   a.rel="noopener noreferrer";

   const img=document.createElement("img");
   img.src=new URL(imageURL,API).href;
   img.alt=item.title || "Related image";
   img.loading="lazy";
   img.onerror=()=>a.remove();

   const caption=document.createElement("div");
   caption.textContent=item.title || "Image";

   a.append(img,caption);
   gallery.appendChild(a);
  });

  parent.appendChild(gallery);
 }catch(e){
  console.log("Image search unavailable:",e);
 }
}

async function runSearch(query,page=1){
 currentQuery=query;
 currentPage=page;

 const reply=addMessage(
  "Searching the web and collecting available page information...",
  "bot"
 );

 try{
  // Search the independent web index.
  const data=await api(
   "/api/search?q="+encodeURIComponent(query)+
   "&page="+page+"&exact=0"
  );

  const results=data.results || [];
  reply.textContent="";

  section(reply,"VEX AI · WEB SEARCH");

  if(data.correction?.showing){
   const correction=document.createElement("div");
   correction.style.color="#999";
   correction.textContent="Search corrected to: "+data.correction.corrected;
   reply.appendChild(correction);
  }

  const summary=document.createElement("div");
  summary.className="answer";
  summary.textContent=
   results.length
   ? "Found "+(data.total ?? results.length)+
     " estimated matching pages. Reading available information from the top results."
   : "No matching pages found. Try different keywords.";
  reply.appendChild(summary);

  if(!results.length)return;

  // Retrieve stored page context from top five results.
  const selected=results.slice(0,5);
  const contexts=await Promise.all(
   selected.map(item=>getContext(item))
  );

  const evidence=contexts
   .map((c,i)=>({
    title:selected[i].title,
    url:selected[i].url,
    text:relevantText(c.text,query) || selected[i].description,
    coverage:c.coverage
   }))
   .filter(x=>x.text);

  if(evidence.length){
   section(reply,"INFORMATION FOUND");

   evidence.forEach(item=>{
    const block=document.createElement("div");
    block.style.marginBottom="17px";

    const title=document.createElement("div");
    title.style.fontWeight="700";
    title.style.marginBottom="5px";
    title.textContent=item.title;

    const content=document.createElement("div");
    content.className="answer";
    content.textContent=item.text;

    const coverage=document.createElement("div");
    coverage.style.cssText="font-size:10px;color:#777;margin-top:5px";
    coverage.textContent=
     item.coverage==="stored-extracted-passages"
     ? "Stored page passages"
     : "Search snippet / limited stored content";

    block.append(title,content,coverage);
    reply.appendChild(block);
   });
  }

  section(reply,"WEB SOURCES");
  const grid=document.createElement("div");
  grid.className="sources";

  results.forEach((item,i)=>{
   addSource(
    grid,
    item,
    contexts[i]?.text
      ? contexts[i].text.slice(0,190)
      : item.description
   );
  });

  reply.appendChild(grid);

  // Images from Wikimedia-powered image endpoint.
  await searchImages(query,reply);

  const info=document.createElement("div");
  info.style.cssText="font-size:10px;color:#777;margin-top:17px";
  info.textContent=
   "Search index: Purili. Page information may be incomplete. "+
   "VEX displays retrieved source material and does not independently verify every claim.";
  reply.appendChild(info);

  if(data.hasNext){
   const more=document.createElement("button");
   more.className="more";
   more.textContent="Load more results →";
   more.onclick=()=>{
    more.disabled=true;
    more.textContent="Loading...";
    runSearch(currentQuery,currentPage+1);
   };
   reply.appendChild(more);
  }

 }catch(error){
  reply.textContent=
   "VEX could not connect to the web search service.\n\n"+
   error.message+
   "\n\nPlease try again later.";
 }
}

async function sendMessage(){
 const query=input.value.trim();
 if(!query || searching)return;

 searching=true;
 sendButton.disabled=true;

 addMessage(query,"user");
 input.value="";
 input.style.height="28px";

 await runSearch(query,1);

 searching=false;
 sendButton.disabled=false;
 input.focus();
 chat.scrollTop=chat.scrollHeight;
}

sendButton.addEventListener("click",sendMessage);

input.addEventListener("keydown",event=>{
 if(event.key==="Enter" && !event.shiftKey){
  event.preventDefault();
  sendMessage();
 }
});

input.addEventListener("input",function(){
 this.style.height="auto";
 this.style.height=Math.min(this.scrollHeight,120)+"px";
});
</script>
</body>
</html>
