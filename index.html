
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>VEX AI</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --panel: #080808;
      --panel2: #101010;
      --border: #222;
      --text: #f5f5f5;
      --muted: #888;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    .sidebar {
      width: 260px;
      background: #050505;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px 12px;
      flex-shrink: 0;
    }

    .brand {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 8px 10px 25px;
    }

    .brand span {
      color: #777;
    }

    .side-btn {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: #ddd;
      padding: 12px;
      text-align: left;
      border-radius: 9px;
      margin-bottom: 7px;
    }

    .side-btn:hover {
      background: #151515;
      border-color: #252525;
    }

    .history-title {
      color: #777;
      font-size: 12px;
      margin: 25px 10px 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .history {
      overflow-y: auto;
      flex: 1;
    }

    .history-item {
      padding: 10px;
      border-radius: 8px;
      color: #aaa;
      cursor: pointer;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    .history-item:hover {
      background: #151515;
      color: white;
    }

    .profile {
      border-top: 1px solid var(--border);
      padding: 15px 8px 0;
      color: #aaa;
      font-size: 13px;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 62px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      flex-shrink: 0;
    }

    .top-title {
      font-size: 15px;
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .small-btn {
      border: 1px solid #292929;
      background: #0b0b0b;
      color: #eee;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
    }

    .small-btn:hover {
      background: #202020;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 30px 18px 150px;
      scroll-behavior: smooth;
    }

    .welcome {
      max-width: 760px;
      margin: 12vh auto 35px;
      text-align: center;
    }

    .welcome h1 {
      font-size: clamp(35px, 6vw, 58px);
      margin: 0 0 12px;
      letter-spacing: -2px;
    }

    .welcome p {
      color: #888;
      font-size: 15px;
    }

    .message {
      max-width: 850px;
      margin: 25px auto;
      display: flex;
      gap: 13px;
      line-height: 1.7;
    }

    .avatar {
      width: 32px;
      height: 32px;
      min-width: 32px;
      border: 1px solid #333;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: bold;
    }

    .message-content {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
    }

    .message-role {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .message-text {
      color: #ddd;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .message-text a {
      color: #aaa;
    }

    .message-text img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }

    .composer-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, #000 22%);
    }

    .composer {
      max-width: 850px;
      margin: auto;
      border: 1px solid #333;
      background: #101010;
      border-radius: 17px;
      padding: 12px;
      box-shadow: 0 5px 35px #000;
    }

    .composer textarea {
      width: 100%;
      min-height: 48px;
      max-height: 180px;
      resize: vertical;
      background: transparent;
      color: white;
      border: none;
      outline: none;
      padding: 8px;
      font-size: 14px;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .composer-tools {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .tool-btn {
      background: transparent;
      border: 1px solid #292929;
      color: #aaa;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
    }

    .tool-btn:hover {
      color: white;
      background: #222;
    }

    .send-btn {
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      border-radius: 10px;
      padding: 10px 17px;
    }

    .send-btn:hover {
      background: #ccc;
    }

    .send-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .disclaimer {
      text-align: center;
      color: #555;
      font-size: 10px;
      margin-top: 9px;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .result-card {
      background: #101010;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 13px;
      overflow: hidden;
    }

    .result-card a {
      color: #eee;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
    }

    .result-card p {
      color: #999;
      font-size: 12px;
      line-height: 1.5;
    }

    .result-card img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 9px;
    }

    .typing {
      color: #888;
      font-size: 13px;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: .4; }
      to { opacity: 1; }
    }

    .mobile-menu {
      display: none;
    }

    @media(max-width: 700px) {
      .sidebar {
        position: fixed;
        z-index: 10;
        left: -270px;
        top: 0;
        bottom: 0;
        transition: left .2s;
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu {
        display: inline-block;
      }

      .topbar {
        padding: 0 12px;
      }

      .chat {
        padding: 20px 12px 150px;
      }

      .composer-wrap {
        padding: 10px;
      }

      .welcome {
        margin-top: 12vh;
      }

      .top-actions .small-btn {
        padding: 7px;
      }
    }
  </style>
</head>

<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">VEX <span>AI</span></div>

    <button class="side-btn" onclick="newChat()">＋ New chat</button>
    <button class="side-btn" onclick="startSearch()">⌕ Web search</button>
    <button class="side-btn" onclick="startImages()">▧ Images</button>
    <button class="side-btn" onclick="startVideos()">▶ Videos</button>
    <button class="side-btn" onclick="openBuilder()">⌘ Code Builder</button>

    <div class="history-title">Recent chats</div>
    <div class="history" id="history"></div>

    <div class="profile">VEX AI · Independent project</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="small-btn mobile-menu" onclick="toggleSidebar()">☰</button>
        <div class="top-title">VEX AI</div>
      </div>

      <div class="top-actions">
        <button class="small-btn" onclick="newChat()">New chat</button>
        <button class="small-btn" onclick="clearHistory()">Clear history</button>
      </div>
    </header>

    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <h1>VEX AI</h1>
        <p>Ask anything. Explore ideas. Build something new.</p>
      </div>
    </section>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="prompt" placeholder="Message VEX AI..." rows="2"></textarea>

        <div class="composer-bottom">
          <div class="composer-tools">
            <button class="tool-btn" onclick="startSearch()">⌕ Search</button>
            <button class="tool-btn" onclick="startImages()">▧ Images</button>
            <button class="tool-btn" onclick="startVideos()">▶ Videos</button>
          </div>

          <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑ Send</button>
        </div>
      </div>
      <div class="disclaimer">VEX AI can make mistakes. Verify important information.</div>
    </div>
  </main>
</div>

<script>
const API = "https://puri.li/api";

const chat = document.getElementById("chat");
const promptBox = document.getElementById("prompt");
const sendBtn = document.getElementById("sendBtn");

let messages = [];
let currentMode = "chat";
let busy = false;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function newChat() {
  messages = [];
  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>VEX AI</h1>
      <p>Ask anything. Explore ideas. Build something new.</p>
    </div>`;
  promptBox.value = "";
  currentMode = "chat";
  document.getElementById("sidebar").classList.remove("open");
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

function addMessage(role, text, extraHTML = "") {
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const wrapper = document.createElement("div");
  wrapper.className = "message";

  const avatar = role === "user" ? "YOU" : "VX";
  const label = role === "user" ? "You" : "VEX AI";

  wrapper.innerHTML = `
    <div class="avatar">${avatar}</div>
    <div class="message-content">
      <div class="message-role">${label}</div>
      <div class="message-text">${escapeHTML(text)}</div>
      ${extraHTML}
    </div>`;

  chat.appendChild(wrapper);
  chat.scrollTop = chat.scrollHeight;
  return wrapper;
}

function addTyping() {
  const el = addMessage("assistant", "");
  el.querySelector(".message-text").innerHTML =
    '<span class="typing">VEX is thinking...</span>';
  return el;
}

function saveHistory() {
  try {
    const history = JSON.parse(localStorage.getItem("vex_history") || "[]");
    if (messages.length) {
      history.unshift({
        title: messages.find(m => m.role === "user")?.content?.slice(0, 60) || "New chat",
        messages,
        time: Date.now()
      });
      localStorage.setItem("vex_history", JSON.stringify(history.slice(0, 30)));
    }
    renderHistory();
  } catch (error) {
    console.warn("History could not be saved", error);
  }
}

function renderHistory() {
  const list = document.getElementById("history");
  let history = [];

  try {
    history = JSON.parse(localStorage.getItem("vex_history") || "[]");
  } catch {}

  list.innerHTML = "";

  history.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.textContent = item.title || "Chat " + (index + 1);
    div.onclick = () => loadHistory(index);
    list.appendChild(div);
  });
}

function loadHistory(index) {
  const history = JSON.parse(localStorage.getItem("vex_history") || "[]");
  const item = history[index];
  if (!item) return;

  messages = item.messages || [];
  chat.innerHTML = "";

  messages.forEach(m => addMessage(m.role, m.content));
  document.getElementById("sidebar").classList.remove("open");
}

function clearHistory() {
  if (!confirm("Delete all saved chat history?")) return;
  localStorage.removeItem("vex_history");
  renderHistory();
}

function startSearch() {
  currentMode = "search";
  promptBox.placeholder = "Search the web...";
  promptBox.focus();
}

function startImages() {
  currentMode = "images";
  promptBox.placeholder = "Search for images...";
  promptBox.focus();
}

function startVideos() {
  currentMode = "videos";
  promptBox.placeholder = "Search for videos...";
  promptBox.focus();
}

async function sendMessage() {
  const query = promptBox.value.trim();
  if (!query || busy) return;

  const mode = currentMode;
  currentMode = "chat";

  promptBox.value = "";
  promptBox.placeholder = "Message VEX AI...";

  addMessage("user", query);
  messages.push({ role: "user", content: query });

  busy = true;
  sendBtn.disabled = true;

  const loading = addTyping();

  try {
    if (mode === "images") {
      const data = await searchImages(query);
      loading.remove();
      addMessage("assistant", "Here are the image results for: " + query, data.html);
    } else if (mode === "videos") {
      const data = await searchVideos(query);
      loading.remove();
      addMessage("assistant", "Here are the video results for: " + query, data.html);
    } else if (mode === "search") {
      const data = await webSearch(query);
      loading.remove();
      addMessage("assistant", data.answer, data.html);
      messages.push({ role: "assistant", content: data.answer });
    } else {
      const data = await webSearch(query);
      loading.remove();

      if (data.answer) {
        addMessage("assistant", data.answer, data.html);
        messages.push({ role: "assistant", content: data.answer });
      } else {
        addMessage("assistant",
          "I couldn't retrieve useful web information right now. Please try again.");
      }
    }

    saveHistory();
  } catch (error) {
    loading.remove();
    addMessage("assistant",
      "VEX could not access the search service right now. Please try again.");
    console.error(error);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
}

async function fetchJSON(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error("HTTP " + response.status);
  return await response.json();
}

function extractResults(data) {
  if (Array.isArray(data)) return data;
  return data.results || data.items || data.data || [];
}

async function webSearch(query) {
  const data = await fetchJSON(
    API + "/search?q=" + encodeURIComponent(query) + "&page=1&exact=0"
  );

  const results = extractResults(data);
  let snippets = [];

  for (const item of results.slice(0, 5)) {
    const title = item.title || item.name || "Search result";
    const snippet = item.snippet || item.description || item.content || "";
    const url = item.url || item.link || "";

    snippets.push({
      title,
      snippet,
      url
    });
  }

  const answer = snippets.length
    ? "I found these web results for \"" + query + "\". The summaries below are based on available search snippets, not a response generated by the VEX V6 language model."
    : "No useful search results were returned for this query.";

  const html = snippets.length
    ? `<div class="results">${snippets.map(item => `
        <div class="result-card">
          <a href="${escapeHTML(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(item.title)}</a>
          <p>${escapeHTML(item.snippet)}</p>
        </div>
      `).join("")}</div>`
    : "";

  return { answer, html };
}

async function searchImages(query) {
  const data = await fetchJSON(
    API + "/images?q=" + encodeURIComponent(query) + "&page=1"
  );

  const results = extractResults(data);

  const html = `<div class="results">${
    results.slice(0, 12).map(item => {
      const image = item.image || item.image_url || item.thumbnail || item.url;
      const page = item.page || item.source || item.link || image;
      if (!image) return "";

      return `
        <div class="result-card">
          <a href="${escapeHTML(page)}" target="_blank" rel="noopener noreferrer">
            <img src="${escapeHTML(image)}" alt="${escapeHTML(item.title || query)}" loading="lazy">
          </a>
          <p>${escapeHTML(item.title || query)}</p>
        </div>`;
    }).join("")
  }</div>`;

  return { html };
}

async function searchVideos(query) {
  const searches = [
    query + " video",
    query + " watch",
    query + " tutorial video"
  ];

  let all = [];

  for (const term of searches) {
    try {
      const data = await fetchJSON(
        API + "/search?q=" + encodeURIComponent(term) + "&page=1&exact=0"
      );
      all = all.concat(extractResults(data));
    } catch (error) {
      console.warn(error);
    }
  }

  const unique = [];
  const seen = new Set();

  for (const item of all) {
    const url = item.url || item.link;
    if (url && !seen.has(url)) {
      seen.add(url);
      unique.push(item);
    }
  }

  const html = `<div class="results">${
    unique.slice(0, 9).map(item => {
      const url = item.url || item.link;
      const title = item.title || "Video result";
      const youtube = getYouTubeEmbed(url);

      return `
        <div class="result-card">
          ${youtube
            ? `<iframe width="100%" height="180" src="${escapeHTML(youtube)}" title="${escapeHTML(title)}" allowfullscreen loading="lazy"></iframe>`
            : ""}
          <a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(title)}</a>
          <p>${escapeHTML(item.snippet || item.description || "")}</p>
        </div>`;
    }).join("")
  }</div>`;

  return { html };
}

function getYouTubeEmbed(url) {
  try {
    const parsed = new URL(url);
    let id = "";

    if (parsed.hostname.includes("youtu.be")) {
      id = parsed.pathname.slice(1);
    } else if (parsed.hostname.includes("youtube.com")) {
      if (parsed.pathname === "/watch") {
        id = parsed.searchParams.get("v");
      } else if (parsed.pathname.startsWith("/shorts/")) {
        id = parsed.pathname.split("/")[2];
      } else if (parsed.pathname.startsWith("/embed/")) {
        id = parsed.pathname.split("/")[2];
      }
    }

    return id ? "https://www.youtube.com/embed/" + encodeURIComponent(id) : "";
  } catch {
    return "";
  }
}

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

renderHistory();
</script>

<script src="vex_builder.js"></script>
</body>
</html>
