
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>VEX AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#000;--panel:#0b0b0b;--surface:#111;--border:#242424;--white:#f5f5f5;--muted:#858585}
body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{display:flex;width:100%;height:100dvh;overflow:hidden;background:#000}
.sidebar{width:260px;flex-shrink:0;background:#080808;border-right:1px solid #202020;display:flex;flex-direction:column;padding:18px 12px;z-index:15;transition:transform .25s}
.sideTop{display:flex;align-items:center;padding:7px 10px 25px}
.brand{font-family:"Space Grotesk",sans-serif;font-size:25px;font-weight:700;letter-spacing:-1.2px}
.brand span{color:#777}
.sideButton{width:100%;display:flex;align-items:center;gap:12px;padding:13px;border:1px solid #252525;border-radius:11px;background:#101010;color:#eee;text-align:left;font-size:13px;margin-bottom:9px}
.sideButton:hover{background:#1a1a1a}
.sideHeading{font-size:10px;color:#666;padding:22px 10px 10px;letter-spacing:1.5px}
.historyList{flex:1;overflow-y:auto}
.historyItem{padding:11px;border-radius:8px;color:#999;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;margin-bottom:3px}
.historyItem:hover{background:#191919;color:#fff}
.sideBottom{border-top:1px solid #252525;padding-top:13px}
.profile{display:flex;align-items:center;gap:11px;padding:10px}
.avatar{width:35px;height:35px;border-radius:12px;background:#1c1c1c;display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700}
.profile small{display:block;color:#777;margin-top:4px;font-size:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
header{height:62px;flex-shrink:0;border-bottom:1px solid #1d1d1d;display:flex;align-items:center;justify-content:space-between;padding:0 25px;background:#000}
.headerLeft{display:flex;align-items:center;gap:13px}
.headerTitle{font-family:"Space Grotesk";font-size:19px;font-weight:600;letter-spacing:-.5px}
.headerVersion{font-size:10px;color:#999;border:1px solid #292929;padding:5px 9px;border-radius:20px}
.menuButton{display:none;border:0;background:transparent;color:#fff;font-size:23px;padding:5px}
.headerRight{font-size:11px;color:#777;letter-spacing:.3px}
main{flex:1;overflow-y:auto;padding:35px 22px 150px;scroll-behavior:smooth}
.chat{max-width:820px;margin:0 auto}
.welcome{text-align:center;position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:90%;max-width:650px}
.welcome h1{font-family:"Space Grotesk";font-size:48px;letter-spacing:-2px;font-weight:600;margin:0 0 12px}
.welcome p{font-size:15px;color:#858585;line-height:1.7}
.message{margin:0 0 32px}
.user{display:flex;justify-content:flex-end}
.userBubble{background:#171717;border:1px solid #292929;border-radius:19px 19px 5px 19px;padding:13px 17px;max-width:82%;font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.answer{font-size:15px;line-height:1.85;color:#ddd;overflow-wrap:anywhere}
.answer h2{font-family:"Space Grotesk";font-size:25px;line-height:1.35;color:#fff;margin:8px 0 18px;letter-spacing:-.5px}
.answer h3{font-family:"Space Grotesk";font-size:17px;color:#fff;margin:23px 0 8px}
.answer p{margin:10px 0}
.answer ul,.answer ol{padding-left:23px}
.answer li{margin:8px 0}
.answer strong{color:#fff;font-weight:700}
.answer code{background:#171717;padding:3px 6px;border-radius:5px}
.sectionLabel{font-size:10px;letter-spacing:1.7px;color:#777;font-weight:700;margin:27px 0 13px}
.sources{display:grid;gap:9px}
.source{display:block;text-decoration:none;color:#ddd;border:1px solid #262626;border-radius:12px;padding:14px;background:#080808;transition:.2s}
.source:hover{background:#151515;border-color:#555}
.source b{display:block;font-size:13px;margin-bottom:6px}
.source small{display:block;color:#888;line-height:1.5;overflow-wrap:anywhere;margin-top:3px}
.mediaGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.mediaItem{border:1px solid #262626;background:#090909;border-radius:12px;overflow:hidden;min-width:0}
.mediaItem img{width:100%;height:165px;object-fit:cover;display:block;cursor:pointer;background:#111;transition:transform .25s}
.mediaItem img:hover{transform:scale(1.025)}
.mediaItem p{font-size:11px;color:#bbb;padding:10px;margin:0;line-height:1.5}
.mediaItem a{display:block;padding:0 10px 10px;color:#999;font-size:11px;text-decoration:none}
.videoGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.videoItem{border:1px solid #292929;border-radius:12px;overflow:hidden;background:#090909;min-width:0}
.videoItem iframe{width:100%;aspect-ratio:16/9;border:0;display:block;background:#111}
.videoItem a{display:block;padding:12px;color:#ddd;text-decoration:none;font-size:12px;line-height:1.5}
.followups{display:grid;gap:8px}
.followup{background:#090909;border:1px solid #292929;color:#ddd;text-align:left;padding:13px 14px;border-radius:10px;font-size:12px}
.followup:hover{background:#1a1a1a;border-color:#555}
.answerTools{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.smallBtn{background:transparent;border:1px solid #292929;color:#999;border-radius:9px;padding:9px 12px;font-size:11px}
.smallBtn:hover{background:#1b1b1b;color:#fff}
.composerWrap{position:absolute;bottom:0;left:0;right:0;padding:20px 20px 13px;background:linear-gradient(transparent,#000 20%,#000);z-index:5}
.composer{max-width:820px;margin:auto;border:1px solid #333;background:#101010;border-radius:25px;padding:9px 10px 9px 18px;display:flex;align-items:center;gap:10px;min-height:59px}
.composer:focus-within{border-color:#666}
.composer input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:10px 2px;font-size:14px}
.composer input::placeholder{color:#777}
.send{width:39px;height:39px;flex-shrink:0;border:0;border-radius:50%;background:#fff;color:#000;font-size:23px;font-weight:700;display:grid;place-items:center}
.send:hover{background:#ddd}
.send:disabled{opacity:.4}
.composerHint{text-align:center;color:#555;font-size:10px;margin:10px 0 0}
.loading{color:#999;font-size:12px;padding:14px 0}
.empty{color:#777;font-size:12px}
.viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.98);z-index:30;align-items:center;justify-content:center;padding:55px 15px 20px}
.viewer.open{display:flex}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.closeViewer{position:absolute;right:18px;top:15px;background:#171717;color:#fff;border:1px solid #444;border-radius:50%;width:40px;height:40px;font-size:22px}
.sidebarOverlay{display:none}
@media(max-width:760px){
.sidebar{position:fixed;left:0;top:0;bottom:0;width:275px;transform:translateX(-105%)}
.sidebar.open{transform:translateX(0)}
.sidebarOverlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:14}
.sidebarOverlay.open{display:block}
.menuButton{display:block}
header{height:58px;padding:0 14px}
.headerRight{display:none}
main{padding:25px 15px 145px}
.welcome{top:42%}
.welcome h1{font-size:39px}
.welcome p{font-size:13px}
.mediaGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.mediaItem img{height:130px}
.videoGrid{grid-template-columns:1fr}
.composerWrap{padding:15px 12px 10px}
.composer{border-radius:22px}
.userBubble{max-width:90%}
.answer{font-size:14px}
.answer h2{font-size:22px}
}
</style>
</head>

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="sideTop"><div class="brand">VEX<span> AI</span></div></div>
<button class="sideButton" id="newChat">＋ &nbsp; New chat</button>
<div class="sideHeading">RECENT CHATS</div>
<div class="historyList" id="historyList"></div>
<div class="sideBottom">
<button class="sideButton" id="settingsButton">⚙ &nbsp; Settings</button>
<div class="profile">
<div class="avatar">V</div>
<div><div style="font-size:13px;font-weight:600">VEX AI</div><small>Independent AI assistant</small></div>
</div>
</div>
</aside>

<div class="sidebarOverlay" id="sidebarOverlay"></div>

<section class="main">
<header>
<div class="headerLeft">
<button class="menuButton" id="menuButton">☰</button>
<div class="headerTitle">VEX AI</div>
<div class="headerVersion">V6</div>
</div>
<div class="headerRight">Independent AI experience</div>
</header>

<main id="mainArea">
<div class="welcome" id="welcome">
<h1>VEX AI</h1>
<p>Think freely. Ask anything.</p>
</div>
<div class="chat" id="chat"></div>
</main>

<div class="composerWrap">
<form class="composer" id="form">
<input id="question" autocomplete="off" placeholder="Message VEX AI..." aria-label="Ask VEX">
<button class="send" id="send" type="submit">↑</button>
</form>
<div class="composerHint">VEX AI can make mistakes. Verify important information.</div>
</div>
</section>
</div>

<div class="viewer" id="viewer" onclick="closeViewer()">
<button class="closeViewer" onclick="closeViewer()">×</button>
<img id="viewerImage" alt="Expanded image">
</div>

<script>
const API="https://puri.li";
const NATIVE_APP=new URLSearchParams(location.search).get("vex_native")==="1";
const nativePending=new Map();

const chat=document.getElementById("chat");
const input=document.getElementById("question");
const sendButton=document.getElementById("send");
const welcome=document.getElementById("welcome");
const historyList=document.getElementById("historyList");
const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("sidebarOverlay");
const mainArea=document.getElementById("mainArea");

const STOP=new Set(("the a an is are was were be been being do does did have has had can could would should will shall may might must i me my we our you your he she it they them this that these those what why how when where which who whom explain explanation tell me about please give show find search for of to in on at by from with without and or but if then than as into about after before over under more most much many some any there here its their his her").split(/\s+/));

function esc(v){
return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function cleanText(s){return String(s||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();}
function tokens(s){return cleanText(s.toLowerCase()).replace(/[^a-z0-9\s-]/g," ").split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));}
function unique(a){return [...new Set(a)];}
function overlapCount(text,terms){const t=new Set(tokens(text));return terms.filter(x=>t.has(x)).length;}
function safeURL(url){
try{const u=new URL(url);return ["http:","https:"].includes(u.protocol)?u.href:null;}
catch{return null;}
}
async function getJSON(url){
const r=await fetch(url,{headers:{"Accept":"application/json"}});
if(!r.ok)throw new Error("Service error "+r.status);
return r.json();
}

window.addEventListener("vex-native-progress",e=>{
const d=e.detail||{};
const p=nativePending.get(String(d.id));
if(p&&p.statusElement)p.statusElement.textContent=d.stage||"VEX is working...";
});

window.addEventListener("vex-native-result",e=>{
const d=e.detail||{};
const p=nativePending.get(String(d.id));
if(!p)return;
nativePending.delete(String(d.id));
if(d.error)p.reject(new Error(d.error));
else p.resolve(d.data||{});
});

function requestNative(query,statusElement){
return new Promise((resolve,reject)=>{
const id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);
nativePending.set(id,{resolve,reject,statusElement});
try{console.log("VEX_NATIVE_SEARCH:"+JSON.stringify({id,query}));}
catch(err){nativePending.delete(id);reject(err);}
});
}

function topicPhrase(q){
let s=q.toLowerCase().trim().replace(/[?!.]/g," ");
s=s.replace(/\b(explain|scientifically|in detail|in simple words|please|tell me|about)\b/g," ");
s=s.replace(/^\s*(what is|what are|why is|why are|why does|why do|how does|how do|how is|how are|who is|who was|when did|where is|can you|could you)\s+/,"");
s=s.replace(/^\s*(show|find|search|give|get|display)\s+(me\s+)?(only\s+)?(an?\s+)?(image|images|photo|photos|picture|pictures|video|videos)\s+(of\s+)?/,"");
s=s.replace(/\b(the|a|an)\b/g," ");
return s.replace(/\s+/g," ").trim()||q.trim();
}

function addSection(parent,label){
const w=document.createElement("section");
w.innerHTML='<div class="sectionLabel">'+esc(label)+'</div>';
parent.appendChild(w);
return w;
}

function sourceHTML(s){
const url=safeURL(s.url);
if(!url)return "";
let domain="";
try{domain=new URL(url).hostname}catch{}
return '<a class="source" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer"><b>'+esc(s.title||"Web source")+'</b><small>'+esc(s.description||"Relevant information")+'</small><small>'+esc(domain)+'</small></a>';
}

function renderAnswer(target,a){
const d=document.createElement("div");
d.className="answer";
let h="<h2>"+esc(a.title||"VEX AI")+"</h2>";
if(a.what)h+="<h3>Overview</h3><p>"+esc(a.what)+"</p>";
if(a.how?.length)h+="<h3>How it works</h3><ul>"+a.how.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";
if(a.uses?.length)h+="<h3>Why it matters</h3><ul>"+a.uses.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";
if(a.paragraphs?.length)h+=a.paragraphs.map(x=>"<p>"+esc(x)+"</p>").join("");
if(a.extra)h+="<h3>More to know</h3><p>"+esc(a.extra)+"</p>";
d.innerHTML=h;
target.appendChild(d);
}

function renderNativeImages(target,items){
const sec=addSection(target,"IMAGES");
const grid=document.createElement("div");
grid.className="mediaGrid";
(items||[]).slice(0,9).forEach(x=>{
const u=safeURL(x.image||x.url||x.thumbnail);
if(!u)return;
const card=document.createElement("div");
card.className="mediaItem";
const img=document.createElement("img");
img.src=u;img.alt=x.title||"VEX image";img.loading="lazy";
img.onclick=()=>openViewer(u);
img.onerror=()=>card.remove();
const cap=document.createElement("p");
cap.textContent=x.title||"Related image";
card.append(img,cap);
if(x.source){
const source=safeURL(x.source);
if(source){
const a=document.createElement("a");
a.href=source;a.target="_blank";a.rel="noopener noreferrer";
a.textContent="Image source";card.appendChild(a);
}
}
grid.appendChild(card);
});
if(!grid.children.length){sec.innerHTML+='<p class="empty">No relevant images found.</p>';return;}
sec.appendChild(grid);
}

function renderVideos(target,items){
const sec=addSection(target,"VIDEOS");
const grid=document.createElement("div");
grid.className="videoGrid";
(items||[]).slice(0,6).forEach(r=>{
const u=safeURL(r.url||r.link);
if(!u)return;
let id="";
try{
const x=new URL(u);
id=x.hostname.includes("youtu.be")?x.pathname.slice(1):x.searchParams.get("v")||"";
}catch{}
const card=document.createElement("div");
card.className="videoItem";
if(/^[\w-]{11}$/.test(id)){
const f=document.createElement("iframe");
f.src="https://www.youtube-nocookie.com/embed/"+id;
f.title=r.title||"Video";
f.loading="lazy";
f.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
f.allowFullscreen=true;
card.appendChild(f);
}
const a=document.createElement("a");
a.href=u;a.target="_blank";a.rel="noopener noreferrer";
a.textContent=r.title||"Watch video";
card.appendChild(a);
grid.appendChild(card);
});
if(!grid.children.length){sec.innerHTML+='<p class="empty">No relevant videos found.</p>';return;}
sec.appendChild(grid);
}

function renderNativeResult(body,data){
body.innerHTML="";
if(data.answer||data.explanation){
const answer=typeof data.answer==="string"?data.answer:(data.explanation||"");
const d=document.createElement("div");
d.className="answer";
const p=document.createElement("p");
p.textContent=answer;
d.appendChild(p);
body.appendChild(d);
}
const results=Array.isArray(data.results)?data.results:[];
if(results.length){
const sec=addSection(body,"WEB SOURCES");
const wrap=document.createElement("div");
wrap.className="sources";
results.slice(0,6).forEach(r=>{
const h=sourceHTML(r);
if(h)wrap.insertAdjacentHTML("beforeend",h);
});
if(wrap.children.length)sec.appendChild(wrap);
}
if(Array.isArray(data.images)&&data.images.length)renderNativeImages(body,data.images);
if(Array.isArray(data.videos)&&data.videos.length)renderVideos(body,data.videos);
}

function openViewer(url){
document.getElementById("viewerImage").src=url;
document.getElementById("viewer").classList.add("open");
}
function closeViewer(){
document.getElementById("viewer").classList.remove("open");
document.getElementById("viewerImage").src="";
}

function isImageOnly(q){
return /^(?:(?:show|give|find|display|get)\s+(?:me\s+)?(?:only\s+)?|only\s+)?(?:an?\s+)?(?:image|images|photo|photos|picture|pictures)(?:\s+of)?\s+.+$/i.test(q.trim())&&!/\b(explain|describe|what|why|how)\b/i.test(q);
}
function isVideoOnly(q){
return /^(?:(?:show|give|find|display|get)\s+(?:me\s+)?(?:only\s+)?|only\s+)?(?:a\s+)?(?:video|videos|clip|clips)(?:\s+of)?\s+.+$/i.test(q.trim())&&!/\b(explain|describe|what|why|how)\b/i.test(q);
}

async function searchImages(q){
try{
const d=await getJSON(API+"/api/images?q="+encodeURIComponent(q)+"&page=1");
const items=Array.isArray(d)?d:(d.images||d.results||d.items||[]);
return items.map(x=>({
title:x.title||x.name||"Image",
description:x.description||x.caption||"",
url:x.thumbUrl||x.thumbnail||x.image||x.url||x.src,
source:x.source||x.page_url||""
})).filter(x=>safeURL(x.url)).slice(0,12);
}catch{return [];}
}

async function searchWikimediaImages(q){
const url="https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(q)+"&gsrnamespace=6&gsrlimit=25&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=640&format=json&origin=*";
const d=await getJSON(url);
return Object.values(d.query?.pages||{}).map(p=>{
const i=p.imageinfo?.[0]||{};
const m=i.extmetadata||{};
return {
title:(p.title||"").replace(/^File:/,""),
description:cleanText(m.ImageDescription?.value||""),
url:i.thumburl||i.url,
source:"https://commons.wikimedia.org/wiki/"+encodeURIComponent(p.title||"")
};
}).filter(x=>safeURL(x.url)).slice(0,12);
}

async function showImages(target,q){
let items=await searchImages(q);
if(!items.length){
try{items=await searchWikimediaImages(q)}catch{}
}
const sec=addSection(target,"IMAGES");
if(!items.length){
sec.innerHTML+='<p class="empty">No relevant images found. Try a more specific description.</p>';
return;
}
const grid=document.createElement("div");
grid.className="mediaGrid";
items.slice(0,9).forEach(x=>{
const u=safeURL(x.url);
if(!u)return;
const card=document.createElement("div");
card.className="mediaItem";
const img=document.createElement("img");
img.src=u;img.alt=x.title;img.loading="lazy";
img.onclick=()=>openViewer(u);
img.onerror=()=>card.remove();
const cap=document.createElement("p");
cap.textContent=x.title;
card.append(img,cap);
const source=safeURL(x.source);
if(source){
const a=document.createElement("a");
a.href=source;a.target="_blank";a.rel="noopener noreferrer";
a.textContent="Image source";
card.appendChild(a);
}
grid.appendChild(card);
});
if(!grid.children.length){sec.innerHTML+='<p class="empty">Images could not be loaded.</p>';return;}
sec.appendChild(grid);
}

async function searchVideos(q){
const d=await getJSON(API+"/api/search?q="+encodeURIComponent("site:youtube.com/watch "+q)+"&page=1&exact=0");
const results=d.results||[];
const terms=unique(tokens(q));
return results.filter(r=>{
const url=r.url||"";
return /youtube\.com\/watch|youtu\.be\//i.test(url)&&overlapCount((r.title||"")+" "+(r.description||""),terms)>=1;
}).slice(0,6);
}

async function showVideos(target,q){
const sec=addSection(target,"VIDEOS");
try{
const items=await searchVideos(q);
if(!items.length){
sec.innerHTML+='<p class="empty">No relevant videos found.</p>';
return;
}
const grid=document.createElement("div");
grid.className="videoGrid";
items.forEach(r=>{
const u=safeURL(r.url);
if(!u)return;
let id="";
try{
const x=new URL(u);
id=x.hostname.includes("youtu.be")?x.pathname.slice(1):x.searchParams.get("v")||"";
}catch{}
const card=document.createElement("div");
card.className="videoItem";
if(/^[\w-]{11}$/.test(id)){
const f=document.createElement("iframe");
f.src="https://www.youtube-nocookie.com/embed/"+id;
f.title=r.title||"YouTube video";
f.loading="lazy";
f.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
f.allowFullscreen=true;
card.appendChild(f);
}
const a=document.createElement("a");
a.href=u;a.target="_blank";a.rel="noopener noreferrer";
a.textContent=r.title||"Watch video";
card.appendChild(a);
grid.appendChild(card);
});
sec.appendChild(grid);
}catch{
sec.innerHTML+='<p class="empty">Video search is temporarily unavailable.</p>';
}
}

async function searchResults(q){
const d=await getJSON(API+"/api/search?q="+encodeURIComponent(q)+"&page=1&exact=0");
return d.results||[];
}

function makeFollowups(q){
const t=topicPhrase(q);
return [
"Can you explain "+t+" with a real-world example?",
"What are the main benefits and limitations of "+t+"?",
"What should I learn next about "+t+"?"
];
}
function addFollowups(target,q){
const sec=addSection(target,"EXPLORE FURTHER");
const wrap=document.createElement("div");
wrap.className="followups";
makeFollowups(q).forEach(t=>{
const b=document.createElement("button");
b.className="followup";
b.textContent=t;
b.onclick=()=>ask(t);
wrap.appendChild(b);
});
sec.appendChild(wrap);
}

function addTools(target,q,text){
const wrap=document.createElement("div");
wrap.className="answerTools";
const copy=document.createElement("button");
copy.className="smallBtn";
copy.textContent="Copy answer";
copy.onclick=async()=>{
try{await navigator.clipboard.writeText(text);copy.textContent="Copied";}
catch{copy.textContent="Copy unavailable";}
};
const share=document.createElement("button");
share.className="smallBtn";
share.textContent="Share";
share.onclick=async()=>{
if(navigator.share){
try{await navigator.share({title:"VEX AI",text:q,url:location.href});}catch{}
}else{
try{await navigator.clipboard.writeText(q);share.textContent="Copied";}
catch{}
}
};
wrap.append(copy,share);
target.appendChild(wrap);
}

function addUserMessage(q){
const row=document.createElement("div");
row.className="message user";
const bubble=document.createElement("div");
bubble.className="userBubble";
bubble.textContent=q;
row.appendChild(bubble);
chat.appendChild(row);
mainArea.scrollTop=mainArea.scrollHeight;

const h=document.createElement("div");
h.className="historyItem";
h.textContent=q;
h.title=q;
h.onclick=()=>{newChat();ask(q);closeSidebar();};
historyList.prepend(h);
while(historyList.children.length>30)historyList.lastElementChild.remove();
}

function addAssistantMessage(){
const row=document.createElement("div");
row.className="message";
const body=document.createElement("div");
body.className="answer";
row.appendChild(body);
chat.appendChild(row);
return body;
}

async function ask(raw){
const q=raw.trim();
if(!q||sendButton.disabled)return;

welcome.style.display="none";
input.value="";
sendButton.disabled=true;
addUserMessage(q);

const body=addAssistantMessage();
body.innerHTML='<div class="loading">VEX is working...</div>';

try{
const topic=topicPhrase(q);
const imageOnly=isImageOnly(q);
const videoOnly=isVideoOnly(q);

if(imageOnly){
body.innerHTML="";
if(NATIVE_APP){
const data=await requestNative(q,body);
if(data.images?.length)renderNativeImages(body,data.images);
else await showImages(body,topic);
}else{
await showImages(body,topic);
}
}else if(videoOnly){
body.innerHTML="";
await showVideos(body,topic);
}else if(NATIVE_APP){
const data=await requestNative(q,body);
renderNativeResult(body,data);
if(/\b(video|videos|watch|youtube|clip|documentary)\b/i.test(q)&&!data.videos?.length){
await showVideos(body,topic);
}
}else{
const queries=unique([q,topic]);
const batches=await Promise.allSettled(queries.map(searchResults));
let results=[];
batches.forEach(x=>{if(x.status==="fulfilled")results.push(...x.value);});

const seen=new Set();
results=results.filter(r=>{
const u=safeURL(r.url);
if(!u||seen.has(u))return false;
seen.add(u);
return true;
});

const terms=unique(tokens(topic));
results=results.map(r=>{
const title=cleanText(r.title||"");
const description=cleanText(r.description||"");
const score=overlapCount(title,terms)*5+overlapCount(description,terms)*2;
return {...r,score};
}).filter(r=>r.score>0).sort((a,b)=>b.score-a.score).slice(0,6);

const answer=results.length?
{
title:"Understanding "+topic,
what:"Here is an overview based on the relevant web results available for this topic.",
how:results.slice(0,4).map(r=>cleanText(r.description||r.title)).filter(Boolean),
uses:[]
}:
{
title:"I couldn't find enough reliable information",
what:"The search service did not return enough relevant information to prepare a confident explanation.",
how:["Try adding more detail or context to your question.","You can also ask VEX to search for a specific person, place, technology or event."]
};

body.innerHTML="";
renderAnswer(body,answer);
addTools(body,q,body.innerText);

if(results.length){
const sec=addSection(body,"WEB SOURCES");
const wrap=document.createElement("div");
wrap.className="sources";
results.slice(0,5).forEach(r=>{
const h=sourceHTML(r);
if(h)wrap.insertAdjacentHTML("beforeend",h);
});
if(wrap.children.length)sec.appendChild(wrap);
}
await showImages(body,topic);
if(/\b(video|videos|watch|youtube|clip|documentary)\b/i.test(q))await showVideos(body,topic);
addFollowups(body,q);
}
}catch(e){
body.innerHTML='<p style="color:#ff9999">VEX could not reach the search service. Please try again.</p>';
}

mainArea.scrollTop=mainArea.scrollHeight;
sendButton.disabled=false;
input.focus();
}

function newChat(){
chat.innerHTML="";
welcome.style.display="block";
input.value="";
closeSidebar();
input.focus();
}

function closeSidebar(){
sidebar.classList.remove("open");
overlay.classList.remove("open");
}

document.getElementById("menuButton").onclick=()=>{
sidebar.classList.toggle("open");
overlay.classList.toggle("open");
};
overlay.onclick=closeSidebar;
document.getElementById("newChat").onclick=newChat;
document.getElementById("settingsButton").onclick=()=>{
alert("VEX AI Settings will be available in a future update.");
closeSidebar();
};

document.getElementById("form").addEventListener("submit",e=>{
e.preventDefault();
ask(input.value);
});

document.addEventListener("keydown",e=>{
if(e.key==="Escape"){closeViewer();closeSidebar();}
});
</script>
</body>
</html>
